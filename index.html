<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陕西省安管人员A类 · 安全生产考核</title>
<style>
:root{
  --bg:#0e1116; --bg2:#12161d; --surface:#171c25; --surface2:#1d232e;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#e9edf3; --muted:#97a1b2; --faint:#6b7689;
  --accent:#ff7a45; --accent2:#ffb088;
  --ok:#28c076; --ok-bg:rgba(40,192,118,.14); --ok-line:rgba(40,192,118,.5);
  --bad:#ff5a5f; --bad-bg:rgba(255,90,95,.13); --bad-line:rgba(255,90,95,.5);
  --warn:#ffce4d; --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --radius:18px;
}
html[data-theme="light"]{
  --bg:#eef1f5; --bg2:#e7ebf1; --surface:#ffffff; --surface2:#f4f6fa;
  --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.14);
  --text:#16202e; --muted:#5a6678; --faint:#8793a5;
  --accent:#e8590c; --accent2:#ff7a45;
  --ok:#16a34a; --ok-bg:rgba(22,163,74,.12); --ok-line:rgba(22,163,74,.4);
  --bad:#e11d48; --bad-bg:rgba(225,29,72,.10); --bad-line:rgba(225,29,72,.4);
  --warn:#d97706; --shadow:0 18px 50px -24px rgba(15,23,42,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); min-height:100dvh;
  -webkit-font-smoothing:antialiased; line-height:1.6;
  background-image:
    radial-gradient(1200px 600px at 12% -8%, rgba(255,122,69,.12), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(99,140,210,.10), transparent 55%);
  background-attachment:fixed;
}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:18px;
  box-shadow:0 8px 22px -8px var(--accent)}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.25}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--muted);transition:.2s;flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--line2);transform:translateY(-1px)}

/* ---------- home ---------- */
.hero{padding:26px 22px;border-radius:24px;background:linear-gradient(150deg,var(--surface),var(--surface2));
  border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:18px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,122,69,.22),transparent 70%)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent2);
  background:rgba(255,122,69,.12);border:1px solid rgba(255,122,69,.25);padding:4px 11px;border-radius:999px;margin-bottom:12px}
.hero h2{font-size:23px;line-height:1.3;margin:0 0 8px;font-weight:800;letter-spacing:.3px}
.hero p{margin:0;color:var(--muted);font-size:13.5px;max-width:46ch}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{padding:14px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}

.section-title{font-size:14px;color:var(--muted);margin:6px 2px 12px;font-weight:600;letter-spacing:.4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mode{padding:18px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);
  text-align:left;transition:.22s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.mode:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
.mode .mt{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.mode .mi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.mode h3{margin:0;font-size:15.5px;font-weight:700}
.mode p{margin:0;font-size:12.5px;color:var(--muted)}
.mode .arrow{position:absolute;right:14px;bottom:12px;color:var(--faint);font-size:16px}
.mi.a{background:rgba(255,122,69,.14);color:var(--accent)}
.mi.b{background:rgba(99,140,210,.16);color:#7aa0e6}
.mi.c{background:rgba(40,192,118,.14);color:var(--ok)}
.mi.d{background:rgba(255,206,77,.15);color:var(--warn)}

.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.sub{padding:16px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:.2s}
.sub:hover{transform:translateY(-2px);border-color:var(--line2)}
.sub b{font-size:17px;font-weight:800;display:block}
.sub span{font-size:12px;color:var(--muted)}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qbar .back{width:40px;height:40px}
.progress-wrap{flex:1}
.progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.progress-meta b{color:var(--text)}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s cubic-bezier(.16,1,.3,1)}

.qcard{padding:20px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);margin-bottom:14px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px}
.badge.single{background:rgba(255,122,69,.15);color:var(--accent)}
.badge.multiple{background:rgba(99,140,210,.16);color:#7aa0e6}
.badge.judge{background:rgba(40,192,118,.15);color:var(--ok)}
.qnum{font-size:12.5px;color:var(--muted)}
.fav{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--faint);transition:.2s}
.fav.on{color:var(--warn);border-color:rgba(255,206,77,.4);background:rgba(255,206,77,.12)}

.qimg{margin:4px 0 14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);
  display:flex;justify-content:center;cursor:zoom-in}
.qimg img{max-width:100%;max-height:380px;display:block}
.stem{font-size:16.5px;font-weight:600;line-height:1.7;margin:0 0 4px;word-break:break-word}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface2);transition:.18s;text-align:left;width:100%}
.opt:hover{border-color:var(--line2);transform:translateY(-1px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;font-size:14px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);transition:.18s}
.opt .t{flex:1;font-size:15px;line-height:1.55;padding-top:2px;word-break:break-word}
.opt.sel{border-color:var(--accent);background:rgba(255,122,69,.10)}
.opt.sel .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.lock{pointer-events:none}

.feedback{margin-top:14px;padding:13px 15px;border-radius:14px;font-size:14px;display:none;align-items:flex-start;gap:10px}
.feedback.show{display:flex;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.feedback.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}
.feedback .fb-ic{font-weight:800;font-size:16px;flex:none}
.feedback .fb-txt b{color:var(--text)}
.feedback .ans{font-weight:800;color:var(--text)}

.submit-row{margin-top:14px;display:none}
.submit-row.show{display:block}

.bottom{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;font-size:15px;transition:.2s;
  border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--line2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
  box-shadow:0 10px 26px -10px var(--accent)}
.btn.ghost{flex:none;width:54px}
.btn.sheet{flex:none;min-width:108px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;z-index:50;padding:18px}
.mask.show{display:flex;animation:fade .2s}
.sheet-modal{width:100%;max-width:520px;max-height:84dvh;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.sheet-modal h3{margin:0 0 4px;font-size:17px}
.sheet-modal .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  font-size:13px;font-weight:700;color:var(--muted);display:grid;place-items:center;transition:.15s}
.cell:hover{border-color:var(--line2);color:var(--text)}
.cell.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px rgba(255,122,69,.25)}
.cell.right{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.cell.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.cell.done{background:rgba(255,122,69,.10);color:var(--accent);border-color:rgba(255,122,69,.3)}

.zoom img{max-width:100%;max-height:82dvh;border-radius:12px}
.result-modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:26px 22px;text-align:center;box-shadow:var(--shadow)}
.score{font-size:60px;font-weight:800;line-height:1;margin:6px 0}
.score.pass{color:var(--ok)} .score.fail{color:var(--bad)}
.result-modal h3{margin:0;font-size:20px}
.result-modal .rsub{color:var(--muted);font-size:13.5px;margin:8px 0 16px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.rstats div{padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.rstats b{display:block;font-size:20px}
.rstats span{font-size:11.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--surface);border:1px solid var(--line2);color:var(--text);padding:11px 18px;border-radius:999px;
  font-size:13.5px;box-shadow:var(--shadow);transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:560px){
  .modes{grid-template-columns:1fr}
  .subgrid{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(6,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand h1{font-size:14.5px}
  .hero h2{font-size:20px}
}
.catbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:6px;scrollbar-width:thin}
.catbar::-webkit-scrollbar{height:6px}
.catbar::-webkit-scrollbar-thumb{background:var(--line2);border-radius:999px}
.chip{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px var(--accent)}
.chip .cn{opacity:.55;font-weight:400;font-size:11px;margin-left:6px}
.basis{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);font-size:12.5px;line-height:1.55;opacity:.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <div class="topbar">
      <div class="brand">
        <div class="logo">陕</div>
        <div>
          <h1>陕西省安管人员 · 安全生产考核</h1>
          <p>A类 / C1类 / C2类 / 安全生产知识</p>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" title="切换主题">🌓</button>
    </div>

    <div class="hero">
      <span class="tag">● 驾考模式 · 看图答题</span>
      <h2>像考驾照一样练题，<br>逢错即纠，稳过考核</h2>
      <p>顺序 / 随机 / 专项练习，模拟考试计时评分，自动收录错题与收藏，进度本地保存。</p>
    </div>

    <div class="stats" id="homeStats"></div>

    <div class="section-title">题库类目</div>
    <div class="catbar" id="catBar"></div>

    <div class="section-title">练习模式</div>
    <div class="modes">
      <button class="mode" data-mode="seq">
        <div class="mt"><div class="mi a">📑</div><div><h3>顺序练习</h3></div></div>
        <p>按题库顺序逐题作答，巩固全部考点</p><span class="arrow">›</span>
      </button>
      <button class="mode" data-mode="rand">
        <div class="mt"><div class="mi b">🔀</div><div><h3>随机练习</h3></div></div>
        <p>打乱顺序抽题，检验真实掌握度</p><span class="arrow">›</span>
      </button>
      <button class="mode" data-mode="exam">
        <div class="mt"><div class="mi c">⏱️</div><div><h3>模拟考试</h3></div></div>
        <p>50题限时45分钟，考完即出成绩</p><span class="arrow">›</span>
      </button>
      <button class="mode" data-mode="wrong">
        <div class="mt"><div class="mi d">📕</div><div><h3>错题重练</h3></div></div>
        <p>只练当前类目下答错的题，反复巩固</p><span class="arrow">›</span>
      </button>
    </div>

    <div class="section-title">专项练习（按题型）</div>
    <div class="subgrid" id="typeGrid"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qbar">
      <button class="icon-btn back" id="backBtn" title="返回">‹</button>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="modeLabel">顺序练习</span>
          <span><b id="curNum">1</b> / <span id="totNum">0</span> · 正确率 <b id="accNum">--</b></span>
        </div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </div>

    <div class="qcard">
      <div class="qhead">
        <span class="badge" id="qBadge">单选</span>
        <span class="qnum" id="qTypeInfo"></span>
        <button class="fav" id="favBtn" title="收藏">★</button>
      </div>
      <div class="qimg hidden" id="qImg"><img id="qImgEl" alt="题目配图"></div>
      <p class="stem" id="qStem"></p>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback" aria-live="polite">
        <span class="fb-ic" id="fbIc"></span>
        <span class="fb-txt" id="fbTxt"></span>
      </div>
      <div class="submit-row" id="submitRow">
        <button class="btn primary" id="submitBtn" style="width:100%">提交答案</button>
      </div>
    </div>

    <div class="bottom">
      <button class="btn ghost" id="prevBtn">‹ 上一题</button>
      <button class="btn sheet" id="sheetBtn">答题卡</button>
      <button class="btn primary" id="nextBtn">下一题 ›</button>
    </div>
  </section>
</div>

<!-- SHEET MODAL -->
<div class="mask" id="sheetMask">
  <div class="sheet-modal">
    <h3>答题卡</h3>
    <p class="sub" id="sheetSub"></p>
    <div class="legend">
      <span><i style="background:var(--surface2)"></i>未答</span>
      <span><i style="background:var(--ok)"></i>答对</span>
      <span><i style="background:var(--bad)"></i>答错</span>
      <span><i style="background:var(--accent)"></i>已答</span>
      <span><i style="border:2px solid var(--accent);background:transparent"></i>当前</span>
    </div>
    <div class="grid" id="sheetGrid"></div>
    <div style="text-align:right;margin-top:16px">
      <button class="btn ghost" id="sheetClose" style="width:auto;padding:10px 18px">关闭</button>
    </div>
  </div>
</div>

<!-- ZOOM MODAL -->
<div class="mask" id="zoomMask"><div class="zoom"><img id="zoomImg" alt="放大查看"></div></div>

<!-- RESULT MODAL -->
<div class="mask" id="resultMask">
  <div class="result-modal">
    <h3 id="resTitle">考试结束</h3>
    <div class="score" id="resScore">0</div>
    <p class="rsub" id="resSub"></p>
    <div class="rstats">
      <div><b id="resRight">0</b><span>答对</span></div>
      <div><b id="resWrong">0</b><span>答错</span></div>
      <div><b id="resRate">0%</b><span>正确率</span></div>
    </div>
    <button class="btn primary" id="resReview" style="width:100%;margin-bottom:10px">查看错题</button>
    <button class="btn" id="resHome" style="width:100%">返回首页</button>
  </div>
</div>

<script>

重大事故隐患判定标准（2024版）》第二条","image":null},{"id":1102,"category":"安全生产知识","type":"single","seq":2,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，使用国家明令禁止和限制使用的危害程度较大、可能导致（   ）或造成重大经济损失的施工工艺、设备和材料，应判定为重大事故隐。","options":[{"key":"A","text":"较大事故"},{"key":"B","text":"重大事故"},{"key":"C","text":"特别重大事故"},{"key":"D","text":"群死群伤"}],"answer":"D","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第二条","image":null},{"id":1103,"category":"安全生产知识","type":"single","seq":3,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，临时设施是指：施工期间临时（   ）及使用的各种建筑物、构筑物。","options":[{"key":"A","text":"搭建、租赁"},{"key":"B","text":"建设、租赁"},{"key":"C","text":"搭建"},{"key":"D","text":"租赁"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，术语2.0.4","image":null},{"id":1104,"category":"安全生产知识","type":"single","seq":4,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，建设工程总承包单位应对施工现场的环境与卫生负（   ）。","options":[{"key":"A","text":"次要责任"},{"key":"B","text":"管理责任"},{"key":"C","text":"总责"},{"key":"D","text":"主要责任"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.1条","image":null},{"id":1105,"category":"安全生产知识","type":"single","seq":5,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，当施工现场发生有环境、卫生关等突发事件时，应按相关规定及时向施工现场所在地（   ）报告，并应配合调查处置。","options":[{"key":"A","text":"质监站"},{"key":"B","text":"建设行政主管部门和相关部门"},{"key":"C","text":"建设单位"},{"key":"D","text":"监理单位"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.5条","image":null},{"id":1106,"category":"安全生产知识","type":"single","seq":6,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场应实行封闭管理，并应采用硬质围挡。市区主要路段的施工现场围挡高度不应低于（   ），一般路段围挡高度不应低于（   ），围挡应牢固、稳定、整洁。距离交通路口（   ）范围内占据道路施工设置的围挡，其（   ）以上部分应采用通透性围挡，并应采取交通疏导和警示措施。","options":[{"key":"A","text":"2.5m、1.8m、20m、 0.8m"},{"key":"B","text":"2m、1.5m、20m、 0.8m"},{"key":"C","text":"2.5m、1.8m、25m、 1m"},{"key":"D","text":"2.5m、1.8m、20m、 1m"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.8条","image":null},{"id":1107,"category":"安全生产知识","type":"single","seq":7,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场周转材料宜采用金属、化学合成材料等可回收再利用产品代替，并应加强保养维护，提高（   ）。","options":[{"key":"A","text":"利用率"},{"key":"B","text":"使用率"},{"key":"C","text":"周转率"},{"key":"D","text":"回收率"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.1.3条","image":null},{"id":1108,"category":"安全生产知识","type":"single","seq":8,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，有毒有害作业场所应在醒目位置设置安全警示标识，并应符合现行国家标准（   ）的规定，施工单位应依据有关规定对从事有职业病危害作业的人员定期进行体检和培训。","options":[{"key":"A","text":"《工作职业病危害警示标识》 GBZ158"},{"key":"B","text":"《工作场所职业病危害警示标识》 GBZ159"},{"key":"C","text":"《工作场所职业病危害警示》 GBZ158"},{"key":"D","text":"《工作场所职业病危害警示标识》 GBZ158"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.11条","image":null},{"id":1109,"category":"安全生产知识","type":"single","seq":9,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场宜设置（   ）设施、宜对雨水进行收集利用。","options":[{"key":"A","text":"污水处理"},{"key":"B","text":"废水回收、循环再利用"},{"key":"C","text":"雨水回收"},{"key":"D","text":"抽水"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.1.9条","image":null},{"id":1110,"category":"安全生产知识","type":"single","seq":10,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场的主要道路要进行（   ），裸露的场地和堆放的土方应采取覆盖、固化或绿化等措施。","options":[{"key":"A","text":"硬化处理"},{"key":"B","text":"覆盖处理"},{"key":"C","text":"防尘处理"},{"key":"D","text":"洒水处理"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.1条","image":null},{"id":1111,"category":"安全生产知识","type":"single","seq":11,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场存放的油料和化学溶剂等物品应设置专用库房，地面应进行（   ）。","options":[{"key":"A","text":"绝缘处理"},{"key":"B","text":"硬化处理"},{"key":"C","text":"防动物处理"},{"key":"D","text":"防渗漏处理"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.3.4条","image":null},{"id":1112,"category":"安全生产知识","type":"single","seq":12,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，未经（   ）批准，施工现场和生活区不得使用电热器具。","options":[{"key":"A","text":"建设单位"},{"key":"B","text":"施工总承包单位"},{"key":"C","text":"监理单位"},{"key":"D","text":"分包单位"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.23条","image":null},{"id":1113,"category":"安全生产知识","type":"single","seq":13,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，当事故现场遇突发疫情时，应（   ），并应按卫生防疫部门的相关规定进行处理。","options":[{"key":"A","text":"及时上报"},{"key":"B","text":"自行隔离"},{"key":"C","text":"自行就医"},{"key":"D","text":"隐瞒不报"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.2.8条","image":null},{"id":1114,"category":"安全生产知识","type":"single","seq":14,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工人员是指：在施工现场从事施工活动的（   ），包括建设、施工、监理等各方参建人员。","options":[{"key":"A","text":"劳务人员"},{"key":"B","text":"管理人员和作业人员"},{"key":"C","text":"施工人员"},{"key":"D","text":"管理人员"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第2.0.5条","image":null},{"id":1115,"category":"安全生产知识","type":"single","seq":15,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场临时设施、临时道路的设置应科学合理，并应符合（   ）等有关规定。","options":[{"key":"A","text":"安全、消防、节能、环保"},{"key":"B","text":"安全、消防、环保、便捷"},{"key":"C","text":"安全、消防、节能、回收"},{"key":"D","text":"安全、消防、节能、再利用"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.7条","image":null},{"id":1116,"category":"安全生产知识","type":"single","seq":16,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，建设工程的环境与卫生管理应纳入（  ），应明确环境与卫生管理的目标和措施。","options":[{"key":"A","text":"应急预案"},{"key":"B","text":"专项方案"},{"key":"C","text":"施工组织设计或编制专项方案"},{"key":"D","text":"安全生产规章制度和操作规程"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.2条","image":null},{"id":1117,"category":"安全生产知识","type":"single","seq":17,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，建设工程的参与建设单位应根据法律的规定，针对可能发生的环境、卫生等突发事件建立（   ），制定相应的应急预案并组织演练。","options":[{"key":"A","text":"生产体系"},{"key":"B","text":"管理体系"},{"key":"C","text":"应急体系"},{"key":"D","text":"应急管理体系"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.4条","image":null},{"id":1118,"category":"安全生产知识","type":"single","seq":18,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，根施工现场出入口应标有企业名称或企业标识。 主要出入口明显处应设置（   ），施工现场大门内应有施工现场总平面图和安全管理、环境保护与绿色施工、消防保卫等制度牌和宣传栏。","options":[{"key":"A","text":"环境监测系统"},{"key":"B","text":"工程概况牌"},{"key":"C","text":"主要负责人信息"},{"key":"D","text":"工程名称"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第3.0.9条","image":null},{"id":1119,"category":"安全生产知识", 景点、重点文物保护区及人口密集区的施工现场应使用（   ）能源。","options":[{"key":"A","text":"可再利用"},{"key":"B","text":"新型"},{"key":"C","text":"清洁"},{"key":"D","text":"安全"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.9条","image":null},{"id":1132,"category":"安全生产知识","type":"single","seq":32,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场应设置排水管及（   ）， 施工污水应经沉淀处理达到排放标准后，方可排入市政污水管网。","options":[{"key":"A","text":"沉淀池"},{"key":"B","text":"净化池"},{"key":"C","text":"污水池"},{"key":"D","text":"化粪池"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.3.1条","image":null},{"id":1133,"category":"安全生产知识","type":"single","seq":33,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场临时厕所的化粪池应进行（   ）。","options":[{"key":"A","text":"防火处理"},{"key":"B","text":"防噪音处理"},{"key":"C","text":"防渗漏处理"},{"key":"D","text":"防下沉处理"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.3.3条","image":null},{"id":1134,"category":"安全生产知识","type":"single","seq":34,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，因生产工艺要求或其他特殊要求，确需进行夜间施工的， 施工单位因加强（   ），并减少人为噪声。","options":[{"key":"A","text":"光污染控制"},{"key":"B","text":"噪声控制"},{"key":"C","text":"防尘控制"},{"key":"D","text":"污水控制"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.4.4条","image":null},{"id":1135,"category":"安全生产知识","type":"single","seq":35,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，生活区、办公区的通道、楼梯处应设置（   ）。","options":[{"key":"A","text":"应急疏散、逃生指示标识"},{"key":"B","text":"应急疏散、应急照明灯"},{"key":"C","text":"应急疏散、逃生指示标识和应急照明灯"},{"key":"D","text":"逃生指示标识和应急照明灯"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.2条","image":null},{"id":1136,"category":"安全生产知识","type":"single","seq":36,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，宿舍内宜设置（   ）装置。","options":[{"key":"A","text":"灭火"},{"key":"B","text":"充电"},{"key":"C","text":"热水"},{"key":"D","text":"烟感报警"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.2条","image":null},{"id":1137,"category":"安全生产知识","type":"single","seq":37,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场应设置封闭式（   ）","options":[{"key":"A","text":"医疗室"},{"key":"B","text":"建筑垃圾站"},{"key":"C","text":"茶水间"},{"key":"D","text":"吸烟室"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.3条","image":null},{"id":1138,"category":"安全生产知识","type":"single","seq":38,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，食堂应设置（   ），并应定期清理。","options":[{"key":"A","text":"烟感报警"},{"key":"B","text":"环境报警"},{"key":"C","text":"防疫设施"},{"key":"D","text":"隔油池"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.11条","image":null},{"id":1139,"category":"安全生产知识","type":"single","seq":39,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，食堂使用燃气的食堂，燃气罐应单独设置存放间并应加装（   ），存放间应通风良好并严禁存放其他物品，供气单位资质应齐全，气源应有可追溯性。","options":[{"key":"A","text":"燃气报警装置"},{"key":"B","text":"隔油池"},{"key":"C","text":"油烟净化器"},{"key":"D","text":"止回阀"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.14条","image":null},{"id":1140,"category":"安全生产知识","type":"single","seq":40,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场应设置水冲式或移动式厕所，厕所地面应硬化，门窗应齐全并通风良好，侧位宜设置门及隔板，高度不应小于（   ）。","options":[{"key":"A","text":"1m"},{"key":"B","text":"0.9m"},{"key":"C","text":"1.5m"},{"key":"D","text":"1.2m"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.18条","image":null},{"id":1141,"category":"安全生产知识","type":"single","seq":41,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，易燃易爆危险品库房应使用不燃材料搭建，面积不应超过（   ）。","options":[{"key":"A","text":"100㎡"},{"key":"B","text":"150㎡"},{"key":"C","text":"200㎡"},{"key":"D","text":"50㎡"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.17条","image":null},{"id":1142,"category":"安全生产知识","type":"single","seq":42,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场宜采用集中供暖， 使用炉火取暖时应采取防止（   ）中毒的措施，彩钢板活动房严禁使用炉火或明火取暖。","options":[{"key":"A","text":"一氧化碳"},{"key":"B","text":"二氧化碳"},{"key":"C","text":"氧化氢"},{"key":"D","text":"一氧化氮"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.7条","image":null},{"id":1143,"category":"安全生产知识","type":"single","seq":43,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场办公应利用（   ）管理，减少办公用品的使用及消耗。","options":[{"key":"A","text":"信息化"},{"key":"B","text":"常态化"},{"key":"C","text":"动态"},{"key":"D","text":"节能化"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.1.5条","image":null},{"id":1144,"category":"安全生产知识","type":"single","seq":44,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，环境保护是指：（   ）。","options":[{"key":"A","text":"为解决环境问题，协调人类与环境的关系，保障经济社会的健康持续发展而采取的各种活动的总称。"},{"key":"B","text":"为解决现实的或潜在的环境问题，协调人类与环境的关系，保障经济社会的健康而采取的各种活动的总称。"},{"key":"C","text":"为解决现实的或潜在的环境问题，协调人类与环境的关系，保障经济社会的健康持续发展而采取的各种活动的总称。"},{"key":"D","text":"为解决现实的或潜在的环境问题，保障经济社会的健康持续发展而采取的各种活动的总称。"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第2.0.1条","image":null},{"id":1145,"category":"安全生产知识","type":"single","seq":45,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，废弃的降水井应及时（   ），并应封闭井口，防止污染地下水。","options":[{"key":"A","text":"覆盖措施"},{"key":"B","text":"围挡"},{"key":"C","text":"标识"},{"key":"D","text":"回填"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.3.2条","image":null},{"id":1146,"category":"安全生产知识","type":"single","seq":46,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，（   ）应设置在远离厕所、垃圾站、有毒有害场所等有污染源的地方。","options":[{"key":"A","text":"食堂"},{"key":"B","text":"料场"},{"key":"C","text":"钢筋加工棚"},{"key":"D","text":"木工加工棚"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.10条","image":null},{"id":1147,"category":"安全生产知识","type":"single","seq":47,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，食堂应取得（   ），并应悬挂在制作间醒目位置，炊事人员必须经体检合格并持证上岗。","options":[{"key":"A","text":"营业执照"},{"key":"B","text":"健康证"},{"key":"C","text":"相关部门颁发的许可证"},{"key":"D","text":"施工许可证"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.2.2条","image":null},{"id":1148,"category":"安全生产知识","type":"single","seq":48,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，炊事人员上岗应穿戴整洁的工作服、 工作帽和口罩， 并应保持个人卫生，（   ）不得随意进入食堂制作间。","options":[{"key":"A","text":"劳务人员"},{"key":"B","text":"管理人员"},{"key":"C","text":"材料员"},{"key":"D","text":"以上答案正确"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.2.3条","image":null},{"id":1149,"category":"安全生产知识","type":"single","seq":49,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，粮食存放台距墙和地面应大于（   ）。","options":[{"key":"A","text":"0.2m"},{"key":"B","text":"0.5m"},{"key":"C","text":"1m"},{"key":"D","text":"0.8m"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.2.7条","image":null},{"id":1150,"category":"安全生产知识","type":"single","seq":50,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，食堂制作间的炊具宜存放在封闭的的橱柜内，刀、盆、案板等炊具应（   ）。","options":[{"key":"A","text":"单独存放"},{"key":"B","text":"生熟分开"},{"key":"C","text":"一起存放"},{"key":"D","text":"乱放"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.1.15条","image":null},{"id":1151,"category":"安全生产知识","type":"single","seq":51,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场的机械设备、车辆的尾气排放应符合（   ）。","options":[{"key":"A","text":"环保标准"},{"key":"B","text":"市环保标准"},{"key":"C","text":"环境标准"},{"key":"D","text":"国家环保排放标准"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.10条","image":null},{"id":1152,"category":"安全生产知识","type":"single","seq":52,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，建筑物内垃圾应采用容器或搭设专用封闭式垃圾道的方式清运， 严禁（   ）。","options":[{"key":"A","text":"凌空抛掷"},{"key":"B","text":"覆盖处理"},{"key":"C","text":"堆载"},{"key":"D","text":"封闭式清运"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.5条","image":null},{"id":1153,"category":"安全生产知识","type":"single","seq":53,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，当市政道路施工进行铣刨、切割等作业时，应采取有效的（   ）。","options":[{"key":"A","text":"降噪措施"},{"key":"B","text":"安全措施"},{"key":"C","text":"围挡"},{"key":"D","text":"防扬尘措施"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.8条","image":null},{"id":1154,"category":"安全生产知识","type":"single","seq":54,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，建筑垃圾是指：在新建、 扩建、改建各类房屋建筑与市政基础设施工程施工过程中产生的（   ）。","options":[{"key":"A","text":"垃圾"},{"key":"B","text":"弃土、弃料及其他废弃物"},{"key":"C","text":"废弃物"},{"key":"D","text":"弃疗"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第2.0.6条","image":null},{"id":1155,"category":"安全生产知识","type":"single","seq":55,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，水泥和其他易飞扬的细颗粒建筑材料应（   ）措施。","options":[{"key":"A","text":"覆盖"},{"key":"B","text":"密闭存放"},{"key":"C","text":"露天存放"},{"key":"D","text":"密闭存放或采取覆盖"}],"answer":"D","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.7条","image":null},{"id":1156,"category":"安全生产知识","type":"single","seq":56,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，当环境空气质量指数达到中度及以上的污染时，施工现场应（   ），减少宜造成大气污染的施工作业。","options":[{"key":"A","text":"停工"},{"key":"B","text":"覆盖"},{"key":"C","text":"增加洒水频次，加强覆盖措施"},{"key":"D","text":"洒水"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.11条","image":null},{"id":1157,"category":"安全生产知识","type":"single","seq":57,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，办公区和生活区应设（   ），并应采取灭鼠、灭蚊蝇、灭蟑螂等措施。","options":[{"key":"A","text":"帮厨人员"},{"key":"B","text":"专职或兼职保洁员"},{"key":"C","text":"厨师"},{"key":"D","text":"水电工"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第5.2.1条","image":null},{"id":1158,"category":"安全生产知识","type":"single","seq":58,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场应保护（   ）。采取施工降水时应执行国家及当地有关水资源保护的规定，并应综合利用抽排出的地下水。","options":[{"key":"A","text":"环境资源"},{"key":"B","text":"地下水资源"},{"key":"C","text":"水土资源"},{"key":"D","text":"水资源"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.1.7条","image":null},{"id":1159,"category":"安全生产知识","type":"single","seq":59,"stem":"《建设工程施工现场环境与卫生标准》JGJ146-2013是（   ）开始实施的。","options":[{"key":"A","text":"2013年6月1日"},{"key":"B","text":"2013年11月8日"},{"key":"C","text":"2014年6月1日"},{"key":"D","text":"2014年5月1日"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013","image":null},{"id":1160,"category":"安全生产知识","type":"single","seq":60,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场严禁（   ）各类废弃物。","options":[{"key":"A","text":"焚烧"},{"key":"B","text":"再利用"},{"key":"C","text":"回收"},{"key":"D","text":"运输"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ146-2013，第4.2.6条","image":null},{"id":1161,"category":"安全生产知识","type":"single","seq":61,"stem":"根据《建设工程施工现场环境与卫生标准》JGJ146-2013，施工现场应对强光作业和照明灯具采取（   ）措施， 减少对周边居民和环境的影响。","options":[{"key":"A","text":"安全"},{"key":"B","text":"节能"},{"key":"C","text":"遮挡"},{"key":"D","text":"封闭"}],"answer":"C","basis":"《建设工程施工现场环境与卫生标 :"根据《施工企业安全生产管理规范》GB50656-2011，建筑施工企业应定期对从业人员（   ）情况进行审核、检查，并应及时统计、汇总从业人员的安全教育培训和资格认定等相关记录。","options":[{"key":"A","text":"学历认定"},{"key":"B","text":"技能认定"},{"key":"C","text":"持证上岗"},{"key":"D","text":"安全交底"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第7.0.9条","image":null},{"id":1175,"category":"安全生产知识","type":"single","seq":75,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，建筑施工企业各管理层相关负责人必须在其管辖范围内，按专款专用、及时足额的要求，组织落实（   ）。","options":[{"key":"A","text":"安全生产费用使用计划"},{"key":"B","text":"安全教育培训"},{"key":"C","text":"安全检查"},{"key":"D","text":"安全交底"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第8.0.4条","image":null},{"id":1176,"category":"安全生产知识","type":"single","seq":76,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，建筑施工企业各管理层应定期对下一级管理层的安全生产费用使用计划的实施情况进行（   ）。","options":[{"key":"A","text":"分析"},{"key":"B","text":"总结"},{"key":"C","text":"监督审查和考核"},{"key":"D","text":"合理安排"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第8.0.6条","image":null},{"id":1177,"category":"安全生产知识","type":"single","seq":77,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，建筑施工企业应根据安全管理目标，生产经营特点、规模、环境等，配备符合（   ）的施工设施、设备、劳动保护用品及相关的安全检测器具。","options":[{"key":"A","text":"质量要求"},{"key":"B","text":"生产要求"},{"key":"C","text":"安全生产要求"},{"key":"D","text":"进度要求"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第9.0.2条","image":null},{"id":1178,"category":"安全生产知识","type":"single","seq":78,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，生产经营活动内容可能包含机械设备的施工企业，应按规定设置相应的（   ）或者配备专职的人员进行设备管理。","options":[{"key":"A","text":"设备管理机构"},{"key":"B","text":"安全机构"},{"key":"C","text":"管理机构"},{"key":"D","text":"生产机构"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第9.0.3条","image":null},{"id":1179,"category":"安全生产知识","type":"single","seq":79,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业应定期分析施工设施、设备、劳动防护用品及相关的安全检测器具的（   ）采取必要的改进措施。","options":[{"key":"A","text":"使用情况"},{"key":"B","text":"安全状态"},{"key":"C","text":"仓储情况"},{"key":"D","text":"监测状态"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB50656-2011，第9.0.5条","image":null},{"id":1180,"category":"安全生产知识","type":"single","seq":80,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业安全技术管理应包括对（   ）的制订、实施、改进等管理。","options":[{"key":"A","text":"安全管理"},{"key":"B","text":"安全检查"},{"key":"C","text":"安全交底"},{"key":"D","text":"安全技术措施"}],"answer":"D","basis":"《施工企业安全生产管理规范》GB50656-2011，第10.0.1条","image":null},{"id":1181,"category":"安全生产知识","type":"single","seq":81,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业各管理层的技术负责人应对管理范围的（   ）负责。","options":[{"key":"A","text":"安全责任"},{"key":"B","text":"安全技术管理"},{"key":"C","text":"质量管理"},{"key":"D","text":"生产管理"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB50656-2011，第10.0.2条","image":null},{"id":1182,"category":"安全生产知识","type":"single","seq":82,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业的工程项目部应接受建设行政主管部门及其他相关部门的（   ），对发现的问题应按要求落实整改。","options":[{"key":"A","text":"管理"},{"key":"B","text":"检测"},{"key":"C","text":"监督检查"},{"key":"D","text":"教育培训"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.2条","image":null},{"id":1183,"category":"安全生产知识","type":"single","seq":83,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业应建立应急救援组织机构，明确领导小组，设立专家库，组建救援队伍，并进行（   ）。","options":[{"key":"A","text":"专项管理"},{"key":"B","text":"应急管理"},{"key":"C","text":"日常管理"},{"key":"D","text":"动态分析"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第13.0.2条","image":null},{"id":1184,"category":"安全生产知识","type":"single","seq":84,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业各管理层应对全体从业人员进行（   ）；定期组织专项应急演练；接受相关报告后，及时启动预案。","options":[{"key":"A","text":"针对性的培训和交底"},{"key":"B","text":"安全早会"},{"key":"C","text":"安全教育培训"},{"key":"D","text":"安全技术交底"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第13.0.5条","image":null},{"id":1185,"category":"安全生产知识","type":"single","seq":85,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业应根据应急预案演练、实战的结果，对事故应急预案的（   ）组织评价，必要时进行修改和完善。","options":[{"key":"A","text":"适宜性和可操作性"},{"key":"B","text":"适用性"},{"key":"C","text":"合理性"},{"key":"D","text":"科学性"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第13.0.6条","image":null},{"id":1186,"category":"安全生产知识","type":"single","seq":86,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，生产安全事故发生后，施工企业应按规定及时上报。实行施工总承包时，应由（   ）负责上报，情况紧急时，可越级上报。","options":[{"key":"A","text":"总承包企业"},{"key":"B","text":"建设单位"},{"key":"C","text":"监理单位"},{"key":"D","text":"专业分包单位"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第14.0.2条","image":null},{"id":1187,"category":"安全生产知识","type":"single","seq":87,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，生产安全事故报告后出现新情况时，应（   ）。","options":[{"key":"A","text":"及时上报"},{"key":"B","text":"及时补报"},{"key":"C","text":"上报"},{"key":"D","text":"补报"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB50656-2011，第14.0.4条","image":null},{"id":1188,"category":"安全生产知识","type":"single","seq":88,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业对安全检查中发现的问题，宜按隐患类别分类记录，定期统计，并应分析确定（   ），制订实施治理措施。","options":[{"key":"A","text":"危险源"},{"key":"B","text":"分部分项工程"},{"key":"C","text":"危险性较大的分部分项工程"},{"key":"D","text":"多发和重大隐患类别"}],"answer":"D","basis":"《施工企业安全生产管理规范》GB50656-2011，第15.0.5条","image":null},{"id":1189,"category":"安全生产知识","type":"single","seq":89,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业应根据施工组织设计、专项施工方案（措施）的审核、审批权限，组织相关职能部门审核，（   ）审批。","options":[{"key":"A","text":"部门负责人"},{"key":"B","text":"项目经理"},{"key":"C","text":"企业技术负责人"},{"key":"D","text":"项目技术负责人"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第10.0.5条","image":null},{"id":1190,"category":"安全生产知识","type":"single","seq":90,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业应根据施工组织设计、专项安全施工方案（措施）的编制和审批权限的设置，分级进行（   ）。","options":[{"key":"A","text":"安全教育"},{"key":"B","text":"安全技术交底"},{"key":"C","text":"安全检查"},{"key":"D","text":"安全验收"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB50656-2011，第10.0.6条","image":null},{"id":1191,"category":"安全生产知识","type":"single","seq":91,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，不具备安全生产教育培训条件的企业，可委托（   ）对从业人员进行安全培训。","options":[{"key":"A","text":"具有相应资质的安全培训机构"},{"key":"B","text":"安全教育机构"},{"key":"C","text":"安全生产管理机构"},{"key":"D","text":"安全机构"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，3.0.5，条文说明","image":null},{"id":1192,"category":"安全生产知识","type":"single","seq": 》GB50656-2011，施工企业的工程项目部应根据企业安全生产管理制度制订项目（   ），建立安全生产组织与责任体系，明确安全管理职责，实施责任考核。","options":[{"key":"A","text":"安全管理目标"},{"key":"B","text":"安全管理方针"},{"key":"C","text":"安全管理计划"},{"key":"D","text":"安全管理部署"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.3条","image":null},{"id":1211,"category":"安全生产知识","type":"single","seq":111,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，施工企业的工程项目部应根据企业安全生产管理制度，实施施工现场安全生产管理，配备满足（   ）要求的费用、从业人员、设备、设施、劳动防护用品及相关的检测器具。","options":[{"key":"A","text":"安全生产、文明施工"},{"key":"B","text":"安全技术交底"},{"key":"C","text":"安全检查"},{"key":"D","text":"安全目标"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.3条","image":null},{"id":1212,"category":"安全生产知识","type":"single","seq":112,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，（   ）应为工程项目安全生产第一责任人，应负责分解落实安全生产责任，实施考核奖惩，实现项目安全管理目标。","options":[{"key":"A","text":"项目生产经理"},{"key":"B","text":"项目安全员"},{"key":"C","text":"项目技术负责人"},{"key":"D","text":"项目经理"}],"answer":"D","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.4条","image":null},{"id":1213,"category":"安全生产知识","type":"single","seq":113,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，作业人员应严格遵守（   ），并应做到不伤害自己、不伤害他人和不被他人伤害。","options":[{"key":"A","text":"安全技术交底"},{"key":"B","text":"安全操作规程"},{"key":"C","text":"安全管理制度"},{"key":"D","text":"项目管理制度"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.4条","image":null},{"id":1214,"category":"安全生产知识","type":"single","seq":114,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，项目专职安全管理人员对项目安全生产管理情况应实施巡查，（   ）违章指挥、违章作业和违反劳动纪律等现象，并应做好记录。","options":[{"key":"A","text":"劝阻和解决"},{"key":"B","text":"处理和解决"},{"key":"C","text":"阻止和处理"},{"key":"D","text":"劝阻和处理"}],"answer":"C","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.5条","image":null},{"id":1215,"category":"安全生产知识","type":"single","seq":115,"stem":"根据《施工企业安全生产管理规范》GB50656-2011，项目专职安全管理人员应定期向（   ）报告项目安全生产管理情况。","options":[{"key":"A","text":"监理单位"},{"key":"B","text":"企业"},{"key":"C","text":"建设单位"},{"key":"D","text":"分包单位"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB50656-2011，第12.0.5条","image":null},{"id":1216,"cate y":"安全生产知识","type":"single","seq":122,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，框架结构采用人工拆除施工时，下列拆除顺序正确的是（   ）","options":[{"key":"A","text":"次梁→楼板→主梁→结构柱"},{"key":"B","text":"楼板→次梁→主梁→结构柱"},{"key":"C","text":"次梁→主梁→楼板→结构柱"},{"key":"D","text":"楼板→主梁→次梁→结构柱"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.1.1条","image":null},{"id":1223,"category":"安全生产知识","type":"single","seq":123,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，下列关于人工拆除作业说法错误的是（   ）","options":[{"key":"A","text":"水平构件上严禁人员聚集或集中堆放物料"},{"key":"B","text":"作业人员应在稳定的结构或脚手架上操作。"},{"key":"C","text":"拆除建筑墙体时，严禁采用底部掏掘或推倒的方法。"},{"key":"D","text":"建筑的栏杆、楼梯构件应在建筑结构整体拆除前先行拆除"}],"answer":"D","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.1.1条","image":null},{"id":1224,"category":"安全生产知识","type":"single","seq":124,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，下列关于人工拆除作业说法错误的是（   ）","options":[{"key":"A","text":"建筑的承重梁柱，应在其所承载的主要构件拆除后，再进行拆除。"},{"key":"B","text":"施工作业面的孔洞，应采取防护措施。"},{"key":"C","text":"拆除现场使用的小型机具，严禁超负荷或带故障运转。"},{"key":"D","text":"拆除梁或悬挑构件时，应采取有效的控制下落措施。"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.1.1条","image":null},{"id":1225,"category":"安全生产知识","type":"single","seq":125,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，（   ）建筑墙体时，严禁采用底部掏掘或推倒的方法。","options":[{"key":"A","text":"人工拆除"},{"key":"B","text":"机械拆除"},{"key":"C","text":"爆破拆除"},{"key":"D","text":"静力破碎拆除"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.1.3条","image":null},{"id":1226,"category":"安全生产知识","type":"single","seq":126,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，当采用机械拆除建筑时，机械设备前端工作装置的作业高度应比拟拆除物的高度（   ）。","options":[{"key":"A","text":"高"},{"key":"B","text":"低"},{"key":"C","text":"相同"},{"key":"D","text":"视情况而定"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.2.3条","image":null},{"id":1227,"category":"安全生产知识","type":"single","seq":127,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，当采用机械拆除建筑时，应（   ）逐层拆除，并应分段进行;应先拆除（   ），再拆除（   ）。","options":[{"key":"A","text":"从上至下；承重结构，非承重结构"},{"key":"B","text":"从下至上；承重结构，非承重结构"},{"key":"C","text":"从上至下；非承重结构，承重结构"},{"key":"D","text":"从下至上；非承重结构，承重结构"}],"answer":"C","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.2.2条","image":null},{"id":1228,"category":"安全生产知识","type":"single","seq":128,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，当拆除作业采用双机同时起吊同一构件时，每台起重机载荷不得超过允许载荷的 （   ）","options":[{"key":"A","text":"70%"},{"key":"B","text":"75%"},{"key":"C","text":"80%"},{"key":"D","text":"85%"}],"answer":"C","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.2.6条","image":null},{"id":1229,"category":"安全生产知识","type":"single","seq":129,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，下列关于机械拆除说法错误的是（   ）","options":[{"key":"A","text":"对拆除作业中较大尺寸的构件或沉重物料，应采用起重机具及时吊运。"},{"key":"B","text":"拆除作业的起重机司机，必须执行吊装操作规程"},{"key":"C","text":"当拆除屋架等大型构件时，必须采用吊索具将构件锁定牢固，待起重机吊稳后，方可进行切割作业。"},{"key":"D","text":"当拆除作业采用双机同时起吊同一构件时，第一吊次可以不试吊，但施工过程中两台起重机应同步作业。"}],"answer":"D","basis":"/","image":null},{"id":1230,"category":"安全生产知识","type":"single","seq":130,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，当机械拆除需人工拆除配合时，人员与机械（   ）在同一作业面上同时作业。","options":[{"key":"A","text":"不得"},{"key":"B","text":"可以"},{"key":"C","text":"根据拟拆除物的结构形式确定"},{"key":"D","text":"根据周边作业环境确定"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.2.9条","image":null},{"id":1231,"category":"安全生产知识","type":"single","seq":131,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，（   ）是指依靠人力和铁锤、风镐、切割器具等简单工具，对建、构筑物进行解体和破碎的一种施工方法","options":[{"key":"A","text":"人工拆除"},{"key":"B","text":"机械拆除"},{"key":"C","text":"爆破拆除"},{"key":"D","text":"静力破碎拆除"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第2.0.1条","image":null},{"id":1232,"category":"安全生产知识","type":"single","seq":132,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，（   ）是指使用液压挖掘机及液压破碎锤、液压剪和起重机等大、中型机械，对建、构筑物进行解体和破碎的一种施工方法。","options":[{"key":"A","text":"人工拆除"},{"key":"B","text":"机械拆除"},{"key":"C","text":"爆破拆除"},{"key":"D","text":"静力破碎拆除"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第2.0.2条","image":null},{"id":1233,"category":"安全生产知识","type":"single","seq":133,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，（   ）是指使用炸药的爆炸能量对建、构筑物进行解体和破碎的一种施工方法","options":[{"key":"A","text":"人工拆除"},{"key":"B","text":"机械拆除"},{"key":"C","text":"爆破拆除"},{"key":"D","text":"静力破碎拆除"}],"answer":"C","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第2.0.3条","image":null},{"id":1234,"category":"安全生产知识","type":"single","seq":134,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，（   ）必须对拆除工程的安全生产负全面领导责任","options":[{"key":"A","text":"项目经理"},{"key":"B","text":"技术负责人"},{"key":"C","text":"施工员"},{"key":"D","text":"安全员"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第2.0.1条","image":null},{"id":1235,"category":"安全生产知识","type":"single","seq":135,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，下列关于建筑物拆除工程说法正确的是（   ）","options":[{"key":"A","text":"小型建筑物拆除工程可以不制定生产安全事故应急救援预案"},{"key":"B","text":"拆除工程的安全专项施工方案应经项目技术负责人审批通过后实施"},{"key":"C","text":"拆除工程的建设单位和施工单位可不签订合同，但必须签订安全生产管理协议"},{"key":"D","text":"施工单位必须为从事拆除作业的人员办理意外伤害保险"}],"answer":"D","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第4.0.6条","image":null},{"id":1236,"category":"安全生产知识","type":"single","seq":136,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，下列关于建筑物拆除工程说法正确的是（   ）","options":[{"key":"A","text":"作业人员使用手持机具时，严禁超负荷或带故障运转"},{"key":"B","text":"楼层内的施工垃圾，在做好警戒的情况下，可向下抛掷"},{"key":"C","text":"进行人工拆除时，楼板上严禁人员聚集，可以临时堆放材料"},{"key":"D","text":"人工拆除应从上之下，逐层拆除，不得横向交叉作业"}],"answer":"A","basis":"/","image":null},{"id":1237,"category":"安全生产知识","type":"single","seq":137,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，对验收不合格的炮孔，应按设计要求进行施工纠正或由爆破（   ）进行设计修改","options":[{"key":"A","text":"项目负责人"},{"key":"B","text":"技术负责人"},{"key":"C","text":"生产负责人"},{"key":"D","text":"设计院"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.3.6条","image":null},{"id":1238,"category":"安全生产知识","type":"single","seq":138,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，当爆破拆除施工时，应按设计要求进行防护和覆盖，起爆前应由（   ）检查验收","options":[{"key":"A","text":"现场负责人"},{"key":"B","text":"项目技术负责人"},{"key":"C","text":"项目安全负责人"},{"key":"D","text":"单位技术负责人"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第5.3.7条","image":null},{"id":1239,"category":"安全生产知识","type":"single","seq":139,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，当遇（   ）级以上风力等影响施工安全的恶劣天气时，严禁进行露天拆除作业。","options":[{"key":"A","text":"四级"},{"key":"B","text":"五级"},{"key":"C","text":"六级"},{"key":"D","text":"七级"}],"answer":"C","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第6.0.8条","image":null},{"id":1240,"category":"安全生产知识","type":"single","seq":140,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，拆除工程施工前，应由（   ）对施工作业人员进行书面安全技术交底","options":[{"key":"A","text":"安全员"},{"key":"B","text":"施工员"},{"key":"C","text":"项目经理"},{"key":"D","text":"质量员"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第6.0.3条","image":null},{"id":1241,"category":"安全生产知识","type":"single","seq":141,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，（   ）是指封闭或部分封闭，自然通风不良，易造成有毒有害、易燃易爆物质积聚或氧含量不足的空间。","options":[{"key":"A","text":"有限空间"},{"key":"B","text":"作业空间"},{"key":"C","text":"登高作业空间"},{"key":"D","text":"特种作业空间"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第2.0.5条","image":null},{"id":1242,"category":"安全生产知识","type":"single","seq":142,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，下列关于拆除工程说法错误的是（   ）","options":[{"key":"A","text":"拆除建筑时，当遇有易燃、可燃物及保温材料时，严禁明火作业"},{"key":"B","text":"拆除工程施工时，应根据实际情况选择是否采取防止扬尘和降低噪声的措施"},{"key":"C","text":"被拆建筑物的高度超过相邻电力等管线高度时，在拆除时不得向管线方向倾倒"},{"key":"D","text":"拆除作业前应做好水、电、气的检查和安全保护措施"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第7.0.4条","image":null},{"id":1243,"category":"安全生产知识","type":"single","seq":143,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，对危险性较大的拆除工程专项施工方案，应按照相关规定（   ）。","options":[{"key":"A","text":"组织专家论证"},{"key":"B","text":"进行评价"},{"key":"C","text":"进行评审"},{"key":"D","text":"组织培训"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第3.0.3条","image":null},{"id":1244,"category":"安全生产知识","type":"single","seq":144,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，拆除工程施工必须建立（   ），落实防火安全责任制，建立义务消防队伍。","options":[{"key":"A","text":"消防管理制度"},{"key":"B","text":"质量管理制度"},{"key":"C","text":"安全技术交底制度"},{"key":"D","text":"安全检查制度"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ147-2016，第6.0.10条","image":null},{"id":1245,"category":"安全生产知识","type":"single","seq":145,"stem":"根据《建筑拆除工程安全技术规范》JGJ147-2016，拟拆除物的实际状况包括：结构特点、（   ），电力、燃气、热力管道分布及使用状况等。","options":[{"key":"A","text":"施工组织设计"},{" image":null},{"id":1321,"category":"安全生产知识","type":"single","seq":221,"stem":"在安全生产活动中，危险度是由（   ）决定的。","options":[{"key":"A","text":"发生事故的可能性和危害程度"},{"key":"B","text":"发生事故的可能性和严重性"},{"key":"C","text":"事故发生的广度和严重性"},{"key":"D","text":"事散发生的广度和危害程度"}],"answer":"B","basis":"/","image":null},{"id":1322,"category":"安全生产知识","type":"single","seq":222,"stem":"生产经营单位建立健全安全生产责任制体现了系统原理中（   ）。","options":[{"key":"A","text":"动态相关性原则"},{"key":"B","text":"整分合原则"},{"key":"C","text":"反馈原则"},{"key":"D","text":"封闭原则"}],"answer":"B","basis":"/","image":null},{"id":1323,"category":"安全生产知识","type":"single","seq":223,"stem":"关于“动态相关性原则”的说法，正确的是（   ）。","options":[{"key":"A","text":"及时捕捉各种安全生产信息，掌握系统环境的变化"},{"key":"B","text":"推动管理活动的基本力量是人，因此，管理必须激发人的工作能力"},{"key":"C","text":"如果管理系统的各要素都处于静止状态，就不会发生事故"},{"key":"D","text":"激发人的内在潜力，使其充分发挥积极性、主动性和创造性"}],"answer":"C","basis":"/","image":null},{"id":1324,"category":"安全生产知识","type":"single","seq":224,"stem":"安全生产管理，就是针对人们在安全生产过程中的安全问题，运用有效的资源，发挥人们的智慧，通过人们的努力，进行有关（   ）等活动。","options":[{"key":"A","text":"决策、计划、组织和控制"},{"key":"B","text":"计划、组织、反馈和控制"},{"key":"C","text":"决策、实施、计划和改进"},{"key":"D","text":"评价、计划、实施和改进"}],"answer":"A","basis":"/","image":null},{"id":1325,"category":"安全生产知识","type":"single","seq":225,"stem":"目前我国建筑业伤亡事故的主要类型是（   ）","options":[{"key":"A","text":"高处坠落、坍塌、物体打击、机械伤害、触电"},{"key":"B","text":"高处坠落、中毒、坍塌、触电、火灾事故"},{"key":"C","text":"坍塌、粉尘、高处堕落、触电、塔吊事故"},{"key":"D","text":"坍塌、物体打击、机械伤害、触电、火灾事故"}],"answer":"A","basis":"/","image":null},{"id":1326,"category":"安全生产知识","type":"single","seq":226,"stem":"造成人的不安全行为和物的不安全状态的原因不包括以下哪个原因（   ）","options":[{"key":"A","text":"技术原因"},{"key":"B","text":"教育原因"},{"key":"C","text":"管理原因"},{"key":"D","text":"行为原因"}],"answer":"D","basis":"/","image":null},{"id":1327,"category":"安全生产知识","type":"single","seq":227,"stem":"以下不属于安全管理基本原理的五个要素的是（   ）。","options":[{"key":"A","text":"政策"},{"key":"B","text":"组织"},{"key":"C","text":"调查"},{"key":"D","text":"业绩测量"}],"answer":"C","basis":"/","image":null},{"id":1328,"category":"安全生产知识","type":"single","seq":228,"stem":"《国务院关于进一步加强安全生产工作的决定》中指出：要努力构建（   ）的安全生产工作格局。","options":[{"key":"A","text":"“政府统一领导、部门依法监管、企业全面负责、群众参与监督、全社会广泛支持”"},{"key":"B","text":"“政府统一领导、部门全面负责、企业依法监管、群众参与监督、全社会广泛支持”"},{"key":"C","text":"“政府依法监管、部门统一领导、企业全面负责、群众参与监督、全社会广泛支持”"},{"key":"D","text":"“政府全面负责、部门统一领导、企业依法监管、群众参与监督、全社会广泛支持”"}],"answer":"A","basis":"/","image":null},{"id":1329,"category":"安全生产知识","type":"single","seq":229,"stem":"工人在分配到施工队之前，首先进行公司级安全教育。下列内容不属于公司级安全教育内容的是（   ）。","options":[{"key":"A","text":"劳动保护的意义和任务的一般教育"},{"key":"B","text":"安全生产方针、政策、法规、标准、规范、规程和安全知识"},{"key":"C","text":"安全生产纪律和文明生产要求"},{"key":"D","text":"企业安全规章制度"}],"answer":"C","basis":"/","image":null},{"id":1330,"category":"安全生产知识","type":"single","seq":230,"stem":"根据《建设工程安全生产管理条例》（国务院令第393号），位于主要路段和市容景观道路及机场、码头、车站、广场的建筑施工现场设置的围栏其高度不得低于（   ）。","options":[{"key":"A","text":"1.8m"},{"key":"B","text":"2.0m"},{"key":"C","text":"2.5m"},{"key":"D","text":"2.8m"}],"answer":"C","basis":"《建设工程安全生产管理条例》（国务院令第393号），第二十六条","image":null},{"id":1331,"category":"安全生产知识","type":"single","seq":231,"stem":"根据《建设工程安全生产管理条例》（国务院令第393号），施工单位应当在施工现场入口处、施工起重机械、临时用电设施、脚手架、出入通道口、楼梯口、电梯井口、孔洞口、桥梁口、隧道口、基坑边沿、爆破物及有害危险气体和液体存放处等危险部位，设置明显的（   ）。","options":[{"key":"A","text":"安全提示标志"},{"key":"B","text":"安全宣传标志"},{"key":"C","text":"安全指示标志"},{"key":"D","text":"安全警示标志"}],"answer":"D","basis":"《建设工程安全生产管理条例》（国务院令第393号），第二十八条","image":null},{"id":1332,"category":"安全生产知识","type":"single","seq":232,"stem":"项目教育是新工人被分配到项目以后进行的安全教育。下列内容不属于班组安全教育内容的是（   ）。","options":[{"key":"A","text":"施工现场安全管理规章制度"},{"key":"B","text":"安全生产方针、政策、法规"},{"key":"C","text":"安全生产纪律和文明生产要求"},{"key":"D","text":"建安工人安全生产技术操作一般规定"}],"answer":"B","basis":"/","image":null},{"id":1333,"category":"安全生产知识","type":"single","seq":233,"stem":"下列哪个选项不是常用的安全电压（   ）。","options":[{"key":"A","text":"12V"},{"key":"B","text":"110V"},{"key":"C","text":"24V"},{"key":"D","text":"36V"}],"answer":"B","basis":"/","image":null},{"id":1334,"category":"安全生产知识","type":"single","seq":234,"stem":"安全带的系挂应优先采用（   ）。","options":[{"key":"A","text":"随意系挂"},{"key":"B","text":"低挂高用"},{"key":"C","text":"高挂低用"},{"key":"D","text":"根据现场情况系挂"}],"answer":"C","basis":"/","image":null},{"id":1335,"category":"安全生产知识","type":"single","seq":235,"stem":"临时搭设的建筑物区域内，每（   ）配备2只10L灭火器。","options":[{"key":"A","text":"80㎡"},{"key":"B","text":"100㎡"},{"key":"C","text":"120㎡"},{"key":"D","text":"150㎡"}],"answer":"B","basis":"/","image":null},{"id":1336,"category":"安全生产知识","type":"single","seq":236,"stem":"根据《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》，市政基础设施工程项目应按照工程合同价配备专职安全管理人员，其中：5000万～2亿元的工程至少（   ）。","options":[{"key":"A","text":"1名"},{"key":"B","text":"2名"},{"key":"C","text":"3名"},{"key":"D","text":"4名"}],"answer":"B","basis":"《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》第二十六条","image":null},{"id":1337,"category":"安全生产知识","type":"single","seq":237,"stem":"根据《施工脚手架通用规范》GB 55023-2022，当作业脚手架操作层高出相邻连墙件以上（   ）步时，在上层连墙件安装完毕前，应采取临时拉结措施。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"B","basis":"《施工脚手架通用规范》GB 55023-2022，第5.2.2条","image":null},{"id":1338,"category":"安全生产知识","type":"single","seq":238,"stem":"根据《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，竖向主框架所覆盖的每个楼层处应设置（   ）附墙支座，其构造应符合相关标准规定，并应满足承载力要求。在使用工况时，应将竖向主框架固定于附墙支座上;在升降工况时，附墙支座上应设具有防倾、导向功能的结构装置。","options":[{"key":"A","text":"一道"},{"key":"B","text":"两道"},{"key":"C","text":"三道"},{"key":"D","text":"四道"}],"answer":"A","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.4.5条","image":null},{"id":1339,"category":"安全生产知识","type":"single","seq":239,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，附着式升降脚手架和建筑物连接处的混凝土强度应由设计计算确定，且不得低于（   ）MPa。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"},{"key":"D","text":"20"}],"answer":"B","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第4.5.7条","image":null},{"id":1340,"category":"安全生产知识","type":"single","seq":240,"stem":"根据《施工脚手架通用规范》GB 55023-2022，脚手架立杆间距、水平杆步距的设置应符合专项（   ）的要求。","options":[{"key":"A","text":"安全技术措施"},{"key":"B","text":"施工技术"},{"key":"C","text":"施工方案"},{"key":"D","text":"安全评价"}],"answer":"C","basis":"《施工脚手架通用规范》GB 55023-2022，第4.3.3条","image":null},{"id":1341,"category":"安全生产知识","type":"single","seq":241,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，纵梁之间应设置可靠的连接，当采用贝雷梁时，其两端及支承位置均应设置通长横向连接系，且其间距不应大于（   ）m。","options":[{"key":"A","text":"6"},{"key":"B","text":"7"},{"key":"C","text":"8"},{"key":"D","text":"9"}],"answer":"D","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第4.6.4条","image":null},{"id":1342,"category":"安全生产知识","type":"single","seq":242,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，悬挑式操作平台的悬挑长度不宜大于（   ）m，其搁置点、拉结点、支撑点应可靠设置在主体结构上。","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":"C","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第6.4.2条","image":null},{"id":1343,"category":"安全生产知识","type":"single","seq":243,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，操作平台投入使用时，应在平台的明显位置处设置（   ），物料应及时转运，不得超重与超高堆放。","options":[{"key":"A","text":"限载标准"},{"key":"B","text":"警告标志"},{"key":"C","text":"提示标志"},{"key":"D","text":"安全标志"}],"answer":"A","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第6.1.4条","image":null},{"id":1344,"category":"安全生产知识","type":"single","seq":244,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，开挖深度超过（   ）m的基坑和基槽的周边应设置防护栏杆。","options":[{"key":"A","text":"0.9"},{"key":"B","text":"1.2"},{"key":"C","text":"1.8"},{"key":"D","text":"2"}],"answer":"D","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第5.1.1条","image":null},{"id":1345,"category":"安全生产知识","type":"single","seq":245,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，防护栏杆应由上下两道横杆及立杆组成，上杆离地高度应为（   ）m，下杆应在上杆和挡脚板中间设置;立杆间距不应大于2m，底端应固定牢固","options":[{"key":"A","text":"0.9"},{"key":"B","text":"1.2"},{"key":"C","text":"1.5"},{"key":"D","text":"1.8"}],"answer":"B","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第5.1.1条","image":null},{"id":1346,"category":"安全生产知识","type":"single","seq":246,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，非竖向洞口短边边长或直径大于或等于（   ）mm时，应在洞口作业侧设置防护栏杆，洞口应采用安全平网封闭","options":[{"key":"A","text":"500"},{"k answer":"A","basis":"《中华人民共和国职业病防治法》相关规定","image":null},{"id":1424,"category":"安全生产知识","type":"single","seq":324,"stem":"根据《中华人民共和国职业病防治法》，我国的职业病防治工作方针是（   ）。","options":[{"key":"A","text":"健康为主，防预结合"},{"key":"B","text":"预防为主，防治结合"},{"key":"C","text":"安全第一，预防为主"},{"key":"D","text":"安全第一，综合治理"}],"answer":"B","basis":"《中华人民共和国职业病防治法》相关规定","image":null},{"id":1425,"category":"安全生产知识","type":"single","seq":325,"stem":"根据《建设项目职业病防护设施 “三同时” 监督管理办法》，建设项目的职业病防护设施应当与主体工程（   ）。","options":[{"key":"A","text":"同时报批，同时投入生产和使用"},{"key":"B","text":"同时施工，同时投入生产和使用"},{"key":"C","text":"同时规划，同时施工，同时投入生产和使用"},{"key":"D","text":"同时设计，同时施工，同时投入生产和使用"}],"answer":"D","basis":"《建设项目职业病防护设施 “三同时” 监督管理办法》（国家安全生产监督管理总局令第90号）第三条","image":null},{"id":1426,"category":"安全生产知识","type":"single","seq":326,"stem":"根据《中华人民共和国职业病防治法》，产生职业病危害的用人单位应当在醒目位置设置（   ），公布有关职业病防治的规章制度、操作规程、职业病危害事故应急救援措施和工作场所职业病危害因素检测结果。","options":[{"key":"A","text":"警示说明"},{"key":"B","text":"公告栏"},{"key":"C","text":"警示区域"},{"key":"D","text":"警示标识"}],"answer":"B","basis":"《中华人民共和国职业病防治法》第二十四条，第七十条","image":null},{"id":1427,"category":"安全生产知识","type":"single","seq":327,"stem":"根据《工伤保险条例》，（   ）不能认定为工伤。","options":[{"key":"A","text":"在上下班途中，受到机动车事故伤害的"},{"key":"B","text":"患职业病的"},{"key":"C","text":"在工作时间和工作岗位，突发疾病死亡的"},{"key":"D","text":"在工作时间和工作岗位自残的"}],"answer":"D","basis":"《工伤保险条例》第十六条","image":null},{"id":1428,"category":"安全生产知识","type":"single","seq":328,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，标准的实施有助于组织实现其职业健康安全管理体系的预期结果。依照组织的职业健康安全方针，其职业健康安全管理体系的预期结果不包括：（   ）","options":[{"key":"A","text":"能够连续地改进职业健康安全绩效；"},{"key":"B","text":"满足外部合作方的要求；"},{"key":"C","text":"实现职业健康安全目标。"},{"key":"D","text":"提升组织内人员能力与意识"}],"answer":"C","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系 要求及使用指南》第1章","image":null},{"id":1429,"category":"安全生产知识","type":"single","seq":329,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，职业健康安全管理体系指导的范围包括（   ）。","options":[{"key":"A","text":"使组织能够防治与工作相关的伤害与健康损害"},{"key":"B","text":"使组织能完全地消除所有的伤害与健康损害的可能性"},{"key":"C","text":"所指导的只包含企业，不适用于公益组织、机构等"},{"key":"D","text":"保障人民群众财产安全"}],"answer":"A","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系 要求及使用指南》第1章","image":null},{"id":1430,"category":"安全生产知识","type":"single","seq":330,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，职业健康安全管理体系的目的是（   ）","options":[{"key":"A","text":"消除危险源"},{"key":"B","text":"提升组织的绩效、荣誉"},{"key":"C","text":"防止对工作人员的伤害和健康损害，以及提供健康安全的工作场所"},{"key":"D","text":"保持有效沟通"}],"answer":"C","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系 要求及使用指南》相关规定","image":null},{"id":1431,"category":"安全生产知识","type":"single","seq":331,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，以下有关职业安全目标中的“目标”，不正确的是（   ）","options":[{"key":"A","text":"目标只能是战略性的。"},{"key":"B","text":"目标指的是要实现的结果。"},{"key":"C","text":"职业健康安全目标是组织为实现与职业健康安全方针相一致的特定结果而制定的目标。"},{"key":"D","text":"目标可以是运行层面的。"}],"answer":"A","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系 要求及使用指南》相关规定","image":null},{"id":1432,"category":"安全生产知识","type":"single","seq":332,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，有关风险的说法，下列正确的有（   ）","options":[{"key":"A","text":"风险造成的影响，指的是对预期的偏离，只可能是负面的。"},{"key":"B","text":"风险指的是不确定性的影响，不确定性指的是后果是不可控的。"},{"key":"C","text":"通常情况下，风险只可以某事件发生的后果和其发生的可能性的组合来描述它的特征。"},{"key":"D","text":"职业健康安全风险指的是与工作相关的危险事件或暴露发生的可能性与由危险事件或暴露而导致的伤害和健康损害的严重性的组合。"}],"answer":"D","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系 要求及使用指南》相关规定","image":null},{"id":1433,"category":"安全生产知识","type":"single","seq":333,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，事件指得是由工作引起的或在工作过程中发生的可能或已经导致伤害和健康损害的情况。以下说法正确的是（   ）","options":[{"key":"A","text":"事件必然会造成后果。"},{"key":"B","text":"事件会发生，必然是有不符合事项的因素。"},{"key":"C","text":"事件包含不造成伤害和损害的情况。"},{"key":"D","text":"事件和事故是一样的。"}],"answer":"C","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系 要求及使用指南》相关规定","image":null},{"id":1434,"category":"安全生产知识","type":"single","seq":334,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，对职业健康安全管理体系中的持续改进的说法，不正确的有（   ）","options":[{"key" :"安全生产知识","type":"multiple","seq":56,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，最高管理者需要对其在职业健康安全管理体系方面作出承诺，保证其领导作用发挥效力。具体包含（    ）","options":[{"key":"A","text":"确保职业健康安全管理体系实现其预期结果；"},{"key":"B","text":"保护工作人员不因报告事件、危险源、风险和机遇而遭受报复；"},{"key":"C","text":"确保组织建立和实施工作人员的协商和参与的过程支持健康安全委员会的建立和运行"},{"key":"D","text":"确保将职业健康安全管理体系要求融入组织业务过程之中；"},{"key":"E","text":"确保体系有效建立并促进持续改进"}],"answer":"ABCDE","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求及使用指南》第5.1条","image":null},{"id":1557,"category":"安全生产知识","type":"multiple","seq":57,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，职业健康安全方针应（    ）","options":[{"key":"A","text":"包括为防止与工作相关的伤害和健康损害而提供安全和健康的工作条件的承诺，并适合于组织的宗旨和规模、组织所处的环境，以及组织的职业健康安全风险和职业健康安全机遇的特性；"},{"key":"B","text":"为制定职业健康安全目标提供框架;"},{"key":"C","text":"包括满足法律法规要求和其他要求的承诺；"},{"key":"D","text":"包括消除危险源和降低职业健康安全风险的承诺,包括持续改进职业健康安全管理体系的承诺；"},{"key":"E","text":"包括工作人员及其代表（若有）的协商和参与的承诺；"}],"answer":"ABCDE","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求及使用指南》第5.2条","image":null},{"id":1558,"category":"安全生产知识","type":"multiple","seq":58,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，在体系的策划过程中，组织应充分考虑法律法规要求和其他要求，做到以下事项（    ）","options":[{"key":"A","text":"组织应建立、实施和保持过程，以确定并获取最新的适用于组织的危险源、职业健康安全风险和职业健康安全管理体系的法律法规要求和其他要求"},{"key":"B","text":"组织应建立、实施和保持过程，确定如何将这些法律法规要求和其他要求应用于组织，以及所需沟通的内容"},{"key":"C","text":"组织应建立、实施和保持过程，在建立、实施、保持和持续改进其职业健康安全管理体系时，必须考虑这些法律法规要求和其他要求"},{"key":"D","text":"组织应保持和保留有关法律法规要求和其他要求的文件化信息，并确保及时更新以反映任何变化。"},{"key":"E","text":"组织应建立、实施、保持过程，确定法律法规和其它要求所涉及的绩效评价与评审的内容，进行评审实施与策划"}],"answer":"ABCD","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求及使用指南》第6.1.3条","image":null},{"id":1559,"category":"安全生产知识","type":"multiple","seq":59,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，组织应该对危险源辨识出的潜在紧急情况进行应急准备并做出响应，建立、实施和保持所需的过程。包括的情形有（    ）","options":[{"key":"A","text":"针对紧急情况建立所策划的响应，包括提供急救"},{"key":"B","text":"为所策划的响应提供培训"},{"key":"C","text":"定期测试和演练所策划的响应能力"},{"key":"D","text":"与承包方、访问者、应急响应服务机构、政府部门、当地社区（适当时）沟通相关信息"},{"key":"E","text":"邀请第三方团队来进行服务于指导"}],"answer":"ABCD","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求及使用指南》第8.2条","image":null},{"id":1560,"category":"安全生产知识","type":"multiple","seq":60,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，组织对体系的监视和测量，所包含的内容有（    ）","options":[{"key":"A","text":"满足法律法规要求和其他要求的程度"},{"key":"B","text":"与所辨识的危险源、风险和机遇相关的活动和运行"},{"key":"C","text":"实现组织职业健康安全目标的进展情况"},{"key":"D","text":"运行控制的有效性"},{"key":"E","text":"发布监视和测量的准则"}],"answer":"ABCD","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求及使用指南》第9.1条","image":null},{"id":1561,"category":"安全生产知识","type":"multiple","seq":61,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，组织应建立、实施和保持用于对法律法规要求和其他要求的合规性进行评价的过程，具体有（    ）","options":[{"key":"A","text":"确定实施合规性评价的频次和方法"},{"key":"B","text":"评价合规性，并在需要时采取措施"},{"key":"C","text":"保持对其关于法律法规要求和其他要求的合规状况的认识和理解"},{"key":"D","text":"保留合规性评价结果的文件化信息"},{"key":"E","text":"做好合规性评价的协商与沟通"}],"answer":"ABCD","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求及使用指南》第9.1.2条","image":null},{"id":1562,"category":"安全生产知识","type":"multiple","seq":62,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》，职业健康安全管理体系可以通过以下哪些方式进行持续改进（    ）","options":[{"key":"A","text":"提升职业健康安全绩效"},{"key":"B","text":"促进支持职业健康安全管理体系的文化"},{"key":"C","text":"促进工作人员参与职业健康安全管理体系持续改进措施的实施"},{"key":"D","text":"就有关持续改进的结果与工作人员及其代表进行沟通"},{"key":"E","text":"保持和保留文件化信息作为持续改进的证据"}],"answer":"ABCDE","basis":"《GB/T 45001—2020/ISO 45001:2018 职业健康安全管理体系要求》第3.1.2条，第10.3条","image":null},{"id":1563,"category":"安全生产知识","type":"multiple","seq":63,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下属于施工安全管理重大事故隐患的是（    ）","options":[{"key":"A","text":"建筑施工企业未取得安全生产许可证擅自从事建筑施工活动"},{"key":"B","text":"建筑面积为5万㎡的建筑工程配备2名专职安全员"},{"key":"C","text":"危大工程方案存在严重缺陷的"},{"key":"D","text":"建筑面积为3万㎡的建筑工程配备2名专职安全员"},{"key":"E","text":"特种作业人员取得有效特种作业人员操作资格证书的"}],"answer":"ABC","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第四条","image":null},{"id":1564,"category":"安全生产知识","type":"multiple","seq":64,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于基坑、边坡的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"深基坑施工未进行第三方监测"},{"key":"B","text":"边坡土方超挖未采取有效措施"},{"key":"C","text":"基坑底部出现管涌，且未及时处理"},{"key":"D","text":"桩间土流失孔洞深度小于桩径"},{"key":"E","text":"周边建筑物变形值超过设计变形控制值"}],"answer":"ABCE","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第五条","image":null},{"id":1565,"category":"安全生产知识","type":"multiple","seq":65,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于模板工程及支撑体系的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"模板支架的基础承载力不满足设计要求"},{"key":"B","text":"模板支架拆除时，混凝土强度未达到设计或规范要求"},{"key":"C","text":"模板支架承受的施工荷载超过设计值"},{"key":"D","text":"危险性较大的混凝土模板支撑工程未按专项施工方案要求的顺序浇筑混凝土"},{"key":"E","text":"5.6m高的模板支撑体系未进行专家论证"}],"answer":"ABCD","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第六条","image":null},{"id":1566,"category":"安全生产知识","type":"multiple","seq":66,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于脚手架的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"脚手架的基础承载力满足设计要求"},{"key":"B","text":"未设置连墙件"},{"key":"C","text":"附着式升降脚手架架体悬臂高度超过规范且无加强措施"},{"key":"D","text":"高度超过20米的悬挑脚手架无架体卸荷措施"},{"key":"E","text":"48米落地脚手架未进行专家论证"}],"answer":"BCD","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第七条","image":null},{"id":1567,"category":"安全生产知识","type":"multiple","seq":67,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于建筑起重机械及吊装工程的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"塔式起重机按照说明书截臂使用"},{"key":"B","text":"起重机械安装、拆卸、爬升及附着前未对结构件、连接件及安全装置进行检查"},{"key":"C","text":"施工升降机附着间距不符合规范要求"},{"key":"D","text":"使用达到报废标准的吊索具进行起重吊装作业"},{"key":"E","text":"起重机械设备未经验收合格即投入使用"}],"answer":"BCDE","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第八条","image":null},{"id":1568,"category":"安全生产知识","type":"multiple","seq":68,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于高处作业的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"脚手架与结构外表面之间贯通未采取水平防护措施"},{"key":"B","text":"高处作业吊篮安全锁失效"},{"key":"C","text":"高处作业吊篮安全绳未独立悬挂"},{"key":"D","text":"悬挑式卸料平台未设置卸载标识"},{"key":"E","text":"电梯井口未设置防护门"}],"answer":"ABC","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第九条","image":null},{"id":1569,"category":"安全生产知识","type":"multiple","seq":69,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于临时用电及有限空间作业的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"施工现场临时用电未采用TN-S系统​"},{"key":"B","text":"未辨识施工现场有限空间，且未在显著位置设置警示标志"},{"key":"C","text":"有限空间未配备必要的气体检测、机械通风、呼吸防护及应急救援设施设备"},{"key":"D","text":"有限空间未执行“先检测、再通风、后作业”原则"},{"key":"E","text":"泥泞、存在积水等不利作业环境照明采用220v电压"}],"answer":"BCE","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第十、十一条","image":null},{"id":1570,"category":"安全生产知识","type":"multiple","seq":70,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，以下关于施工临时堆载和冒险作业的描述，属于重大事故隐患的是（    ）","options":[{"key":"A","text":"楼板、屋面和地下室顶板等结构件堆载超过设计允许值"},{"key":"B","text":"基坑周边堆载超过设计允许值"},{"key":"C","text":"使用混凝土泵车等大型机械设备，未校核其运行路线及作业位置承载能力"},{"key":"D","text":"高温天气进行吊装作业"},{"key":"E","text":"施工现场使用非载人设备吊运人员"}],"answer":"ABCE","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第十四、十五条","image":null},{"id":1571,"category":"安全生产知识","type":"multiple","seq":71,"stem":"根据《房屋建筑和市政基础设施工程禁止和限制使用技术目录（第二批）》以下属于住建部明令禁止类施工工艺、设备和材料的有（    ）","options":[{"key":"A","text":"污水检查井砖砌工艺"},{"key":"B","text":"竹（木）脚手架"},{"key":"C","text":"龙门架"},{"key":"D","text":"三点式安全带"},{"key":"E","text":"非阻燃型密目式安全网"}],"answer":"ABDE","basis":"《房屋建筑和市政基础设施工程禁止和限制使用技术目录（第二批）》​，建办标〔2021〕214号","image":null},{"id":1572,"category":"安全生产知识","type":"multiple","seq":72,"stem":"根据《有限空间作业安全技术规范》，有限空间应至少检测以下哪些气体（   ）。","options":[{"key":"A","text":"氧气"},{"key":"B","text":"可燃气体"},{"key":"C","text":"硫化氢"},{"key":"D","text":"一氧化碳"},{"key":"E","text":"氢气"}],"answer":"ABCD","basis":"《有限空间作业安全技术规范》GB 46768-2025，第5.8.2条","image":null},{"id":1573,"category":"安全生产知识","type":"multiple","seq":73,"stem":"根据《中华人民共和国安全生产法》，某居民住宅小区建设项目进入精装修施工阶段，水电施工单位与装修单位同时在同一现场进行施工作业。关于水电施工单位与装修单位施工交叉作业时的安全管理要求的说法，正确的有（    ）。","options":[{"key":"A","text":"该小区建设单位应与水电施工单位、装修单位在承包合同中约定各自的安全生产管理职责，对两个承包商的安全生产工作统一协调、管理"},{"key":"B","text":"水电施工单位与装修单位双方应当签订安全生产管理协议，明确各自的安全生产管理职责和应当采取的安全措施，并指定专职或兼职安全生产管理人员进行安全检查与协调"},{"key":"C","text":"水电施工单位与装修单位交叉作业施工前、应互相告知对方单位施工作业的内容、安全注意事项"},{"key":"D","text":"水电施工单位和装修单位同时施工用电时，可安装共用用电线路，避免现场用电线路过多引发触电"},{"key":"E","text":"水电施工单位与装修单位进行平面交叉作业时，原则上前进场方主动采取交叉作业防护措施，防患于未然"}],"answer":"ACE","basis":"《中华人民共和国安全生产法》第四十八条","image":null},{"id":1574,"category":"安全生产知识","type":"multiple","seq":74,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，建筑起重机械及吊装工程中，以下(   )情形应判定为重大事故隐患。","options":[{"key":"A","text":"塔式起重机、施工升降机、物料提升机等起重机械设备未经验收合格即投入使用，或未按规定办理使用登记"},{"key":"B","text":"建筑起重机械的基础承载力和变形不满足设计要求"},{"key":"C","text":"建筑起重机械安装、拆卸、爬升（降）以及附着前未对结构件、爬升装置和附着装置以及高强度螺栓、销轴、定位板等连接件及安全装置进行检查"},{"key":"D","text":"建筑起重机械的安全装置不齐全、失效或者被违规拆除、破坏"},{"key":"E","text":"建筑起重机械非受力构件有可见裂纹、严重锈蚀、塑性变形、开焊，或其连接螺栓、销轴缺失或失效"}],"answer":"ABCD","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第八条","image":null},{"id":1575,"category":"安全生产知识","type":"multiple","seq":75,"stem":"根据《房屋市政工程生产安全重大事故隐患判定标准（2024版）》，基坑、边坡工程中，以下（    ）情形应判定为重大事故隐患。","options":[{"key":"A","text":"未对因基坑、边坡工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等，采取专项防护措施"},{"key":"B","text":"基坑、边坡土方超挖且未采取有效措施"},{"key":"C","text":"深基坑、高边坡（一级、二级）施工未进行第三方监测"},{"key":"D","text":"支护结构或周边建筑物变形值超过设计变形控制值"},{"key":"E","text":"基坑侧壁出现漏水、流土"}],"answer":"ABCD","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024版）》第五条","image":null},{"id":1576,"category":"安全生产知识","type":"multiple","seq":76,"stem":"根据《中华人民共和国安全生产法》，生产经营单位的主要负责人对本单位安全生产工作负有以下（    ）职责。","options":[{"key":"A","text":"建立健全并落实本单位全员安全生产责任制，加强安全生产标准化建设"},{"key":"B","text":"组织制定并实施本单位安全生产教育和培训计划"},{"key":"C","text":"组织制定并实施本单位的生产安全事故应急救援预案"},{"key":"D","text":"及时、如实报告生产安全事故"},{"key":"E","text":"督促落实本单位安全生产整改措施"}],"answer":"ABCD","basis":"《中华人民共和国安全生产法》第二十一条","image":null},{"id":1577,"category":"安全生产知识","type":"multiple","seq":77,"stem":"根据《中华人民共和国安全生产法》，生产经营单位应当对从业人员进行安全生产教育和培训，保证从业人员具备以下（    ）条件。","options":[{"key":"A","text":"熟悉有关的安全生产规章制度和安全操作规程"},{"key":"B","text":"掌握本岗位的安全操作技能"},{"key":"C","text":"了解事故应急处理措施"},{"key":"D","text":"知悉自身在安全生产方面的权利和义务"},{"key":"E","text":"不需具备必要的安全生产知识"}],"answer":"ABCD","basis":"《中华人民共和国安全生产法》第二十八条","image":null},{"id":1578,"category":"安全生产知识","type":"multiple","seq":78,"stem":"根据《中华人民共和国安全生产法》，生产经营单位应当建立健全并落实生产安全事故隐患排查治理制度，采取（    ）措施及时发现并消除事故隐患。","options":[{"key":"A","text":"技术措施"},{"key":"B","text":"管理措施"},{"key":"C","text":"经济措施"},{"key":"D","text":"法律措施"},{"key":"E","text":"教育措施"}],"answer":"AB","basis":"《中华人民共和国安全生产法》第四十一条","image":null},{"id":1579,"category":"安全生产知识","type":"multiple","seq":79,"stem":"根据《中华人民共和国安全生产法》，生产经营单位的安全生产管理机构以及安全生产管理人员应当履行以下（    ）职责。","options":[{"key":"A","text":"组织或者参与拟订本单位安全生产规章制度、操作规程和生产安全事故应急救援预案"},{"key":"B","text":"组织或者参与本单位安全生产教育和培训，如实记录安全生产教育和培训情况"},{"key":"C","text":"组织开展危险源辨识和评估，督促落实本单位重大危险源的安全管理措施"},{"key":"D","text":"检查本单位的安全生产状况，及时排查生产安全事故隐患，提出改进安全生产管理的建议"},{"key":"E","text":"制止和纠正违章指挥、强令冒险作业及整改安全隐患"}],"answer":"ABCD","basis":"《中华人民共和国安全生产法》第二十五条","image":null},{"id":1580,"category":"安全生产知识","type":"multiple","seq":80,"stem":"根据《中华人民共和国安全生产法》，生产经营单位应当为从业人员提供符合以下（    ）标准的劳动防护用品。","options":[{"key":"A","text":"国家标准"},{"key":"B","text":"行业标准"},{"key":"C","text":"企业标准"},{"key":"D","text":"国际标准"},{"key":"E","text":"地方标准"}],"answer":"AB","basis":"《中华人民共和国安全生产法》第四十五条","image":null},{"id":1581,"category":"安全生产知识","type":"multiple","seq":81,"stem":"根据《中华人民共和国安全生产法》，生产经营单位不得因从业人员在以下（    ）情况下而降低其工资、福利等待遇或者解除与其订立的劳动合同。","options":[{"key":"A","text":"批评、检举、控告本单位的安全生产工作"},{"key":"B","text":"拒绝违章指挥"},{"key":"C","text":"拒绝强令冒险作业"},{"key":"D","text":"在紧急情况下停止作业或者采取紧急撤离措施"},{"key":"E","text":"未按规定佩戴劳动防护用品"}],"answer":"ABCD","basis":"《中华人民共和国安全生产法》第五十四条","image":null},{"id":1582,"category":"安全生产知识","type":"multiple","seq":82,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，建筑施工安全检查评定的等级有（    ）。","options":[{"key":"A","text":"优良"},{"key":"B","text":"良好"},{"key":"C","text":"一般"},{"key":"D","text":"合格"},{"key":"E","text":"不合格"}],"answer":"ADE","basis":"《建筑施工安全检查标准》JGJ 59-2011，第5.0.3条","image":null},{"id":1583,"category":"安全生产知识","type":"multiple","seq":83,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，建筑施工安全检查评分汇总表主要内容应包括（    ）。","options":[{"key":"A","text":"安全管理"},{"key":"B","text":"文明施工"},{"key":"C","text":"脚手架"},{"key":"D","text":"施工用电"},{"key":"E","text":"基坑支护与排水工程"}],"answer":"ABCD","basis":"《建筑施工安全检查标准》JGJ 59-2011，第4.0.1条","image":null},{"id":1584,"category":"安全生产知识","type":"multiple","seq":84,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，以下哪些分项检查评分表不分保证项目和一般项目（    ）。","options":[{"key":"A","text":"文明施工检查评分表"},{"key":"B","text":"“三宝”、“四口”防护检查评分表"},{"key":"C","text":"外用电梯检查评分表"},{"key":"D","text":"施工机具检查评分表"},{"key":"E","text":"物料提升机检查评分表"}],"answer":"BD","basis":"《建筑施工安全检查标准》JGJ 59-2011，第3.0.4条​","image":null},{"id":1585,"category":"安全生产知识","type":"multiple","seq":85,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，施工安全检查的主要内容包括（    ）。","options":[{"key":"A","text":"查安全思想"},{"key":"B","text":"查安全责任"},{"key":"C","text":"查安全制度"},{"key":"D","text":"查安全措施"},{"key":"E","text":"查教育培训"}],"answer":"ABCDE","basis":"《建筑施工安全检查标准》JGJ 59-2011，第4.0.1条","image":null},{"id":1586,"category":"安全生产知识","type":"multiple","seq":86,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，以下哪些属于脚手架检查评定保证项目（    ）。","options":[{"key":"A","text":"施工方案"},{"key":"B","text":"立杆基础"},{"key":"C","text":"架体与建筑结构拉结"},{"key":"D","text":"杆件连接"},{"key":"E","text":"架体防护"}],"answer":"ABCD","basis":"《建筑施工安全检查标准》JGJ 59-2011，附录A","image":null},{"id":1587,"category":"安全生产知识","type":"multiple","seq":87,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，以下哪些属于施工用电检查评定保证项目（    ）。","options":[{"key":"A","text":"外电防护"},{"key":"B","text":"接地与接零保护系统"},{"key":"C","text":"配电箱与开关箱"},{"key":"D","text":"配电线路"},{"key":"E","text":"电气设备"}],"answer":"ABCD","basis":"《建筑施工安全检查标准》JGJ 59-2011，附录A.8","image":null},{"id":1588,"category":"安全生产知识","type":"multiple","seq":88,"stem":"根据《中华人民共和国安全生产法》，生产经营单位的主要负责人未履行本法规定的安全生产管理职责，导致发生生产安全事故的，由应急管理部门依照下列规定处以罚款（    ）。","options":[{"key":"A","text":"发生一般事故的，处上一年年收入百分之四十的罚款"},{"key":"B","text":"发生较大事故的，处上一年年收入百分之六十的罚款"},{"key":"C","text":"发生重大事故的，处上一年年收入百分之八十的罚款"},{"key":"D","text":"发生特别重大事故的，处上一年年收入百分之一百的罚款"},{"key":"E","text":"发生轻微事故的，处上一年年收入百分之二十的罚款"}],"answer":"ABCD","basis":"《中华人民共和国安全生产法》第九十五条","image":null},{"id":1589,"category":"安全生产知识","type":"multiple","seq":89,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，临边作业时

"text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011相关规定","image":null},{"id":1752,"category":"安全生产知识","type":"judge","seq":27,"stem":"《施工企业安全生产管理规范》GB50656是对施工企业安全生产管理行为提出的基本要求。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011相关规定","image":null},{"id":1753,"category":"安全生产知识","type":"judge","seq":28,"stem":"境外施工企业在我国境内承包工程时可不按照《施工企业安全生产管理规范》GB50656执行。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB 50656-2011，第1.0.2条","image":null},{"id":1754,"category":"安全生产知识","type":"judge","seq":29,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，安全生产以及文明施工管理目标应为企业安全生产标准化管理及文明施工基础工作要求的组合。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第4.0.2条","image":null},{"id":1755,"category":"安全生产知识","type":"judge","seq":30,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，工会组织的安全生产职责有对侵害职工在安全生产方面的合法权益的问题进行调查，代表职工与企业进行交涉。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第5.0.3条","image":null},{"id":1756,"category":"安全生产知识","type":"judge","seq":31,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业安全生产教育培训应贯穿于生产经营的全过程。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第7.0.1条","image":null},{"id":1757,"category":"安全生产知识","type":"judge","seq":32,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业要及时为农民工办理参加工伤保险手续。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第3.0.8条","image":null},{"id":1758,"category":"安全生产知识","type":"judge","seq":33,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工单位应当向作业人员提供安全防护用具和安全防护服装，并口头或书面告知危险岗位的操作规程和违章操作的危害。    （   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB 50656-2011，第11.0.2条","image":null},{"id":1759,"category":"安全生产知识","type":"judge","seq":34,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业宜通过信息化技术，辅助安全生产管理。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第3.0.10条","image":null},{"id":1760,"category":"安全生产知识","type":"judge","seq":35,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业应依据企业的总体发展规划，制订企业年度及中长期安全管理目标。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第4.0.1条","image":null},{"id":1761,"category":"安全生产知识","type":"judge","seq":36,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业可建立安全生产组织体系，明确企业安全生产的决策、管理、实施的机构或岗位。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB 50656-2011，第5.0.1条","image":null},{"id":1762,"category":"安全生产知识","type":"judge","seq":37,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业安全生产管理制度，应随有关法律法规以及企业生产经营、管理体制的变化，适时更新、修订完善。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第6.0.4条","image":null},{"id":1763,"category":"安全生产知识","type":"judge","seq":38,"stem":"根据《建设工程安全生产管理条例》，实行施工总承包的建设工程，由建设单位负责上报事故。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》（国务院令第393号），第五十条","image":null},{"id":1764,"category":"安全生产知识","type":"judge","seq":39,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，建筑施工单位对分包（供）单位检查和考核，无需考核分包单位安全生产绩效。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工企业安全生产管理规范》GB 50656-2011，第11.0.4条","image":null},{"id":1765,"category":"安全生产知识","type":"judge","seq":40,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，工程项目部应接受企业各管理层职能部门和岗位的安全生产管理。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第12.0.1条","image":null},{"id":1766,"category":"安全生产知识","type":"judge","seq":41,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业的安全生产管理体系应根据企业安全管理目标、施工生产特点和规模建立完善，并应有效运行。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第3.0.2条","image":null},{"id":1767,"category":"安全生产知识","type":"judge","seq":42,"stem":"隐患是指可能导致职业伤害或疾病、财产损失、工作环境破坏或这些情况组合的根源或状态。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1768,"category":"安全生产知识","type":"judge","seq":43,"stem":"根据《危险性较大的分部分项工程安全管理办法》，对可能影响行人、交通、电力设施、通讯设施或其它建、构筑物安全的拆除工程专项施工方案，应按相关规定组织专家论证。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《危险性较大的分部分项工程安全管理办法》（建质〔2009〕87号）","image":null},{"id":1769,"category":"安全生产知识","type":"judge","seq":44,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程施工可配备兼职安全生产管理人员，对各项安全技术措施进行监督、检查。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.4条","image":null},{"id":1770,"category":"安全生产知识","type":"judge","seq":45,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程施工应先切断电源、水源和气源，再拆除设备管线设施及主体结构。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.6条","image":null},{"id":1771,"category":"安全生产知识","type":"judge","seq":46,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，主体结构拆除宜先拆除非承重结构及附属设施，再拆除承重结构。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.6条","image":null},{"id":1772,"category":"安全生产知识","type":"judge","seq":47,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程施工根据实际施工条件,可以进行立体交叉作业，但应做好安全防护措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第5.1.1条","image":null},{"id":1773,"category":"安全生产知识","type":"judge","seq":48,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程施工中，应对拟拆除物的稳定状态进行监测；当发现事故隐患时，必须停止作业。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.8条","image":null},{"id":1774,"category":"安全生产知识","type":"judge","seq":49,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，对局部拆除影响结构安全的，应先加固后再拆除。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.9条","image":null},{"id":1775,"category":"安全生产知识","type":"judge","seq":50,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除地下物，应采取保证基坑边坡及周边建筑物、构筑物的安全与稳定的措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.10条","image":null},{"id":1776,"category":"安全生产知识","type":"judge","seq":51,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程作业中，发现不明物体时应及时上报有关部门，施工时应采取相应的应急措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.11条","image":null},{"id":1777,"category":"安全生产知识","type":"judge","seq":52,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，对有限空间拆除施工，应遵循先检测，后通风，再作业。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.12条","image":null},{"id":1778,"category":"安全生产知识","type":"judge","seq":53,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，当进入有限空间拆除作业时,应采取强制性定期通风措施，保持空气流通。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.13条","image":null},{"id":1779,"category":"安全生产知识","type":"judge","seq":54,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，当进入有限空间拆除作业时,可采用纯氧通风换气。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.13条","image":null},{"id":1780,"category":"安全生产知识","type":"judge","seq":55,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，对储存危险品的拟拆除物，拆除前作业人员穿戴好相应劳动防护用品即可进行作业。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.10条","image":null},{"id":1781,"category":"安全生产知识","type":"judge","seq":56,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，对生产危险品的拟拆除物，拆除施工前应先进行残留物的检测和处理，合格后方可进行施工。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第3.0.14条","image":null},{"id":1782,"category":"安全生产知识","type":"judge","seq":57,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，对拆除工程施工的区域,应设置警戒带进行封闭管理，并设置安全警示标志。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第4.0.3条","image":null},{"id":1783,"category":"安全生产知识","type":"judge","seq":58,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程施工前，应进行现场勘查，调查了解地上、地下建筑物及设施和毗邻建筑物、构筑物等分布情况。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第4.0.2条","image":null},{"id":1784,"category":"安全生产知识","type":"judge","seq":59,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程施工前，应对影响施工的管线进行迁移或保护，作业前还应进行复查。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第4.0.4条与第4.0.5条","image":null},{"id":1785,"category":"安全生产知识","type":"judge","seq":60,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，拆除工程所用的施工机具，只要是新购的合格产品，施工前可以不进行进场验收。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第4.0.7条","image":null},{"id":1786,"category":"安全生产知识","type":"judge","seq":61,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，当拟拆除物与毗邻建筑及道路的安全距离不能满足要求时，作业前做详细安全技术交底后可以施工。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第4.0.6条","image":null},{"id":1787,"category":"安全生产知识","type":"judge","seq":62,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，人工拆除施工应从上至下逐层拆除，并应分段进行，不得垂直交叉作业。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第5.1.1条","image":null},{"id":1788,"category":"安全生产知识","type":"judge","seq":63,"stem":"未取得安全生产施工许可证的可以承接施工任务。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工企业安全生产许可证管理规定》第二条","image":null},{"id":1789,"category":"安全生产知识","type":"judge","seq":64,"stem":"根据《施工企业安全生产评价标准》JGJ/T 77-2010，施工企业安全生产评价时无在建工程项目，应在企业有在建工程项目时，再次进行跟踪评价。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产评价标准》JGJ/T 77-2010，第4.0.7条","image":null},{"id":1790,"category":"安全生产知识","type":"judge","seq":65,"stem":"根据《施工企业安全生产评价标准》JGJ/T 77-2010，安全技术交底是针对性较强的分部、分项施工安全的作业指导书。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产评价标准》JGJ/T 77-2010，第3.2.5条","image":null},{"id":1791,"category":"安全生产知识","type":"judge","seq":66,"stem":"施工现场加强安全检查和隐患排查，发现和消除安全隐患，制定施工组织设计，是控制事故的有效手段。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1792,"category":"安全生产知识","type":"judge","seq":67,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业应建立制度对所属的施工现场、后方场站、基地等组织定期和不定期的安全检查。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第15.0.1条、第15.0.3条","image":null},{"id":1793,"category":"安全生产知识","type":"judge","seq":68,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工企业应建立以企业法人为核心分级负责的各部门及各类人员的安全生产责任制。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第5.0.3条、第5.0.4条","image":null},{"id":1794,"category":"安全生产知识","type":"judge","seq":69,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，事故没有一定的偶然性，所以抽查项目数考虑有一定的自由度。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工企业安全生产评价标准》JGJ/T 77-2010，第4.0.6条","image":null},{"id":1795,"category":"安全生产知识","type":"judge","seq":70,"stem":"施工企业安全生产评价，只需执行《施工企业安全生产评价标准》的规定，可不考虑现行的其他国家标准。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1796,"category":"安全生产知识","type":"judge","seq":71,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，施工现场工作环境是指施工作业场所内的场地、道路、工况、水文、地质、气候等客观条件。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第2.0.4条","image":null},{"id":1797,"category":"安全生产知识","type":"judge","seq":72,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，风险是指某一特定危险情况发生的可能性和后果的组合。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第2.0.7条","image":null},{"id":1798,"category":"安全生产知识","type":"judge","seq":73,"stem":"根据《施工企业安全生产管理规范》GB 50656-2011，安全生产规章制度和操作规程的配备是施工企业实施安全生产管理工作的前提。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产管理规范》GB 50656-2011，第3.0.2条","image":null},{"id":1799,"category":"安全生产知识","type":"judge","seq":74,"stem":"根据《建筑施工组织设计规范》GB/T 50502-2009，施工组织设计是施工企业项目施工的指导性文件。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工组织设计规范》GB/T 50502-2009，第2.0.1条","image":null},{"id":1800,"category":"安全生产知识","type":"judge","seq":75,"stem":"《施工企业安全生产评价标准》适用于对施工企业进行安全生产条件和能力的评价。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1801,"category":"安全生产知识","type":"judge","seq":76,"stem":"根据《施工企业安全生产评价标准》JGJ/T 77-2010，对评价方法仅有初评结论的企业，各地建设行政主管部门可制定相应的管理措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《施工企业安全生产评价标准》JGJ/T 77-2010，第4.0.6条","image":null},{"id":1802,"category":"安全生产知识","type":"judge","seq":77,"stem":"施工企业可以不用根据企业规模建立自身安全管理组织体系。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1803,"category":"安全生产知识","type":"judge","seq":78,"stem":"施工现场是不容易发生事故的场所。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1804,"category":"安全生产知识","type":"judge","seq":79,"stem":"根据《危险性较大的分部分项工程安全管理规定》，专项施工方案是针对危险性较大的分部、分项工程编制的作业指导书。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号）第十条","image":null},{"id":1805,"category":"安全生产知识","type":"judge","seq":80,"stem":"施工现场不得使用不符合国家现行标准规范的设备、设施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1806,"category":"安全生产知识","type":"judge","seq":81,"stem":"施工企业安全设施和个人防护用品的合理配置，可以最大限度保护施工现场作业人员，防止工伤事故的发生，减轻事故造成的损失。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1807,"category":"安全生产知识","type":"judge","seq":82,"stem":"项目安全员不参加事故的调查分析和重大事故的处理。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1808,"category":"安全生产知识","type":"judge","seq":83,"stem":"基层单位安全总监不参与项目月度安全考评。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1809,"category":"安全生产知识","type":"judge","seq":84,"stem":"根据《建设工程安全生产管理条例》（国务院令第393号），项目级安全教育培训由项目经理部组织实施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程安全生产管理条例》（国务院令第393号）第三十七条","image":null},{"id":1810,"category":"安全生产知识","type":"judge","seq":85,"stem":"根据《建设工程安全生产管理条例》（国务院令第393号），由专职安全管理人员结合分项工程施工实际和项目季节性施工方案，向所管理的作业班组进行安全技术交底。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》（国务院令第393号）第二十七条","image":null},{"id":1811,"category":"安全生产知识","type":"judge","seq":86,"stem":"施工现场是容易发生事故的场所，所以企业的每个施工现场必须按照规范标准要去达到合格。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1812,"category":"安全生产知识","type":"judge","seq":87,"stem":"根据《危险性较大的分部分项工程安全管理规定》（住建部令第37号），施工组织设计和危险性较大的分部分项工程专项施工方案的交底由项目负责人组织，由安全总监向项目经理部的专业工长、技术员等施工管理人员进行方案交底。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号），第十五条","image":null},{"id":1813,"category":"安全生产知识","type":"judge","seq":88,"stem":"根据《危险性较大的分部分项工程安全管理规定》（住建部令第37号），加强对施工危险源的监管和公示、告知，是切实消除安全隐患，杜绝工伤事故发生的有效手段。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号），第十四条","image":null},{"id":1814,"category":"安全生产知识","type":"judge","seq":89,"stem":"根据《危险性较大的分部分项工程安全管理规定》（住建部令第37号），分部分项工程无需编制专项施工方案，安全技术措施是针对分部分项工程施工安全的重要保障。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号）第十条","image":null},{"id":1815,"category":"安全生产知识","type":"judge","seq":90,"stem":"根据《中华人民共和国安全生产法》，提高企业员工安全防范技能，企业必须要建立事故应急救援预案。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国安全生产法》第八十一条、第八十二条","image":null},{"id":1816,"category":"安全生产知识","type":"judge","seq":91,"stem":"安全生产责任是搞好安全工作的根本要求。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1817,"category":"安全生产知识","type":"judge","seq":92,"stem":"根据《中华人民共和国安全生产法》，进入施工现场的作业人员应逐级进行入场安全教育及岗位能力培训，经考核合格后方可上岗。特种作业人员应符合从业准人条件，持证上岗。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国安全生产法》第二十五条","image":null},{"id":1818,"category":"安全生产知识","type":"judge","seq":93,"stem":"工程项目的工期根据工程质量、施工安全确定，可以改变工期。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1819,"category":"安全生产知识","type":"judge","seq":94,"stem":"各种安全防护棚上严禁堆放物料，使用期间棚顶可以上人作业。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1820,"category":"安全生产知识","type":"judge","seq":95,"stem":"在高处作业时，严禁往上、下抛掷任何物品，拆下的材料，应及时清理运送到指定的地点。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1821,"category":"安全生产知识","type":"judge","seq":96,"stem":"根据《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011，脚手架使用过程中，严禁任意拆除连墙件。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011，第9.0.13条","image":null},{"id":1822,"category":"安全生产知识","type":"judge","seq":97,"stem":"根据《施工脚手架通用规范》（GB 55023-2022），拆除作业过程中，当架体的自由端高度大于3步时，应增设临时拉结件。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工脚手架通用规范》GB 55023-2022，第5.4.2条","image":null},{"id":1823,"category":"安全生产知识","type":"judge","seq":98,"stem":"附着式升降脚手架应设置安全可靠的具有防倾覆、防坠落和同步升降控制功能的结构装置。升降时应设专人对脚手架作业区域进行监护，每提升一次都应经验收合格后方可作业。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.5.1条，第4.7.3条，第8.1.4条","image":null},{"id":1824,"category":"安全生产知识","type":"judge","seq":99,"stem":"根据《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011，国家对扣件式钢管脚手架使用的扣件实行生产许可证制度。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011，第8.1.3条","image":null},{"id":1825,"category":"安全生产知识","type":"judge","seq":100,"stem":"根据《龙门架及井架物料提升机安全技术规范》JGJ 88-2010，提升架操作平台、料台和吊脚手架应具有足够的承载力和刚度。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《龙门架及井架物料提升机安全技术规范》JGJ 88-2010，第5.1.2条","image":null},{"id":1826,"category":"安全生产知识","type":"judge","seq":101,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，在浇筑混凝土作业时，支撑架下部范围内严禁人员作业，可以行走或停留。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第4.6.16条","image":null},{"id":1827,"category":"安全生产知识","type":"judge","seq":102,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，围挡宜选用彩钢板等轻质材料，围挡外侧为街道或行人通道时，可以不用加固措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第4.8.4条","image":null},{"id":1828,"category":"安全生产知识","type":"judge","seq":103,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，爆破拆除工程的预拆除施工中，不应拆除影响结构稳定的构件。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑拆除工程安全技术规范》JGJ 147-2016，第5.3.3条","image":null},{"id":1829,"category":"安全生产知识","type":"judge","seq":104,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，栏杆下部应设置高度不小于180mm的挡脚板。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第4.3.1条","image":null},{"id":1830,"category":"安全生产知识","type":"judge","seq":105,"stem":"根据《高处作业吊篮》GB/T 19155-2017，作业时，工人将安全带挂在吊篮升降用的钢丝绳上。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《高处作业吊篮》GB/T 19155-2017，第5.2.6条","image":null},{"id":1831,"category":"安全生产知识","type":"judge","seq":106,"stem":"根据《建筑防火通用规范》（GB 55037-2022），施工现场油漆作业与焊接作业可同时在同一区域内进行。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑防火通用规范》GB 55037-2022，第11.0.1条","image":null},{"id":1832,"category":"安全生产知识","type":"judge","seq":107,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，电梯井口应设置防护门，其高度不应小于1.5m，防护门底端距地面高度不应大于50mm，并应设置高度不小于180mm的挡脚板。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第4.2.2条","image":null},{"id":1833,"category":"安全生产知识","type":"judge","seq":108,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，电梯井内的施工层上部，可不用设置隔离防护设施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第4.2.3条","image":null},{"id":1834,"category":"安全生产知识","type":"judge","seq":109,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，密目式安全立网可以代替安全平网使用。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第8.1.2条","image":null},{"id":1835,"category":"安全生产知识","type":"judge","seq":110,"stem":"根据《建筑施工易发事故防治安全标准》JGJ/T 429-2018，安全绳有效长度不应大于2m，有两根安全绳的安全带单根绳的有效长度不应大于1.2m。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工易发事故防治安全标准》JGJ/T 429-2018，第5.1.6条第","image":null},{"id":1836,"category":"安全生产知识","type":"judge","seq":111,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，当采用坡道代替梯道时，应加设间距不大于400mm的防滑条等防滑措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第5.1.11条","image":null},{"id":1837,"category":"安全生产知识","type":"judge","seq":112,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，施工现场安全管理检查评分表中未按规定配备专职安全员应扣10分。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工安全检查标准》JGJ 59-2011，表B.1","image":null},{"id":1838,"category":"安全生产知识","type":"judge","seq":113,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，施工现场应建立安全生产责任制、责任目标考核制度。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工安全检查标准》JGJ 59-2011，第3.1.3条","image":null},{"id":1839,"category":"安全生产知识","type":"judge","seq":114,"stem":"根据《危险性较大的分部分项工程安全管理规定》，危险性较大的分部分项工程未经专家论证不得按照方案组织实施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号）第十二条","image":null},{"id":1840,"category":"安全生产知识","type":"judge","seq":115,"stem":"根据《危险性较大的分部分项工程安全管理规定》，分部分项工程未经安全员进行安全技术交底不得施工。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号）第十五条","image":null},{"id":1841,"category":"安全生产知识","type":"judge","seq":116,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，安全隐患整改应做到定人、定时间、定措施进行整改。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工安全检查标准》JGJ 59-2011，第3.1.3条","image":null},{"id":1842,"category":"安全生产知识","type":"judge","seq":117,"stem":"根据《建设工程安全生产管理条例》，施工管理人员、专职安全员每季度应进行安全教育培训和考核。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》（国务院令第393号）第三十六条","image":null},{"id":1843,"category":"安全生产知识","type":"judge","seq":118,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，建筑材料、构件、料具应按施工现场布局进行码放。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工安全检查标准》JGJ 59-2011，第3.2.3条","image":null},{"id":1844,"category":"安全生产知识","type":"judge","seq":119,"stem":"在《建筑施工安全检查标准》中，表示严格，在正常情况下均应该这样做的；正面词采用 “应”。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1845,"category":"安全生产知识","type":"judge","seq":120,"stem":"夜间施工前，必须经批准后方可进行施工。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1846,"category":"安全生产知识","type":"judge","seq":121,"stem":"在《建筑施工安全检查标准》JGJ 59-2011中，表示严格，在正常情况下均应该这样做的；反面词采用 “不应”或“不得”。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1847,"category":"安全生产知识","type":"judge","seq":122,"stem":"建筑施工安全检查除应符合《建筑施工安全检查标准》外，尚应符合国家现行有关标准的规定。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1848,"category":"安全生产知识","type":"judge","seq":123,"stem":"在《建筑施工安全检查标准》JGJ 59-2011中，表示有选择，在一定条件下可以这样做的，采用“可”。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1849,"category":"安全生产知识","type":"judge","seq":124,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，建筑施工安全检查评定，当汇总表得分值70分时，评定为不合格。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工安全检查标准》JGJ 59-2011，第5.0.2条","image":null},{"id":1850,"category":"安全生产知识","type":"judge","seq":125,"stem":"在《建筑施工安全检查标准》中，施工现场配电系统应同时采用两种保护系统给以加分。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工安全检查标准》JGJ 59-2011，第3.14.3条","image":null},{"id":1851,"category":"安全生产知识","type":"judge","seq":126,"stem":"JGJ59-2011建筑施工安全检查标准是国家标准。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1852,"category":"安全生产知识","type":"judge","seq":127,"stem":"在《建筑施工安全检查标准》中，深度在2.5米以内的基层施工采取警戒隔离的符合规范要求，不扣分。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1853,"category":"安全生产知识","type":"judge","seq":128,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，建筑施工安全检查评定划分为优良，合格，不合格三个等级。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工安全检查标准》JGJ 59-2011，第5.0.1条","image":null},{"id":1854,"category":"安全生产知识","type":"judge","seq":129,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，建筑施工安全检查评定中当有一分项检查评分表得零分时,评定等级划分为合格。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工安全检查标准》JGJ 59-2011，第5.0.2条","image":null},{"id":1855,"category":"安全生产知识","type":"judge","seq":130,"stem":"根据《建筑施工安全检查标准》JGJ 59-2011，当按分项检查评分表评分时，保证项目小计得分不足40分，此分项检查评分表不应得分。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工安全检查标准》JGJ 59-2011，第4.0.3条","image":null},{"id":1856,"category":"安全生产知识","type":"judge","seq":131,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，管理人员具备与其相关的危险源、职业健康安全风险和所确定的措施的能力，属于组织中职业健康安全管理体系的能力。    （   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》第7.2条、第7.3条","image":null},{"id":1857,"category":"安全生产知识","type":"judge","seq":132,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，职业健康安全管理体系中，为了保证组织具备一定的能力，工作人员需要有适当的教育或者培训经历。    （   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》第7.2条","image":null},{"id":1858,"category":"安全生产知识","type":"judge","seq":133,"stem":"根据《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》的内容，进行职业健康安全管理沟通时，应确保所沟通的职业健康安全信息与职业健康安全管理体系内所形成的信息一致且可靠。   （   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《GB/T 45001—2020/ISO职业健康安全管理体系要求及使用指南》第7.3条","image":null},{"id":1859,"category":"安全生产知识","type":"judge","seq":134,"stem":"根据《中华人民共和国安全生产法》，生产经营单位应当安排用于配备劳动防护用品、进行安全生产培训的经费。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国安全生产法》第四十七条","image":null},{"id":1860,"category":"安全生产知识","type":"judge","seq":135,"stem":"根据《中华人民共和国安全生产法》，生产经营单位必须依法参加工伤社会保险，为从业人员缴纳保险费。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国安全生产法》第五十一条","image":null},{"id":1861,"category":"安全生产知识","type":"judge","seq":136,"stem":"根据《中华人民共和国安全生产法》，建筑施工单位从业人员超过一百人的，应当设置安全生产管理机构或者配备专职安全生产管理人员；从业人员在一百人以下的，应当配备专职或者兼职的安全生产管理人员。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《中华人民共和国安全生产法》第二十四条","image":null},{"id":1862,"category":"安全生产知识","type":"judge","seq":137,"stem":"根据《中华人民共和国安全生产法》，国家对严重危及生产安全的工艺、设备实行改进制度。生产经营单位不得使用应当淘汰的危及生产安全的工艺、设备。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《中华人民共和国安全生产法》第三十八条","image":null},{"id":1863,"category":"安全生产知识","type":"judge","seq":138,"stem":"根据《中华人民共和国安全生产法》，生产经营单位的从业人员有权了解其作业场所和工作岗位存在的危险因素、防范措施及事故应急措施，有权对本单位的安全生产工作提出建议。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国安全生产法》第五十三条","image":null},{"id":1864,"category":"安全生产知识","type":"judge","seq":139,"stem":"施工单位必须遵守安全生产法律、法规的规定，保证建设工程的经济效益及技术先进性。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1865,"category":"安全生产知识","type":"judge","seq":140,"stem":"根据《建设工程安全生产管理条例》，出租单位禁止出租检测不合格的机械设备和施工机具及配件。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程安全生产管理条例》（国务院令第393号）第十六条​","image":null},{"id":1866,"category":"安全生产知识","type":"judge","seq":141,"stem":"根据《建设工程安全生产管理条例》，检验检测机构对检测合格的施工起重机械和整体提升脚手架、模板等自升式架设设施，应当出具安全合格证明文件，但不对检测结果负责。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》（国务院令第393号）第十九条​","image":null},{"id":1867,"category":"安全生产知识","type":"judge","seq":142,"stem":"根据《建设工程安全生产管理条例》，施工单位的项目负责人应当由取得相应执业资格的人员担任，对建设工程项目的安全施工负责。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程安全生产管理条例》（国务院令第393号）第二十一条​","image":null},{"id":1868,"category":"安全生产知识","type":"judge","seq":143,"stem":"根据《建设工程安全生产管理条例》，施工现场临时搭建的建筑物应当符合安全使用要求。施工现场使用的装配式活动房屋应当具有产品合格证。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程安全生产管理条例》（国务院令第393号）第二十九条​","image":null},{"id":1869,"category":"安全生产知识","type":"judge","seq":144,"stem":"根据《建设工程安全生产管理条例》，施工单位应当在施工现场建立消防安全责任制度，确定消防安全责任人。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程安全生产管理条例》（国务院令第393号）第三十一条​","image":null},{"id":1870,"category":"安全生产知识","type":"judge","seq":145,"stem":"根据《中华人民共和国安全生产法》，施工单位专职安全生产管理人员依法对本单位的安全生产工作全面负责。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《中华人民共和国安全生产法》第五条","image":null},{"id":1871,"category":"安全生产知识","type":"judge","seq":146,"stem":"根据《建设工程安全生产管理条例》，施工现场暂时停止施工的，监理单位应当做好现场防护。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》第二十八条","image":null},{"id":1872,"category":"安全生产知识","type":"judge","seq":147,"stem":"根据《建设工程安全生产管理条例》，建设单位对因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等，应当采取专项防护措施。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》第三十条","image":null},{"id":1873,"category":"安全生产知识","type":"judge","seq":148,"stem":"根据《建设工程安全生产管理条例》，专职安全生产管理人员对违章指挥、违章操作的，应当立即报告，但无权制止施工单位的行为。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》第二十三条第二款","image":null},{"id":1874,"category":"安全生产知识","type":"judge","seq":149,"stem":"根据《安全生产许可证条例》，企业不得转让、冒用安全生产许可证或者使用伪造的安全生产许可证。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《安全生产许可证条例》（国务院令第397号，根据2014年国务院令第653号修订）第十三条​","image":null},{"id":1875,"category":"安全生产知识","type":"judge","seq":150,"stem":"根据《生产安全事故报告和调查处理条例》，事故发生后，有关单位和人员应妥善保护事故现场以及相关证据。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《生产安全事故报告和调查处理条例》（国务院令第493号）第十六条","image":null},{"id":1876,"category":"安全生产知识","type":"judge","seq":151,"stem":"事故调查组有权向有关单位和个人了解与事故有关的情况，并要求其提供相关文件、资料，有关单位和个人不得拒绝。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《生产安全事故报告和调查处理条例》（国务院令第493号）第二十条","image":null},{"id":1877,"category":"安全生产知识","type":"judge","seq":152,"stem":"根据《建筑起重机械安全监督管理规定》（建设部令第166号），实行施工总承包的，由施工总承包单位组织验收。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号）第十六条","image":null},{"id":1878,"category":"安全生产知识","type":"judge","seq":153,"stem":"根据《建筑起重机械安全监督管理规定》（建设部令第166号），使用单位应当设置相应的设备管理机构或者配备专职的设备管理人员。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号）第十八条","image":null},{"id":1879,"category":"安全生产知识","type":"judge","seq":154,"stem":"根据《建设工程安全生产管理条例》第八条，依法进行工程招投标的项目，招标方或具有资质的中介机构编制招标文件时，没必要单独列出安全防护、文明施工措施项目清单。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》第八条","image":null},{"id":1880,"category":"安全生产知识","type":"judge","seq":155,"stem":"施工现场劳动保护用品的质量情况不作为认定企业是否降低安全生产条件的内容之一。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1881,"category":"安全生产知识","type":"judge","seq":156,"stem":"建筑施工企业应当在建设工程项目组建安全生产领导小组。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1882,"category":"安全生产知识","type":"judge","seq":157,"stem":"根据《建筑工程施工许可管理办法》，建设主管部门核发施工许可证或者核准开工报告时，不必审查该工程项目专职安全生产管理人员的配备情况。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑工程施工许可管理办法》第四条","image":null},{"id":1883,"category":"安全生产知识","type":"judge","seq":158,"stem":"若工程规模较小，项目经理可同时在两个工程项目担任项目经理。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《注册建造师管理规定》第二十一条","image":null},{"id":1884,"category":"安全生产知识","type":"judge","seq":159,"stem":"根据《建筑拆除工程安全技术规范》JGJ 147-2016，在拆除作业前，施工单位应检查建筑内各类管线情况，根据需要确认是否全部切断方可施工。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"/","image":null},{"id":1885,"category":"安全生产知识","type":"judge","seq":160,"stem":"根据《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》，施工现场工程项目部的专职安全生产管理人员配备要求：房屋建筑工程建筑面积10万平方米及以上的工程不少于4人，每增加1万平方米增加配备1人。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》（建质规〔2025〕3号），第二十六条","image":null},{"id":1886,"category":"安全生产知识","type":"judge","seq":161,"stem":"根据《危险性较大的分部分项工程安全管理规定》，实行施工总承包的，专项施工方案应由总承包单位和相关专业承包单位技术负责人共同签字。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《危险性较大的分部分项工程安全管理规定》（住建部令第37号），第十一条","image":null},{"id":1887,"category":"安全生产知识","type":"judge","seq":162,"stem":"根据《建设工程安全生产管理条例》，建筑施工企业应根据建筑工程特点和施工实际情况，制定施工现场生产安全事故应急救援预案，并适时组织演练。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程安全生产管理条例》（国务院令第393号）第四十九条","image":null},{"id":1888,"category":"安全生产知识","type":"judge","seq":163,"stem":"根据《建设工程施工现场消防安全技术规范》（GB 50720-2011），易燃易爆物品可和其它材料一起储藏在库房内，但应制定防火措施。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程施工现场消防安全技术规范》GB 50720-2011，第3.2.1条","image":null},{"id":1889,"category":"安全生产知识","type":"judge","seq":164,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，严禁用密目式安全立网、立网代替作平网使用。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第8.1.2条","image":null},{"id":1890,"category":"安全生产知识","type":"judge","seq":165,"stem":"根据《中华人民共和国安全生产法》，工会有权对建设单位的安全设施与主体工程同时设计、同时施工、同时投入生产，提出意见。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国安全生产法》第六十条","image":null},{"id":1891,"category":"安全生产知识","type":"judge","seq":166,"stem":"根据《中华人民共和国劳动合同法》，用人单位违章指挥、强令冒险作业危及劳动者人身安全的，劳动者可以立即解除劳动合同，不需事先告知用人单位。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国劳动合同法》第三十八条","image":null},{"id":1892,"category":"安全生产知识","type":"judge","seq":167,"stem":"根据《中华人民共和国职业病防治法》，用人单位制定或者修改有关职业病防治的规章制度，应当听取工会组织的意见。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国职业病防治法》第三条","image":null},{"id":1893,"category":"安全生产知识","type":"judge","seq":168,"stem":"安全技术交底应优先交底采用的新的安全技术方法和技术措施。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"/","image":null},{"id":1894,"category":"安全生产知识","type":"judge","seq":169,"stem":"企业主要负责人应当熟悉房屋市政工程生产安全重大事故隐患判定标准，每月对企业重大事故隐患排查整改情况至少开展1次专项检查。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》第十四条","image":null},{"id":1895,"category":"安全生产知识","type":"judge","seq":170,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，混凝土工未持特种作业资格证书属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第四条","image":null},{"id":1896,"category":"安全生产知识","type":"judge","seq":171,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，对于按照规定需要验收的危险性较大的分部分项工程，未经验收合格即进入下一道工序或投入使用属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第四条","image":null},{"id":1897,"category":"安全生产知识","type":"judge","seq":172,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，群塔作业未保持安全距离不属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第八条","image":null},{"id":1898,"category":"安全生产知识","type":"judge","seq":173,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，危险性较大的混凝土模板支撑工程未按专项施工方案要求的顺序或分层厚度浇筑混凝土属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第六条","image":null},{"id":1899,"category":"安全生产知识","type":"judge","seq":174,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，有限空间作业时现场无专人负责监护工作，或无专职安全生产管理人员现场监督属于一般隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第十一条","image":null},{"id":1900,"category":"安全生产知识","type":"judge","seq":175,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，使用混凝土泵车、打桩设备、汽车起重机、履带起重机等大型机械设备，未校核其运行路线及作业位置承载能力属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第十五条","image":null},{"id":1901,"category":"安全生产知识","type":"judge","seq":176,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，在雷雨、大雪、浓雾或大风等恶劣天气条件下违规进行吊装作业、设备安装、拆卸和高处作业属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第十五条","image":null},{"id":1902,"category":"安全生产知识","type":"judge","seq":177,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，建筑施工企业未取得安全生产许可证擅自从事建筑施工活动属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第四条","image":null},{"id":1903,"category":"安全生产知识","type":"judge","seq":178,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，建筑施工企业未按照规定要求足额配备安全生产管理人员属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第四条","image":null},{"id":1904,"category":"安全生产知识","type":"judge","seq":179,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，基坑、边坡土方超挖但有专人监护不属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第五条","image":null},{"id":1905,"category":"安全生产知识","type":"judge","seq":180,"stem":"根据房屋市政工程生产安全重大事故隐患判定标准，有限空间作业严格按照“先检测、再通风、后作业”原则进行施工，不属于重大事故隐患。(    )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第十一条","image":null},{"id":1906,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n张某在县城某工地，从事后期修补工作。项目部因后期现场条件受限，宿舍及办公区设置于在建商铺内。工人宿舍设置在商铺一层采用通铺，每间商铺内住20人。职工食堂紧靠厕所，无隔油池及油烟净化装置，食堂操作人员非专业厨师，上岗作业期间未佩戴口罩，服装不整洁。\n\n1.宿舍及办公区允许设置在建商铺内。(     )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1907,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n张某在县城某工地，从事后期修补工作。项目部因后期现场条件受限，宿舍及办公区设置于在建商铺内。工人宿舍设置在商铺一层采用通铺，每间商铺内住20人。职工食堂紧靠厕所，无隔油池及油烟净化装置，食堂操作人员非专业厨师，上岗作业期间未佩戴口罩，服装不整洁。\n\n2.施工现场生活区宿舍，每间房内最多允许住（    ）人。","options":[{"key":"A","text":"20"},{"key":"B","text":"16"},{"key":"C","text":"12"},{"key":"D","text":"8"}],"answer":"B","basis":"","image":null},{"id":1908,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n张某在县城某工地，从事后期修补工作。项目部因后期现场条件受限，宿舍及办公区设置于在建商铺内。工人宿舍设置在商铺一层采用通铺，每间商铺内住20人。职工食堂紧靠厕所，无隔油池及油烟净化装置，食堂操作人员非专业厨师，上岗作业期间未佩戴口罩，服装不整洁。\n\n3.食堂未设置隔油池及油烟净化装置，不符合相关规定要求。(    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1909,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n张某在县城某工地，从事后期修补工作。项目部因后期现场条件受限，宿舍及办公区设置于在建商铺内。工人宿舍设置在商铺一层采用通铺，每间商铺内住20人。职工食堂紧靠厕所，无隔油池及油烟净化装置，食堂操作人员非专业厨师，上岗作业期间未佩戴口罩，服装不整洁。\n\n4.食堂操作人员上岗期间应佩戴口罩、穿着整洁。（    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1910,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某市一建设项目，因施工工艺要求，分为昼夜连续施工，夜间进行施工过程中，施工现场内车辆鸣笛高速行驶，导致路面扬尘。靠近居民区一边噪音值为75dB，远离居民区一边噪音值为103dB。现场材料装卸过程中，由车辆自卸产生较大噪音。周围居民多次进行投诉，建设项目仍未采取相关措施。\n\n1.车辆在施工现场不允许鸣笛高速行驶。（    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1911,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某市一建设项目，因施工工艺要求，分为昼夜连续施工，夜间进行施工过程中，施工现场内车辆鸣笛高速行驶，导致路面扬尘。靠近居民区一边噪音值为75dB，远离居民区一边噪音值为103dB。现场材料装卸过程中，由车辆自卸产生较大噪音。周围居民多次进行投诉，建设项目仍未采取相关措施。\n\n2.靠近居民区噪音值75dB在噪音排放标准内。（    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1912,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某市一建设项目，因施工工艺要求，分为昼夜连续施工，夜间进行施工过程中，施工现场内车辆鸣笛高速行驶，导致路面扬尘。靠近居民区一边噪音值为75dB，远离居民区一边噪音值为103dB。现场材料装卸过程中，由车辆自卸产生较大噪音。周围居民多次进行投诉，建设项目仍未采取相关措施。\n\n3.材料装卸过程中应该轻拿轻放，避免产生较大噪音。（    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1913,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某市一建设项目，因施工工艺要求，分为昼夜连续施工，夜间进行施工过程中，施工现场内车辆鸣笛高速行驶，导致路面扬尘。靠近居民区一边噪音值为75dB，远离居民区一边噪音值为103dB。现场材料装卸过程中，由车辆自卸产生较大噪音。周围居民多次进行投诉，建设项目仍未采取相关措施。\n\n4.施工现场裸露的场地和堆放的土方应采取（    ）、固化或绿化等措施。","options":[{"key":"A","text":"覆盖"},{"key":"B","text":"洒水"},{"key":"C","text":"隔离"},{"key":"D","text":"清扫"}],"answer":"A","basis":"","image":null},{"id":1914,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某采石场地的作业场所存在大量的白云石粉和大理石粉，为防止粉尘飞扬，降低作业场所粉尘浓度，有效防范职业危害，采取了局部送风和排风净化除尘的措施。\n\n1.该采石场主要采取的控制技术措施有效。（    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1915,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某采石场地的作业场所存在大量的白云石粉和大理石粉，为防止粉尘飞扬，降低作业场所粉尘浓度，有效防范职业危害，采取了局部送风和排风净化除尘的措施。\n\n2.该采石场采取的控制技术措施无效，应采用湿式作业和密闭抽风除尘措施。（    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1916,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某采石场地的作业场所存在大量的白云石粉和大理石粉，为防止粉尘飞扬，降低作业场所粉尘浓度，有效防范职业危害，采取了局部送风和排风净化除尘的措施。\n\n3.长期在采石场工作的作业人员发生职业病并经鉴定与该工作环境有直接关系的可以提出相关职业病赔偿。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1917,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某采石场地的作业场所存在大量的白云石粉和大理石粉，为防止粉尘飞扬，降低作业场所粉尘浓度，有效防范职业危害，采取了局部送风和排风净化除尘的措施。\n\n4.长期在采石场工作的作业人员可能会患矽肺病。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1918,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某生态旅游风景区建设项目，发生一起火灾事故，事故造成1人死亡、2人重伤。事故发生后，现场有关人员立即如实向本企业负责人报告，并逐级上报事故。事故调查中发现该项目部未编制消防应急救援预案，未开展消防应急演练。根据以上内容，回答下列问题：\n\n1.根据《施工企业安全生产管理规范》（GB50656-2011），企业负责人按规定应在（   ）内如实向事故发生地县级以上人民政府建设主管部门和有关部门报告。","options":[{"key":"A","text":"0.5h"},{"key":"B","text":"1.5h"},{"key":"C","text":"1h"},{"key":"D","text":"2h"}],"answer":"C","basis":"","image":null},{"id":1919,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某生态旅游风景区建设项目，发生一起火灾事故，事故造成1人死亡、2人重伤。事故发生后，现场有关人员立即如实向本企业负责人报告，并逐级上报事故。事故调查中发现该项目部未编制消防应急救援预案，未开展消防应急演练。根据以上内容，回答下列问题：\n\n2.根据《施工企业安全生产管理规范》（GB50656-2011），施工企业生产安全事故报告应包括导致事故发生的主要原因分析。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1920,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某生态旅游风景区建设项目，发生一起火灾事故，事故造成1人死亡、2人重伤。事故发生后，现场有关人员立即如实向本企业负责人报告，并逐级上报事故。事故调查中发现该项目部未编制消防应急救援预案，未开展消防应急演练。根据以上内容，回答下列问题：\n\n3.该事故造成1人死亡、2人重伤，属于较大事故。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1921,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某生态旅游风景区建设项目，发生一起火灾事故，事故造成1人死亡、2人重伤。事故发生后，现场有关人员立即如实向本企业负责人报告，并逐级上报事故。事故调查中发现该项目部未编制消防应急救援预案，未开展消防应急演练。根据以上内容，回答下列问题：\n\n4.根据《施工企业安全生产管理规范》（GB50656-2011），项目部应组织对现场管理人员进行应急救援预案的培训和交底，定期组织专项应急演练。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1922,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\nA公司委托具有相应资质的K企业承接3厂房顶棚夹芯彩钢板更换工程。K企业作业人员进入现场施工，搭建了移动式脚手架，施工作业过程中，K企业临时雇佣 5名作业人员参与现场作业时，移动式脚手架踏板与脚手架之间的挂钩突然脱开，导致踏板脱落，随即脚手架倒塌，造成脚手架上3名作业人员坠落地面，地面10名作业人员被脱落的踏板、倒塌的脚手架砸伤。事故导致10人重伤、3人轻伤。事故调查中发现，施工单位未对临时雇佣的5名作业人员进行安全培训和安全技术交底；作业过程中，移动式脚手架滑轮未锁定；现场安全管理人员未及时发现隐患。根据以上场景，回答下列问题：\n\n1.根据《施工企业安全生产管理规范》（GB50656-2011）和《生产安全事故报告和调查处理条例》，该起事故的等级为（   ）。","options":[{"key":"A","text":"重大事故"},{"key":"B","text":"一般事故"},{"key":"C","text":"较大事故"},{"key":"D","text":"特大事故"}],"answer":"C","basis":"","image":null},{"id":1923,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\nA公司委托具有相应资质的K企业承接3厂房顶棚夹芯彩钢板更换工程。K企业作业人员进入现场施工，搭建了移动式脚手架，施工作业过程中，K企业临时雇佣 5名作业人员参与现场作业时，移动式脚手架踏板与脚手架之间的挂钩突然脱开，导致踏板脱落，随即脚手架倒塌，造成脚手架上3名作业人员坠落地面，地面10名作业人员被脱落的踏板、倒塌的脚手架砸伤。事故导致10人重伤、3人轻伤。事故调查中发现，施工单位未对临时雇佣的5名作业人员进行安全培训和安全技术交底；作业过程中，移动式脚手架滑轮未锁定；现场安全管理人员未及时发现隐患。根据以上场景，回答下列问题：\n\n2.根据《施工企业安全生产管理规范》（GB50656-2011）施工企业通过（   ）掌握安全生产管理活动运行的动态，发现并纠正安全生产管理活动或结果的偏差，并为确定和采取纠正措施或预防措施提供信息。","options":[{"key":"A","text":"安全教育"},{"key":"B","text":"安全检查"},{"key":"C","text":"安全交底"},{"key":"D","text":"安全例会"}],"answer":"B","basis":"","image":null},{"id":1924,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\nA公司委托具有相应资质的K企业承接3厂房顶棚夹芯彩钢板更换工程。K企业作业人员进入现场施工，搭建了移动式脚手架，施工作业过程中，K企业临时雇佣 5名作业人员参与现场作业时，移动式脚手架踏板与脚手架之间的挂钩突然脱开，导致踏板脱落，随即脚手架倒塌，造成脚手架上3名作业人员坠落地面，地面10名作业人员被脱落的踏板、倒塌的脚手架砸伤。事故导致10人重伤、3人轻伤。事故调查中发现，施工单位未对临时雇佣的5名作业人员进行安全培训和安全技术交底；作业过程中，移动式脚手架滑轮未锁定；现场安全管理人员未及时发现隐患。根据以上场景，回答下列问题：\n\n3.根据《施工企业安全生产管理规范》（GB50656-2011），K企业应该对临时雇佣的5名作业人员进行岗前安全教育培训。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1925,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\nA公司委托具有相应资质的K企业承接3厂房顶棚夹芯彩钢板更换工程。K企业作业人员进入现场施工，搭建了移动式脚手架，施工作业过程中，K企业临时雇佣 5名作业人员参与现场作业时，移动式脚手架踏板与脚手架之间的挂钩突然脱开，导致踏板脱落，随即脚手架倒塌，造成脚手架上3名作业人员坠落地面，地面10名作业人员被脱落的踏板、倒塌的脚手架砸伤。事故导致10人重伤、3人轻伤。事故调查中发现，施工单位未对临时雇佣的5名作业人员进行安全培训和安全技术交底；作业过程中，移动式脚手架滑轮未锁定；现场安全管理人员未及时发现隐患。根据以上场景，回答下列问题：\n\n4.根据《施工企业安全生产管理规范》（GB50656-2011）,为有效预防此类事故再次发生，应采取的安全技术措施包括搭设有效可靠的脚手架、踏板满铺，不使用单板、浮板和探头板和设置符合标准的防护栏杆。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1926,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某施工单位具有房屋建筑工程施工总承包特级资质，在某城市承接了装配式住宅小区工程，建筑面积170000㎡，单体工程设计高度为68m。工程处于主体结构施工阶段。现场情况包括：基坑降水（开挖深度7.80m）、落地式扣件钢管脚手架（搭设高度25m）、悬挑式脚手架、型钢悬挑卸料平台、施工升降机、装配式建筑混凝土预制构件安装和混凝土模板支撑体系（搭设高度4m、跨度20m）。根据以上场景，回答下列问题：\n\n1.根据《施工企业安全生产管理规范》（GB50656-2011），该施工单位应设置安全生产管理机构，配备专职安全生产管理人员至少应为（   ）。","options":[{"key":"A","text":"4 人"},{"key":"B","text":"5 人"},{"key":"C","text":"6 人"},{"key":"D","text":"7人"}],"answer":"C","basis":"","image":null},{"id":1927,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工单位具有房屋建筑工程施工总承包特级资质，在某城市承接了装配式住宅小区工程，建筑面积170000㎡，单体工程设计高度为68m。工程处于主体结构施工阶段。现场情况包括：基坑降水（开挖深度7.80m）、落地式扣件钢管脚手架（搭设高度25m）、悬挑式脚手架、型钢悬挑卸料平台、施工升降机、装配式建筑混凝土预制构件安装和混凝土模板支撑体系（搭设高度4m、跨度20m）。根据以上场景，回答下列问题：\n\n2.根据根据《施工企业安全生产管理规范》（GB50656-2011），施工企业应根据施工组织设计、专项安全施工方案（措施）编制和审批权限的设置，分级进行安全技术交底，编制人员应参与安全技术交底、验收和检查。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1928,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工单位具有房屋建筑工程施工总承包特级资质，在某城市承接了装配式住宅小区工程，建筑面积170000㎡，单体工程设计高度为68m。工程处于主体结构施工阶段。现场情况包括：基坑降水（开挖深度7.80m）、落地式扣件钢管脚手架（搭设高度25m）、悬挑式脚手架、型钢悬挑卸料平台、施工升降机、装配式建筑混凝土预制构件安装和混凝土模板支撑体系（搭设高度4m、跨度20m）。根据以上场景，回答下列问题：\n\n3.根据《施工企业安全生产管理规范》（GB50656-2011），工程项目部在组织装配式建筑混凝土预制构件安全施工时，项目技术负责人向现场管理人员进行方案交底，在施工现场显著位置公告危险性较大的分部分项工程名称、施工时间和责任人员，项目专职安全生产管理人员组织模板支撑体系验收。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1929,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工单位具有房屋建筑工程施工总承包特级资质，在某城市承接了装配式住宅小区工程，建筑面积170000㎡，单体工程设计高度为68m。工程处于主体结构施工阶段。现场情况包括：基坑降水（开挖深度7.80m）、落地式扣件钢管脚手架（搭设高度25m）、悬挑式脚手架、型钢悬挑卸料平台、施工升降机、装配式建筑混凝土预制构件安装和混凝土模板支撑体系（搭设高度4m、跨度20m）。根据以上场景，回答下列问题：\n\n4.落地式扣件钢管脚手架（搭设高度25m）属于危险性较大的分部分项工程，型钢悬挑卸料平台不属于危险性较大的分部分项工程。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1930,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n甲公司将某四层现浇混凝土结构的房屋拆除项目委托给乙公司，由于工程量小，工期短，甲乙双方未签订承包合同和安全管理协议。乙公司组织相关技术和安全人员现场实地查看后，认为拆除工程简单，直接找到丙施工队，由丙具体负责拆除施工；拆除至三层西墙体时，作业人员用大锤对墙下1米处先凿洞、再掏空，最后砸断四周柱脚，致使墙柱突然垮塌，导致3人死亡、2人受伤。根据以上场景，回答下列问题：\n\n1.甲乙双方未签订承包合同和安全管理协议的做法是否正确。（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1931,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n甲公司将某四层现浇混凝土结构的房屋拆除项目委托给乙公司，由于工程量小，工期短，甲乙双方未签订承包合同和安全管理协议。乙公司组织相关技术和安全人员现场实地查看后，认为拆除工程简单，直接找到丙施工队，由丙具体负责拆除施工；拆除至三层西墙体时，作业人员用大锤对墙下1米处先凿洞、再掏空，最后砸断四周柱脚，致使墙柱突然垮塌，导致3人死亡、2人受伤。根据以上场景，回答下列问题：\n\n2.下列的说法错误的是（   ）","options":[{"key":"A","text":"乙公司应编制拆除工程安全专项施工方案，并履行相应的审批和论证程序。"},{"key":"B","text":"丙施工队应组织对作业人员进行安全技术交底"},{"key":"C","text":"乙公司应组织对作业人员进行安全技术交底"},{"key":"D","text":"乙公司和丙施工队不需要签订安全生产协议"}],"answer":"D","basis":"","image":null},{"id":1932,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n甲公司将某四层现浇混凝土结构的房屋拆除项目委托给乙公司，由于工程量小，工期短，甲乙双方未签订承包合同和安全管理协议。乙公司组织相关技术和安全人员现场实地查看后，认为拆除工程简单，直接找到丙施工队，由丙具体负责拆除施工；拆除至三层西墙体时，作业人员用大锤对墙下1米处先凿洞、再掏空，最后砸断四周柱脚，致使墙柱突然垮塌，导致3人死亡、2人受伤。根据以上场景，回答下列问题：\n\n3.乙公司应安全专职安全员现场旁站监督，及时制止施工队的违章行为。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1933,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n甲公司将某四层现浇混凝土结构的房屋拆除项目委托给乙公司，由于工程量小，工期短，甲乙双方未签订承包合同和安全管理协议。乙公司组织相关技术和安全人员现场实地查看后，认为拆除工程简单，直接找到丙施工队，由丙具体负责拆除施工；拆除至三层西墙体时，作业人员用大锤对墙下1米处先凿洞、再掏空，最后砸断四周柱脚，致使墙柱突然垮塌，导致3人死亡、2人受伤。根据以上场景，回答下列问题：\n\n4.施工队的拆除顺序是否正确（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1934,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某改造工程，用爆破法拆除一栋四层砖混住宅楼时，爆破队现场负责人为减少爆破装药量，不按爆破方案实施，擅自更改方案，组织工人用大锤将楼房底部承重墙每隔0.5-0.8米凿开若干孔洞，承重墙面积减至原有的1/4左右，造成底层墙体承载力严重不足，楼房整体坍塌，造成2人死亡，10人重伤。根据以上场景，回答下列问题：\n\n1.拆除方案变更后应重新进行报审报批，经审批通过后方可实施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1935,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某改造工程，用爆破法拆除一栋四层砖混住宅楼时，爆破队现场负责人为减少爆破装药量，不按爆破方案实施，擅自更改方案，组织工人用大锤将楼房底部承重墙每隔0.5-0.8米凿开若干孔洞，承重墙面积减至原有的1/4左右，造成底层墙体承载力严重不足，楼房整体坍塌，造成2人死亡，10人重伤。根据以上场景，回答下列问题：\n\n2.拆除作业前，现场安全员应对作业人员进行详细的安全技术交底。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1936,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某改造工程，用爆破法拆除一栋四层砖混住宅楼时，爆破队现场负责人为减少爆破装药量，不按爆破方案实施，擅自更改方案，组织工人用大锤将楼房底部承重墙每隔0.5-0.8米凿开若干孔洞，承重墙面积减至原有的1/4左右，造成底层墙体承载力严重不足，楼房整体坍塌，造成2人死亡，10人重伤。根据以上场景，回答下列问题：\n\n3.爆破队作业人员实际采用的拆除方法为（   ）。","options":[{"key":"A","text":"人工拆除"},{"key":"B","text":"机械拆除"},{"key":"C","text":"爆破拆除"},{"key":"D","text":"静力破碎拆除"}],"answer":"A","basis":"","image":null},{"id":1937,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某改造工程，用爆破法拆除一栋四层砖混住宅楼时，爆破队现场负责人为减少爆破装药量，不按爆破方案实施，擅自更改方案，组织工人用大锤将楼房底部承重墙每隔0.5-0.8米凿开若干孔洞，承重墙面积减至原有的1/4左右，造成底层墙体承载力严重不足，楼房整体坍塌，造成2人死亡，10人重伤。根据以上场景，回答下列问题：\n\n4.按照生产安全事故等级划分标准，此次坍塌事故的等级为（   ）。","options":[{"key":"A","text":"一般事故"},{"key":"B","text":"较大事故"},{"key":"C","text":"重大事故"},{"key":"D","text":"特别重大事故"}],"answer":"B","basis":"","image":null},{"id":1938,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某建筑企业公司在建项目，在应对 ，保险未办理。根据以上内容，回答下列问题：\n\n2.总承包的施工项目，从事危险作业人员的意外伤害保险费由（   ）支付。","options":[{"key":"A","text":"建设单位"},{"key":"B","text":"总承包单位"},{"key":"C","text":"分包单位"},{"key":"D","text":"企业"}],"answer":"B","basis":"","image":null},{"id":1944,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n上海某项目应总承包及分包主要管理人员未持证在岗履职，检查过程中发现各项评定工作未按要求开展实施，并且过程中签字弄虚作假，与要求不匹配；相关人员也未进行安全教育，保险未办理。根据以上内容，回答下列问题：\n\n3.(   )的特种设备的目录由国务院负责特种设备安全监督管理的部门制定，报国务院批准后执行。","options":[{"key":"A","text":"涉及生命安全、危险性较大"},{"key":"B","text":"涉及有使用风险"},{"key":"C","text":"涉及工程建设"},{"key":"D","text":"涉及工程施工危险管控"}],"answer":"A","basis":"","image":null},{"id":1945,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n上海某项目应总承包及分包主要管理人员未持证在岗履职，检查过程中发现各项评定工作未按要求开展实施，并且过程中签字弄虚作假，与要求不匹配；相关人员也未进行安全教育，保险未办理。根据以上内容，回答下列问题：\n\n4.生产经营单位对重大危险源应当(   )进行定期检测、评估、监控，并制定应急预案，告知从业人员和相关人员在紧急情况下应当采取的应急措施。","options":[{"key":"A","text":"坚决弃置"},{"key":"B","text":"登记建档"},{"key":"C","text":"保安安全"},{"key":"D","text":"专人管理"}],"answer":"B","basis":"","image":null},{"id":1946,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n廊坊建筑公司承建市政府办公楼项目，由具有相应资质的廊坊二建承担在施工现场安装、拆卸施工起重机械和整体提升脚手架、模板等自升式架设设施的任务，整个工程由廊坊市建筑设计院设计，远达监理公司监理，部分工程分包给原北二建、原北四建。根据以上场景，回答下列问题：\n\n1.为赶工期，廊坊建筑公司可以和原北二建共同在施工现场安装、拆卸施工起重机械。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1947,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n廊坊建筑公司承建市政府办公楼项目，由具有相应资质的廊坊二建承担在施工现场安装、拆卸施工起重机械和整体提升脚手架、模板等自升式架设设施的任务，整个工程由廊坊市建筑设计院设计，远达监理公司监理，部分工程分包给原北二建、原北四建。根据以上场景，回答下列问题：\n\n2.因为原北二建经常安装、拆卸施工起重机械和整体提升脚手架、模板等自升式架设设施，所以对此项目不必单独编制拆装方案、制定安全施工措施。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1948,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n廊坊建筑公司承建市政府办公楼项目，由具有相应资质的廊坊二建承担在施工现场安装、拆卸施工起重机械和整体提升脚手架、模板等自升式架设设施的任务，整个工程由廊坊市建筑设计院设计，远达监理公司监理，部分工程分包给原北二建、原北四建。根据以上场景，回答下列问题：\n\n3.施工起重机械和整体提升脚手架、模板等自升式架设设施安装完毕后，原北二建应当自检，出具自检合格证明，并向廊坊建筑公司进行安全使用说

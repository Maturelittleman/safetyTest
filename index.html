{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1954,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某工地，在主体施工阶段，A楼浇筑混凝土时因混凝土供应不及时发生堵管，混凝土班组长张某发现后私自联系A.B塔吊进行双塔抬吊拆卸布料机与泵管，在指挥李某确认绑扎好后清除吊装区域作业人员，起勾后因两个塔吊起勾速度不一致，导致泵管弹飞，撞向指挥李某，导致李某重伤。请判断下列事故原因分析是否正确。\n\n1.超过（   ）级以上大风不得进行起重吊装作业。","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"7"}],"answer":"C","basis":"","image":null},{"id":1955,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地，在主体施工阶段，A楼浇筑混凝土时因混凝土供应不及时发生堵管，混凝土班组长张某发现后私自联系A.B塔吊进行双塔抬吊拆卸布料机与泵管，在指挥李某确认绑扎好后清除吊装区域作业人员，起勾后因两个塔吊起勾速度不一致，导致泵管弹飞，撞向指挥李某，导致李某重伤。请判断下列事故原因分析是否正确。\n\n2.吊装区域未有效管控。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1956,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地，在主体施工阶段，A楼浇筑混凝土时因混凝土供应不及时发生堵管，混凝土班组长张某发现后私自联系A.B塔吊进行双塔抬吊拆卸布料机与泵管，在指挥李某确认绑扎好后清除吊装区域作业人员，起勾后因两个塔吊起勾速度不一致，导致泵管弹飞，撞向指挥李某，导致李某重伤。请判断下列事故原因分析是否正确。\n\n3.两个塔吊吊装同一吊装物，吊装信号不一致对吊装安全不影响。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1957,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地，在主体施工阶段，A楼浇筑混凝土时因混凝土供应不及时发生堵管，混凝土班组长张某发现后私自联系A.B塔吊进行双塔抬吊拆卸布料机与泵管，在指挥李某确认绑扎好后清除吊装区域作业人员，起勾后因两个塔吊起勾速度不一致，导致泵管弹飞，撞向指挥李某，导致李某重伤。请判断下列事故原因分析是否正确。\n\n4.起重吊装作业时，相关人员可以不进行旁站监督。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1958,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某在建项目建筑面积约2万平方米，项目配备项目负责人、施工员、资料员、材料员共4名管理人员，相关部门在检查过程中发现项目安全管理体系不健全、无施工方案、人员管理混乱、防护设施随意搭设、机械设备等存在重大隐患；按照《建筑施工安全检查评分标准》该项目整体评分结果为不合格项目，要求立即停工限期整改。根据以上内容，回答下列问题。\n\n1.当施工人员入场时，工程项目部应组织进行以国家安全法律法规、企业安全制度、施工现场安全管理规定及各工种安全技术操作规程为主要内容的三级安全教育培训和考核（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1959,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某在建项目建筑面积约2万平方米，项目配备项目负责人、施工员、资料员、材料员共4名管理人员，相关部门在检查过程中发现项目安全管理体系不健全、无施工方案、人员管理混乱、防护设施随意搭设、机械设备等存在重大隐患；按照《建筑施工安全检查评分标准》该项目整体评分结果为不合格项目，要求立即停工限期整改。根据以上内容，回答下列问题。\n\n2.该项目塔式起重机未制定安装、拆卸专项方案根据建筑施工安全检查标准扣10分，基础未设置排水措施扣4分，该项在评分中得分86分（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1960,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某在建项目建筑面积约2万平方米，项目配备项目负责人、施工员、资料员、材料员共4名管理人员，相关部门在检查过程中发现项目安全管理体系不健全、无施工方案、人员管理混乱、防护设施随意搭设、机械设备等存在重大隐患；按照《建筑施工安全检查评分标准》该项目整体评分结果为不合格项目，要求立即停工限期整改。根据以上内容，回答下列问题。\n\n3.该项目在检查过程中施工机具检查评分表总得分为79分，在建筑施工安全检查评分汇总表中施工机具应得（   ）分。","options":[{"key":"A","text":"7.9"},{"key":"B","text":"7.5"},{"key":"C","text":"3.95"},{"key":"D","text":"3.96"}],"answer":"C","basis":"","image":null},{"id":1961,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某在建项目建筑面积约2万平方米，项目配备项目负责人、施工员、资料员、材料员共4名管理人员，相关部门在检查过程中发现项目安全管理体系不健全、无施工方案、人员管理混乱、防护设施随意搭设、机械设备等存在重大隐患；按照《建筑施工安全检查评分标准》该项目整体评分结果为不合格项目，要求立即停工限期整改。根据以上内容，回答下列问题。\n\n4.如果该项目基坑工程已施工完成，基坑工程在汇总表中为缺项，其他各分项检查在汇总表中实得分为56分，计算该项目汇总表实得分为（   ）分。","options":[{"key":"A","text":"61.8"},{"key":"B","text":"62.2"},{"key":"C","text":"70.5"},{"key":"D","text":"70.3"}],"answer":"B","basis":"","image":null},{"id":1962,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某县在建工地在申报XX省级年度建筑施工安全标准化工地申报过程中，依据建筑施工安全检查表评分，该项目总体评定为优良，但未能通过XX省级标准化工地，分析原因如：\n\n1.该项目在申报标准化工地资料直接报送至XX市住房和城乡建设厅（  ）。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1963,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某县在建工地在申报XX省级年度建筑施工安全标准化工地申报过程中，依据建筑施工安全检查表评分，该项目总体评定为优良，但未能通过XX省级标准化工地，分析原因如：\n\n2.该项目申报资料中《建筑施工安全检查评分表》应按（   ）进行评分申报。","options":[{"key":"A","text":"每月"},{"key":"B","text":"每季度"},{"key":"C","text":"每半年"},{"key":"D","text":"施工阶段"}],"answer":"A","basis":"","image":null},{"id":1964,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某县在建工地在申报XX省级年度建筑施工安全标准化工地申报过程中，依据建筑施工安全检查表评分，该项目总体评定为优良，但未能通过XX省级标准化工地，分析原因如：\n\n3.省级标准化工地总体评分最低应为（   )分。","options":[{"key":"A","text":"90分以上"},{"key":"B","text":"80分以上"},{"key":"C","text":"75分以上"},{"key":"D","text":"70分以上"}],"answer":"B","basis":"","image":null},{"id":1965,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某县在建工地在申报XX省级年度建筑施工安全标准化工地申报过程中，依据建筑施工安全检查表评分，该项目总体评定为优良，但未能通过XX省级标准化工地，分析原因如：\n\n4.申报省级标准化工地该项目监理总监过程中有变更，变更手续不需要与申报资料一同上报（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1966,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n天地建设工程有限公司在董事长的安排下，由小李负责牵头，对公司职业健康安全管理体系进行修订，在修订过程中，就实现体系长期有效的运行与持续改进，遇到了一些问题，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答以下问题：\n\n1.本次修订时，不应该考虑（ ）因素。","options":[{"key":"A","text":"外部法律法规的要求变化"},{"key":"B","text":"公司生产工艺、生产组织、生产条件的变化"},{"key":"C","text":"新工艺、新技术的发展"},{"key":"D","text":"公司近年来的荣誉"}],"answer":"D","basis":"","image":null},{"id":1967,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n天地建设工程有限公司在董事长的安排下，由小李负责牵头，对公司职业健康安全管理体系进行修订，在修订过程中，就实现体系长期有效的运行与持续改进，遇到了一些问题，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答以下问题：\n\n2.本次修订前，应该先对体系进行内部评审和管理评审，说法不正确的有（   ）。","options":[{"key":"A","text":"需要考虑与体系相关的内外部议题的变化，包括新的需求与期望"},{"key":"B","text":"需要考虑与内外部相关的法律法规的变化"},{"key":"C","text":"需要考虑内外部变化的风险和机遇"},{"key":"D","text":"董事长组织做内部评审，考虑目标和方针的实现程度"}],"answer":"A","basis":"","image":null},{"id":1968,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n天地建设工程有限公司在董事长的安排下，由小李负责牵头，对公司职业健康安全管理体系进行修订，在修订过程中，就实现体系长期有效的运行与持续改进，遇到了一些问题，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答以下问题：\n\n3.为了实现管理体系的持续改进，小李收集了一些文件信息，和管理体系持续改进有密切关系的有（  ）。","options":[{"key":"A","text":"危险源识别清单"},{"key":"B","text":"管理体系策划"},{"key":"C","text":"体系的变更和适应的记录"},{"key":"D","text":"与工作人员进行沟通的记录"}],"answer":"D","basis":"","image":null},{"id":1969,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n天地建设工程有限公司在董事长的安排下，由小李负责牵头，对公司职业健康安全管理体系进行修订，在修订过程中，就实现体系长期有效的运行与持续改进，遇到了一些问题，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答以下问题：\n\n4.集团内部，董事长对管理体系应负责的事项有哪些（   ）。","options":[{"key":"A","text":"董事长应该定期对管理体系进行内部评审，并形成文件化信息"},{"key":"B","text":"董事长应定期对管理体系进行管理评审，并形成适应的文件化信息"},{"key":"C","text":"董事长应组织工作人员进行必要的协商"},{"key":"D","text":"董事长应打破工作人员协商和参与之间的障碍和壁垒"}],"answer":"B","basis":"","image":null},{"id":1970,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n榆林建筑施工与装饰装修工程有限公司刚刚成立，需要制定企业职业健康安全管理体系，目前正在进行管理体系策划，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答下面的问题。\n\n1.在进行管理体系策划时，不需要考虑哪些因素，来确定需要应对的风险与机遇。（  ）","options":[{"key":"A","text":"考虑组织及其所处的环境"},{"key":"B","text":"考虑职业健康安全管理体系范围"},{"key":"C","text":"考虑相关方所提及的要求"},{"key":"D","text":"考虑工程项目特点的要求"}],"answer":"D","basis":"","image":null},{"id":1971,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n榆林建筑施工与装饰装修工程有限公司刚刚成立，需要制定企业职业健康安全管理体系，目前正在进行管理体系策划，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答下面的问题。\n\n2.在进行管理组织策划时，为了确定与体系及与其有关的风险和机遇，组织不应该（   ）。","options":[{"key":"A","text":"考虑危险源"},{"key":"B","text":"考虑职业健康安全风险和其他风险"},{"key":"C","text":"考虑职业健康安全体系的沟通与协调机制的建立"},{"key":"D","text":"考虑所涉及的法律法规的要求"}],"answer":"C","basis":"","image":null},{"id":1972,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n榆林建筑施工与装饰装修工程有限公司刚刚成立，需要制定企业职业健康安全管理体系，目前正在进行管理体系策划，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答下面的问题。\n\n3.在策划过程中，组织应结合组织及其过程或职业健康安全管理体系的变更来确定和评价与职业健康安全管理体系预期结果有关的风险和机遇。对于所策划的变更，无论是永久性的还是临时性的，这种评价均应在变更实施前进行。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1973,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n榆林建筑施工与装饰装修工程有限公司刚刚成立，需要制定企业职业健康安全管理体系，目前正在进行管理体系策划，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答下面的问题。\n\n4.在进行措施的策划时，所应考虑的措施中，不正确的是（   ）。","options":[{"key":"A","text":"如何在其职业健康安全管理体系过程中或其他业务过程中融入并实施这些措施"},{"key":"B","text":"如何评价这些措施的有效性"},{"key":"C","text":"在策划措施时，控制的层级和职业健康安全管理体系的输出由最高管理者来确定"},{"key":"D","text":"在策划措施时，组织还应考虑最佳实践、可选技术方案以及财务、运行和经营等要求"}],"answer":"C","basis":"","image":null},{"id":1974,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建设工程已委托某施工单位作为总承包单位。该施工单位提出由另一家施工单位作为分包，承担主体施工。所有安全责任由分包单位负责，如果有了事故也由分包单位上报，并已签订了分包合同。\n\n1.主体工程可以由分包单位自主承担。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1975,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建设工程已委托某施工单位作为总承包单位。该施工单位提出由另一家施工单位作为分包，承担主体施工。所有安全责任由分包单位负责，如果有了事故也由分包单位上报，并已签订了分包合同。\n\n2.国家有规定，总包单位对工程建设项目施工的安全生产负总责。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1976,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建设工程已委托某施工单位作为总承包单位。该施工单位提出由另一家施工单位作为分包，承担主体施工。所有安全责任由分包单位负责，如果有了事故也由分包单位上报，并已签订了分包合同。\n\n3.此事故应由分包单位上报。(    ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1977,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建设工程已委托某施工单位作为总承包单位。该施工单位提出由另一家施工单位作为分包，承担主体施工。所有安全责任由分包单位负责，如果有了事故也由分包单位上报，并已签订了分包合同。\n\n4.国家有规定，事故统一由建设单位上报。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1978,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装该设备的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n1.本事故的主要原因之一是违章操作，移动电器设备未切断电源。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1979,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装该设备的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n2.特种作业人员必须按照国家有关规定经过专门的安全作业培训，并取得特种作业操作资格证书后，方可上岗作业。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1980,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装该设备的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n3.下列属于特种作业人员的是(   )。","options":[{"key":"A","text":"电工"},{"key":"B","text":"木工"},{"key":"C","text":"水暖工"},{"key":"D","text":"瓦工"}],"answer":"A","basis":"","image":null},{"id":1981,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装该设备的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n4.下列关于特种作业的说法正确的是(   )。","options":[{"key":"A","text":"特种作业人员未经培训考核即从事特种作业并造成重大安全事故，不得追究其刑事责任"},{"key":"B","text":"对特种作业人员专门的安全作业培训，是指由有关主管部门组织的专门针对特种作业人员的培训"},{"key":"C","text":"特种作业是指容易发生人员伤亡事故，对操作者本人、他人及周围设施的安全有重大危害的作业"},{"key":"D","text":"特种作业人员可不考核从事相应工种作业的疾病和生理缺陷情况"}],"answer":"B","basis":"","image":null},{"id":1982,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地，焊接一膨胀水箱。焊工在完成了4/5的工作量下班后，工地负责人又安排了油漆工将焊好的部分刷上防锈漆。因场地通风不良，到第二天油漆未干。焊工上班后，未采取相应措施继续施焊，造成水箱内油漆挥发气体爆炸燃烧，焊工被烧灼伤。\n\n1.从上述案例中应吸取的主要教训是：工地负责人应严格按焊接要求组织生产，合理安排工序，进行有针对性的安全技术交底，不能强令工人冒险作业。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1983,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地，焊接一膨胀水箱。焊工在完成了4/5的工作量下班后，工地负责人又安排了油漆工将焊好的部分刷上防锈漆。因场地通风不良，到第二天油漆未干。焊工上班后，未采取相应措施继续施焊，造成水箱内油漆挥发气体爆炸燃烧，焊工被烧灼伤。\n\n2.施工现场动火前、动火过程中要严格进行环境安全检查。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1984,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地，焊接一膨胀水箱。焊工在完成了4/5的工作量下班后，工地负责人又安排了油漆工将焊好的部分刷上防锈漆。因场地通风不良，到第二天油漆未干。焊工上班后，未采取相应措施继续施焊，造成水箱内油漆挥发气体爆炸燃烧，焊工被烧灼伤。\n\n3.施工现场油漆作业与焊接作业可同时进行。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1985,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某工地，焊接一膨胀水箱。焊工在完成了4/5的工作量下班后，工地负责人又安排了油漆工将焊好的部分刷上防锈漆。因场地通风不良，到第二天油漆未干。焊工上班后，未采取相应措施继续施焊，造成水箱内油漆挥发气体爆炸燃烧，焊工被烧灼伤。\n\n4.下列施工现场消防器材的配备说法正确的是(   )。","options":[{"key":"A","text":"临时搭设的建筑物区域内，每lOO㎡配备5只10L灭火器"},{"key":"B","text":"大型临时设施总面积超过50000㎡，应备有专供消防用的太平桶、积水桶(池)、黄砂池等设施，上述设施周围不得堆放物品"},{"key":"C","text":"临时木工间、油漆间和木、机具间等每25㎡配备一只种类合适的灭火器"},{"key":"D","text":"30m高度以上高层建筑施工现场，应设置具有足够扬程的高压水泵或其他防火设备和设施"}],"answer":"C","basis":"","image":null},{"id":1986,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建筑公司在月度安全检查中，发现3号工地脚手架搭设存在如下问题：①超过24m高的脚手架没有搭设方案，无审批手续；②采用的分段整体提升脚手架未经审查批准；③部分使用的脚手架材料规格不一；④搭设架子的基础多处出现不平整，个别立杆悬空等等。\n\n1.为避免施工中引发脚手架坍塌事故伤害作业人员，脚手架立即停止使用。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1987,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建筑公司在月度安全检查中，发现3号工地脚手架搭设存在如下问题：①超过24m高的脚手架没有搭设方案，无审批手续；②采用的分段整体提升脚手架未经审查批准；③部分使用的脚手架材料规格不一；④搭设架子的基础多处出现不平整，个别立杆悬空等等。\n\n2.上述安全检查中发现的“超过24m高的脚手架没有搭设方案，无审批手续”不影响脚手架的正常使用和施工，不属于违规行为。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1988,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建筑公司在月度安全检查中，发现3号工地脚手架搭设存在如下问题：①超过24m高的脚手架没有搭设方案，无审批手续；②采用的分段整体提升脚手架未经审查批准；③部分使用的脚手架材料规格不一；④搭设架子的基础多处出现不平整，个别立杆悬空等等。\n\n3.上述安全检查中发现的“个别立杆悬空问题”属于正常现象，在搭设脚手架时是不可避免的。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1989,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某建筑公司在月度安全检查中，发现3号工地脚手架搭设存在如下问题：①超过24m高的脚手架没有搭设方案，无审批手续；②采用的分段整体提升脚手架未经审查批准；③部分使用的脚手架材料规格不一；④搭设架子的基础多处出现不平整，个别立杆悬空等等。\n\n4.依据《建设工程安全生产管理条例》规定，施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，对达到一定规模的危险性较大的(   )等分部分项工程编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施。","options":[{"key":"A","text":"混凝土工程"},{"key":"B","text":"脚手架工程"},{"key":"C","text":"抹灰工程"},{"key":"D","text":"钢筋绑扎工程"}],"answer":"B","basis":"","image":null},{"id":1990,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公司在一工地用吊篮进行外装修作业时，施工员指派一名抹灰工升吊篮，由于吊篮未挂保险钢丝绳，在上升时突然一个倒链急剧下滑，吊篮随即倾斜，由于一作业人员未系安全带，从吊篮坠落死亡。\n\n1.造成这一事故的主要原因之一是作业时吊篮未挂保险钢丝绳和工人未系安全带（   ）。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1991,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公司在一工地用吊篮进行外装修作业时，施工员指派一名抹灰工升吊篮，由于吊篮未挂保险钢丝绳，在上升时突然一个倒链急剧下滑，吊篮随即倾斜，由于一作业人员未系安全带，从吊篮坠落死亡。\n\n2.高处作业吊篮必须设置保险锁。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1992,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公司在一工地用吊篮进行外装修作业时，施工员指派一名抹灰工升吊篮，由于吊篮未挂保险钢丝绳，在上升时突然一个倒链急剧下滑，吊篮随即倾斜，由于一作业人员未系安全带，从吊篮坠落死亡。\n\n3.作业时工人将安全带挂在吊篮升降用的钢丝绳上。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1993,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某公司在一工地用吊篮进行外装修作业时，施工员指派一名抹灰工升吊篮，由于吊篮未挂保险钢丝绳，在上升时突然一个倒链急剧下滑，吊篮随即倾斜，由于一作业人员未系安全带，从吊篮坠落死亡。\n\n4.下列关于施工员布置这项工作的说法正确的是(   )","options":[{"key":"A","text":"事故责任在于设备，与施工员无关"},{"key":"B","text":"可以安排未经培训的抹灰工操作吊篮的升降"},{"key":"C","text":"施工现场的工作布置由施工员安排，没有违章指挥"},{"key":"D","text":"抹灰工对于施工员的违章指挥可以拒绝接受"}],"answer":"D","basis":"","image":null},{"id":1994,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某单位将新招来的一批民工直接派到工地参加人工挖孔桩施工。其中一人挖土深度达到5m时，闻到异样气味，感觉头晕腿软，奋力呼叫地面同伴，由于没有系安全绳，地上的人费尽周折才把下面的人救上来，险些酿成伤亡事故。\n\n1.此事件的违规之处在于，孔下作业人员未系安全绳。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":1995,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某单位将新招来的一批民工直接派到工地参加人工挖孔桩施工。其中一人挖土深度达到5m时，闻到异样气味，感觉头晕腿软，奋力呼叫地面同伴，由于没有系安全绳，地上的人费尽周折才把下面的人救上来，险些酿成伤亡事故。\n\n2.由于没有造成伤亡事故，所以可以认为没有违规。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1996,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某单位将新招来的一批民工直接派到工地参加人工挖孔桩施工。其中一人挖土深度达到5m时，闻到异样气味，感觉头晕腿软，奋力呼叫地面同伴，由于没有系安全绳，地上的人费尽周折才把下面的人救上来，险些酿成伤亡事故。\n\n3.上述事件中，如果没有劳动合同，则即使发生了事故，也不属于施工单位的事故，可不予以上报。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1997,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某单位将新招来的一批民工直接派到工地参加人工挖孔桩施工。其中一人挖土深度达到5m时，闻到异样气味，感觉头晕腿软，奋力呼叫地面同伴，由于没有系安全绳，地上的人费尽周折才把下面的人救上来，险些酿成伤亡事故。\n\n4.下列关于新工人上岗培训的要求正确的是(   )。","options":[{"key":"A","text":"新工人必须进行公司、班组和作业技术的三级安全教育"},{"key":"B","text":"新工人上岗前必须接受规定课时的安全生产教育培训"},{"key":"C","text":"对于不从事危险作业的新工人不必进行安全教育和技术培训"},{"key":"D","text":"从事特种作业的新工人可以直接进行特种作业人员培训，不需要再进行三级安全教育"}],"answer":"B","basis":"","image":null},{"id":1998,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地按施工进度要求正在搭设扣件式脚手架，安全员巡视检查发现新购进的扣件表面粗糙，商标模糊，向架子工询问，工人说有的扣件螺栓滑丝，有的扣件一拧，小盖口就裂了。安全员对此批扣件质量发生怀疑。\n\n1.对于上述情况，安全员不必作相应处理。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":1999,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工地按施工进度要求正在搭设扣件式脚手架，安全员巡视检查发现新购进的扣件表面粗糙，商标模糊，向架子工询问，工人说有的扣件螺栓滑丝，有的扣件一拧，小盖口就裂了。安全员对此批扣件质量发生怀疑。\n\n2.国家对扣件式钢管脚手架使用的扣件实行生产许可证制度。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2000,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某工地按施工进度要求正在搭设扣件式脚手架，安全员巡视检查发现新购进的扣件表面粗糙，商标模糊，向架子工询问，工人说有的扣件螺栓滑丝，有的扣件一拧，小盖口就裂了。安全员对此批扣件质量发生怀疑。\n\n3.为防止安全事故的发生，安全员处理此事，下列方法正确的是（  ）。","options":[{"key":"A","text":"扣件检验不合格，将所有扣件清除出现场，追回已使用的扣件，并向有关负责人报告追查不合格产品的来源"},{"key":"B","text":"告诉工人将坏掉的扣件保留，以便万一发生事故时留作证据"},{"key":"C","text":"把有问题扣件扔掉，好的继续使用"},{"key":"D","text":"保存此批扣件，用于上部脚手架的搭设"}],"answer":"A","basis":"","image":null},{"id":2001,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某工地按施工进度要求正在搭设扣件式脚手架，安全员巡视检查发现新购进的扣件表面粗糙，商标模糊，向架子工询问，工人说有的扣件螺栓滑丝，有的扣件一拧，小盖口就裂了。安全员对此批扣件质量发生怀疑。\n\n4.下列关于脚手架工程的规定正确的是(   )。","options":[{"key":"A","text":"常规的脚手架工程，可以不编制专项施工方案，做好验收即可"},{"key":"B","text":"对脚手架工程所使用的钢管、扣件应检查验收其质量，脚手板、安全网可以不必验收"},{"key":"C","text":"脚手架工程必须编制专项施工方案，并严格按照经审批的方案搭设"},{"key":"D","text":"从事特种作业的架子工因持有特种作业操作证，不必进行入场安全教育"}],"answer":"C","basis":"","image":null},{"id":2002,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线使用二芯绕线，缆线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装在该设备上的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n1.本事故的原因主要是违章操作，移动电器设备未切断电源；操作人员不是专业电工，不能移动电气设备；缺乏日常安全检查，未及时发现事故隐患；可能造成付某触电的漏电原因有电气设备漏电，接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；漏电开关失灵等。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2003,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线使用二芯绕线，缆线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装在该设备上的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n2.特种作业人员必须按照国家有关规定经过专门的安全作业培训，并取得特种作业操作资格证书后，方可上岗作业。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2004,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线使用二芯绕线，缆线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装在该设备上的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n3.下列属于特种作业人员的是(   )。","options":[{"key":"A","text":"电工"},{"key":"B","text":"木工"},{"key":"C","text":"水暖工"},{"key":"D","text":"瓦工"}],"answer":"A","basis":"","image":null},{"id":2005,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某小区十号楼地下室有一电气设备，该设备一次电源线使用二芯绕线，缆线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装在该设备上的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。\n\n4.下列关于特种作业的说法正确的是(   )。","options":[{"key":"A","text":"正确于特种作业人员未经培训考核即从事特种作业并造成重大安全事故，构成犯罪的，对直接责任人员.班组长、特种作业培训人员、项目管理人员和企业主要负责人等全部相关管理人员，依照刑法的有关规定追究刑事责任"},{"key":"B","text":"对特种作业人员专门的安全作业培训，是指由有关主管部门组织的专门针对特种作业人员的培训，也就是特种作业人员在独立上岗作业前，必须进行与本项目相适应的、各工种相互交叉作业时安全技术理论学习和实际操作训练"},{"key":"C","text":"根据《特种作业人员安全技术培训考核管理办法》规定，特种作业是指容易发生人员伤亡事故，对操作者本人、他人及周围设施的安全有重大危害的作业"},{"key":"D","text":"特种作业人员必须是身体健康、无妨碍从事相应工种作业的疾病和生理缺陷，而且具有相应的特种作业培训合格证书和中级以上职称的人员"}],"answer":"C","basis":"","image":null},{"id":2006,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工程公司在一大厦广场基础工程进行护坡桩锚杆作业。当天工地主要负责人、安全员、电工等有关领导及管理人员都去别的地方而不在现场。工地施工分成一、二两组，班组长秦某请假，临时委托张某代替自己的工作，张某在二组指挥下锚杆筋笼，一组无人指挥，长22m，由3根Φ25螺纹钢的钢筋笼由13名民工自行进行作业，民工在下锚杆时，因钢筋笼将配电箱引出的380V电缆线磨破，使钢筋笼带电，造成5个触电，经医院抢救，其中3人脱险，另两人因光脚未穿鞋，经抢救无效死亡。\n\n1.这起事故中造成触电伤害原因之一是民工违章作业。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2007,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某工程公司在一大厦广场基础工程进行护坡桩锚杆作业。当天工地主要负责人、安全员、电工等有关领导及管理人员都去别的地方而不在现场。工地施工分成一、二两组，班组长秦某请假，临时委托张某代替自己的工作，张某在二组指挥下锚杆筋笼，一组无人指挥，长22m，由3根Φ25螺纹钢的钢筋笼由13名民工自行进行作业，民工在下锚杆时，因钢筋笼将配电箱引出的380V电缆线磨破，使钢筋笼带电，造成5个触电，经医院抢救，其中3人脱险，另两人因光脚未穿鞋，经抢救无效死亡。\n\n2.这起事故中，操作人员没有违规操作的行为。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2008,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某工程公司在一大厦广场基础工程进行护坡桩锚杆作业。当天工地主要负责人、安全员、电工等有关领导及管理人员都去别的地方而不在现场。工地施工分成一、二两组，班组长秦某请假，临时委托张某代替自己的工作，张某在二组指挥下锚杆筋笼，一组无人指挥，长22m，由3根Φ25螺纹钢的钢筋笼由13名民工自行进行作业，民工在下锚杆时，因钢筋笼将配电箱引出的380V电缆线磨破，使钢筋笼带电，造成5个触电，经医院抢救，其中3人脱险，另两人因光脚未穿鞋，经抢救无效死亡。\n\n3.这起事故直接原因的是(   )。","options":[{"key":"A","text":"由13名民工进行作业，人员过多"},{"key":"B","text":"工地主要负责人不在现场"},{"key":"C","text":"班组长秦某请假"},{"key":"D","text":"380V电缆线磨破漏电"}],"answer":"D","basis":"","image":null},{"id":2009,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某工程公司在一大厦广场基础工程进行护坡桩锚杆作业。当天工地主要负责人、安全员、电工等有关领导及管理人员都去别的地方而不在现场。工地施工分成一、二两组，班组长秦某请假，临时委托张某代替自己的工作，张某在二组指挥下锚杆筋笼，一组无人指挥，长22m，由3根Φ25螺纹钢的钢筋笼由13名民工自行进行作业，民工在下锚杆时，因钢筋笼将配电箱引出的380V电缆线磨破，使钢筋笼带电，造成5个触电，经医院抢救，其中3人脱险，另两人因光脚未穿鞋，经抢救无效死亡。\n\n4.下列对于三类人员的安全管理职责的说法正确的是(   )。","options":[{"key":"A","text":"施工单位主要负责人依法对本单位参与施工的所有项目的安全生产工作负主要责任"},{"key":"B","text":"施工单位的项目负责人对本单位参与施工的建设工程项目的安全负全部责任"},{"key":"C","text":"现场安全生产管理人员负责对安全生产进行现场监督检查"},{"key":"D","text":"专职安全生产管理人员对违章指挥、违章操作的，应当立即报告，并可以越级上报，但无权制止施工单位的行为"}],"answer":"C","basis":"","image":null},{"id":2010,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公司在一工地用吊篮架进行外装修作业时，首层安全网已经拆除，施工员指派一名抹灰工升降吊篮，在用倒链升降时，未挂保险钢丝绳，突然一个倒链急剧下滑，吊篮随即倾斜，使一名工人从吊篮上摔下死亡。\n\n1.“违章操作，作业时未挂安全绳，工人未系安全带”属于造成这一事故发生的不安全因素之—。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2011,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公司在一工地用吊篮架进行外装修作业时，首层安全网已经拆除，施工员指派一名抹灰工升降吊篮，在用倒链升降时，未挂保险钢丝绳，突然一个倒链急剧下滑，吊篮随即倾斜，使一名工人从吊篮上摔下死亡。\n\n2.上述事故中，“用吊篮架进行外装修作业时，首层安全网拆除”的做法是错误的，属于违章作业。（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2012,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某公司在一工地用吊篮架进行外装修作业时，首层安全网已经拆除，施工员指派一名抹灰工升降吊篮，在用倒链升降时，未挂保险钢丝绳，突然一个倒链急剧下滑，吊篮随即倾斜，使一名工人从吊篮上摔下死亡。\n\n3.下列关于本事故的说法错误的是(   )。","options":[{"key":"A","text":"施工员违章指挥，不应指派抹灰工进行操作"},{"key":"B","text":"项目负责人没有亲自指挥"},{"key":"C","text":"作业时没有对升降装置进行认真检查，设备带“病”作业"},{"key":"D","text":"违反高处作业规定，支设的水平安全网在高处作业未完成时被拆除"}],"answer":"B","basis":"","image":null},{"id":2013,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某公司在一工地用吊篮架进行外装修作业时，首层安全网已经拆除，施工员指派一名抹灰工升降吊篮，在用倒链升降时，未挂保险钢丝绳，突然一个倒链急剧下滑，吊篮随即倾斜，使一名工人从吊篮上摔下死亡。\n\n4.下列关于施工员布置这项工作的说法正确的是(   )。","options":[{"key":"A","text":"事故责任在于设备，与施工员无关"},{"key":"B","text":"对于临时安排抹灰工操作一下升降吊篮没有什么，是施工员统筹考虑现场实际的正确工作布置"},{"key":"C","text":"施工现场的工作布置由施工员安排，没有违章指挥"},{"key":"D","text":"抹灰工对于施工员布置的明显有较大危险而且没有防护设施的工作可以不接受"}],"answer":"D","basis":"","image":null},{"id":2014,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工队在某单位租借一间平房，承揽装修工程，由原来仅加工的木工活，要再增加做铝合金和塑钢门窗加工，没有正式电工。房间里要重新布置一下，原有一单相小电气设备(多功能木工机械)要移位，该设备的一次电源线是使用软电缆线沿墙边明设在水泥地面上的。缆线绝缘层已有磨损，电缆线裸露，接头处也没有用绝缘胶布包好，安装在该设备上的漏电开关也已失灵。在移动过程中田某等两名触电死亡，学徒工看见后又用手直接去拉田某也被电死。\n\n1.田某等人触电死亡的主要原因有：违章操作，移动电气设备必须经电工切断电源，并做妥善处理后进行；破损电缆线未及时更换，不符合安全用电要求；非专业电工移动了电气设备；漏电开关失灵，不起安全保护作用；缺乏日常安全教育和检查，未及时发现事故隐患等。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2015,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工队在某单位租借一间平房，承揽装修工程，由原来仅加工的木工活，要再增加做铝合金和塑钢门窗加工，没有正式电工。房间里要重新布置一下，原有一单相小电气设备(多功能木工机械)要移位，该设备的一次电源线是使用软电缆线沿墙边明设在水泥地面上的。缆线绝缘层已有磨损，电缆线裸露，接头处也没有用绝缘胶布包好，安装在该设备上的漏电开关也已失灵。在移动过程中田某等两名触电死亡，学徒工看见后又用手直接去拉田某也被电死。\n\n2.上述事故中，只有最后的学徒工的做法是错误的，其前两名人员的死亡属于意外，很难控制。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2016,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某施工队在某单位租借一间平房，承揽装修工程，由原来仅加工的木工活，要再增加做铝合金和塑钢门窗加工，没有正式电工。房间里要重新布置一下，原有一单相小电气设备(多功能木工机械)要移位，该设备的一次电源线是使用软电缆线沿墙边明设在水泥地面上的。缆线绝缘层已有磨损，电缆线裸露，接头处也没有用绝缘胶布包好，安装在该设备上的漏电开关也已失灵。在移动过程中田某等两名触电死亡，学徒工看见后又用手直接去拉田某也被电死。\n\n3.下列关于电工的说法正确的是(   )","options":[{"key":"A","text":"电工不属于特种作业人员范围"},{"key":"B","text":"电工不需要特别的培训，只要懂得电工作原理的人就可以在施工现场操作用电"},{"key":"C","text":"电工需要按照特种作业人员的培训和考核要求进行培训和考核合格后才可上岗"},{"key":"D","text":"对于投资100万元以下的的建设项目，可以不需要电工"}],"answer":"C","basis":"","image":null},{"id":2017,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某施工队在某单位租借一间平房，承揽装修工程，由原来仅加工的木工活，要再增加做铝合金和塑钢门窗加工，没有正式电工。房间里要重新布置一下，原有一单相小电气设备(多功能木工机械)要移位，该设备的一次电源线是使用软电缆线沿墙边明设在水泥地面上的。缆线绝缘层已有磨损，电缆线裸露，接头处也没有用绝缘胶布包好，安装在该设备上的漏电开关也已失灵。在移动过程中田某等两名触电死亡，学徒工看见后又用手直接去拉田某也被电死。\n\n4.对于本案例中造成3人死亡的事故，下列说法正确的是(   )。","options":[{"key":"A","text":"本案例事故发生在自己公司工作场地修缮作业过程中，不属于对外承揽项目施工过程中发生的事故，不应按照事故报告程序上报，自行处理即可"},{"key":"B","text":"本案例事故发生在自己公司工作场地修缮作业过程中，不属于工伤保险范围之内"},{"key":"C","text":"本案例事故属于较大事故，应立即上报"},{"key":"D","text":"本案例的事故由于是在租赁的房间内由于电缆线布置不当及裸露的原因而引发的事故，事故责任在于房屋出租方"}],"answer":"C","basis":"","image":null},{"id":2018,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建筑公司，为了安排下岗职工就业，在集镇路边30m2房间内，开了一个电气焊修理门市部。为了节约资金，焊机用的是已停用一年的旧机，一次测电源用的是闸刀开关，并安装在室内，门口路边就是焊接与切割场所。室内既是焊切工具、氧气瓶、乙炔瓶的储存间，又是工人中午吃饭休息的场所。公司对工人只进行了短期培训，便开业。\n\n1.该电气焊修理门市部的安全隐患有：工人生活及其所用设备、工具均在同一狭小的室内；在30㎡有闸刀开关的室内，不应存放氧气瓶及乙炔瓶；作业人员无证上岗；焊机各项性能指标未经检验；氧气瓶与乙炔瓶不能混放等。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2019,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某建筑公司，为了安排下岗职工就业，在集镇路边30m2房间内，开了一个电气焊修理门市部。为了节约资金，焊机用的是已停用一年的旧机，一次测电源用的是闸刀开关，并安装在室内，门口路边就是焊接与切割场所。室内既是焊切工具、氧气瓶、乙炔瓶的储存间，又是工人中午吃饭休息的场所。公司对工人只进行了短期培训，便开业。\n\n2.上述施工企业的是为了安排下岗职工就业的行为，公司对职工的培训可以不和其他职工的培训一样，不受限制。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2020,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某建筑公司，为了安排下岗职工就业，在集镇路边30m2房间内，开了一个电气焊修理门市部。为了节约资金，焊机用的是已停用一年的旧机，一次测电源用的是闸刀开关，并安装在室内，门口路边就是焊接与切割场所。室内既是焊切工具、氧气瓶、乙炔瓶的储存间，又是工人中午吃饭休息的场所。公司对工人只进行了短期培训，便开业。\n\n3.下列关于焊机的说法正确的是(   )。","options":[{"key":"A","text":"焊机属于小型工具，使用时没有危险"},{"key":"B","text":"焊机属于电气设备，停用一段时间后可以继续使用，不需要重新进行检测"},{"key":"C","text":"焊机操作人员没有特殊要求"},{"key":"D","text":"焊机操作人员需要持证上岗"}],"answer":"D","basis":"","image":null},{"id":2021,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某建筑公司，为了安排下岗职工就业，在集镇路边30m2房间内，开了一个电气焊修理门市部。为了节约资金，焊机用的是已停用一年的旧机，一次测电源用的是闸刀开关，并安装在室内，门口路边就是焊接与切割场所。室内既是焊切工具、氧气瓶、乙炔瓶的储存间，又是工人中午吃饭休息的场所。公司对工人只进行了短期培训，便开业。\n\n4.下列关于焊机的说法正确的是(   )。","options":[{"key":"A","text":"焊工不属于特种作业人员"},{"key":"B","text":"该案例中对焊工的培训是合格的"},{"key":"C","text":"焊工的上岗条件没有特殊要求"},{"key":"D","text":"焊工应该按照《特种作业人员安全技术培训考核管理办法》的要求进行培训"}],"answer":"D","basis":"","image":null},{"id":2022,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某业主将一栋大型剧院建筑的拆除任务，发包给没有拆除资质的防腐保温劳务公司，由于不了解拆除作业的危险性，操作人员决定先拆混凝土梁，后拆混凝土板。操作时，现场也无安全人员在场，无安全措施；在梁拆至一半时全部楼板塌下，造成多人死亡。事后检查该施工方法无方案、无交底，公司也没有施工方案管理制度。\n\n1.此事故发生的原因之一是：拆除作业发包给无相应资质的施工单位施工。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2023,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某业主将一栋大型剧院建筑的拆除任务，发包给没有拆除资质的防腐保温劳务公司，由于不了解拆除作业的危险性，操作人员决定先拆混凝土梁，后拆混凝土板。操作时，现场也无安全人员在场，无安全措施；在梁拆至一半时全部楼板塌下，造成多人死亡。事后检查该施工方法无方案、无交底，公司也没有施工方案管理制度。\n\n2.先拆梁后拆板是事故发生的原因之一。(   )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2024,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某业主将一栋大型剧院建筑的拆除任务，发包给没有拆除资质的防腐保温劳务公司，由于不了解拆除作业的危险性，操作人员决定先拆混凝土梁，后拆混凝土板。操作时，现场也无安全人员在场，无安全措施；在梁拆至一半时全部楼板塌下，造成多人死亡。事后检查该施工方法无方案、无交底，公司也没有施工方案管理制度。\n\n3.拆除作业的施工方案应先交安全员，由安全员批准后，方可施工。(   )","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2025,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某业主将一栋大型剧院建筑的拆除任务，发包给没有拆除资质的防腐保温劳务公司，由于不了解拆除作业的危险性，操作人员决定先拆混凝土梁，后拆混凝土板。操作时，现场也无安全人员在场，无安全措施；在梁拆至一半时全部楼板塌下，造成多人死亡。事后检查该施工方法无方案、无交底，公司也没有施工方案管理制度。\n\n4.大型拆除作业必须编制施工方案，必要情况下应当组织专家进行论证。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2026,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某医院工程北配楼正在进行装修施工，电焊工张某在地上一层焊接水暖支架时，焊渣跌落至地下一层，引燃了堆放在地下一层的聚苯乙烯保温材料，从而引发大火。\n\n1.我国消防工作的方针是（  ）。","options":[{"key":"A","text":"以防为主，防治结合"},{"key":"B","text":"预防为主，防消结合"},{"key":"C","text":"安全第一，预防为主"},{"key":"D","text":"预防为主，综合治理"}],"answer":"B","basis":"","image":null},{"id":2027,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某医院工程北配楼正在进行装修施工，电焊工张某在地上一层焊接水暖支架时，焊渣跌落至地下一层，引燃了堆放在地下一层的聚苯乙烯保温材料，从而引发大火。\n\n2.施工现场内贮存易燃易爆危险品的仓库、库区，属于（  ）动火区域。","options":[{"key":"A","text":"一级"},{"key":"B","text":"二级"},{"key":"C","text":"三级"},{"key":"D","text":"四级"}],"answer":"A","basis":"","image":null},{"id":2028,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某医院工程北配楼正在进行装修施工，电焊工张某在地上一层焊接水暖支架时，焊渣跌落至地下一层，引燃了堆放在地下一层的聚苯乙烯保温材料，从而引发大火。\n\n3.在施工现场禁火区域内动火，作业前必须申请办理动火证，动火证不需要注明（  ）。","options":[{"key":"A","text":"动火地点"},{"key":"B","text":"动火时间"},{"key":"C","text":"动火人"},{"key":"D","text":"动火成本"}],"answer":"D","basis":"","image":null},{"id":2029,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某医院工程北配楼正在进行装修施工，电焊工张某在地上一层焊接水暖支架时，焊渣跌落至地下一层，引燃了堆放在地下一层的聚苯乙烯保温材料，从而引发大火。\n\n4.电焊工张某违规操作是引起本起事故的主要原因。（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2030,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年5月某造价5600万的市政工地钢筋工周某用交电机接钢筋，在梳理电焊线过程中触碰焊把钳发生触电，经工友送医院救治无效死亡。事后调查发现该项目无持证电工，电焊机是周某自行从圆盘锯的专用开关箱接线，事故发生时项目部管理人员均不在场，项目部配备了2名专职安全员但投标文件不一致且未办理变更手续，其中一名为大三学生实习。\n\n1.按照该项目类别及规模应至少配备（  ）名专职安全员。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"B","basis":"","image":null},{"id":2031,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年5月某造价5600万的市政工地钢筋工周某用交电机接钢筋，在梳理电焊线过程中触碰焊把钳发生触电，经工友送医院救治无效死亡。事后调查发现该项目无持证电工，电焊机是周某自行从圆盘锯的专用开关箱接线，事故发生时项目部管理人员均不在场，项目部配备了2名专职安全员但投标文件不一致且未办理变更手续，其中一名为大三学生实习。\n\n2.该事故发生的直接原因为（  ）。","options":[{"key":"A","text":"现场无专职电工"},{"key":"B","text":"发生事故时项目部管理人员不在岗"},{"key":"C","text":"项目专职安全员配备不足"},{"key":"D","text":"周某触碰焊把钳且电焊机未接专用开关箱"}],"answer":"D","basis":"","image":null},{"id":2032,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年5月某造价5600万的市政工地钢筋工周某用交电机接钢筋，在梳理电焊线过程中触碰焊把钳发生触电，经工友送医院救治无效死亡。事后调查发现该项目无持证电工，电焊机是周某自行从圆盘锯的专用开关箱接线，事故发生时项目部管理人员均不在场，项目部配备了2名专职安全员但投标文件不一致且未办理变更手续，其中一名为大三学生实习。\n\n3.下面不属于违章作业的有（  ）。","options":[{"key":"A","text":"周某用交流电焊机焊接钢筋"},{"key":"B","text":"周某从开关箱接电焊机"},{"key":"C","text":"项目部接受大三学生现场实习"},{"key":"D","text":"项目专职安全员未办理变更手续"}],"answer":"C","basis":"","image":null},{"id":2033,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年5月某造价5600万的市政工地钢筋工周某用交电机接钢筋，在梳理电焊线过程中触碰焊把钳发生触电，经工友送医院救治无效死亡。事后调查发现该项目无持证电工，电焊机是周某自行从圆盘锯的专用开关箱接线，事故发生时项目部管理人员均不在场，项目部配备了2名专职安全员但投标文件不一致且未办理变更手续，其中一名为大三学生实习。\n\n4.该事故中若电焊机采用电焊机专用开关箱可避免本次事故发生。（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2034,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年1月16日，某下水道工程施工现场发生一起沟槽坍塌事故，造成4人死亡、3人受伤，直接经济损失96.46万元。事发当日，该施工人员正在进行下水道沟槽挖土施工时(沟底深度4～4.5m)，沟壁突然坍塌，1人被埋。正在附近作业的13名马上围到事发地点扒土抢救被埋者。数分钟后沟壁发生二次坍塌，将参与抢救的6人掩埋。\n\n1.按照事故严重程度属于（  ）","options":[{"key":"A","text":"一般事故"},{"key":"B","text":"较大事故"},{"key":"C","text":"重大事故"},{"key":"D","text":"特别重大事故"}],"answer":"B","basis":"","image":null},{"id":2035,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年1月16日，某下水道工程施工现场发生一起沟槽坍塌事故，造成4人死亡、3人受伤，直接经济损失96.46万元。事发当日，该施工人员正在进行下水道沟槽挖土施工时(沟底深度4～4.5m)，沟壁突然坍塌，1人被埋。正在附近作业的13名马上围到事发地点扒土抢救被埋者。数分钟后沟壁发生二次坍塌，将参与抢救的6人掩埋。\n\n2.生产经营单位的主要负责人未履行本法规定的安全生产管理职责，导致生产安全事故的，由安全生产监督管理部门依照下列规定处以罚款:发生重大事故的，处上一年年收入（  ）的罚款。","options":[{"key":"A","text":"0.6"},{"key":"B","text":"0.7"},{"key":"C","text":"0.8"},{"key":"D","text":"0.9"}],"answer":"C","basis":"","image":null},{"id":2036,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年1月16日，某下水道工程施工现场发生一起沟槽坍塌事故，造成4人死亡、3人受伤，直接经济损失96.46万元。事发当日，该施工人员正在进行下水道沟槽挖土施工时(沟底深度4～4.5m)，沟壁突然坍塌，1人被埋。正在附近作业的13名马上围到事发地点扒土抢救被埋者。数分钟后沟壁发生二次坍塌，将参与抢救的6人掩埋。\n\n3.安全色是传递安全信息含义的颜色，不包括（  ）颜色","options":[{"key":"A","text":"红"},{"key":"B","text":"蓝"},{"key":"C","text":"黄"},{"key":"D","text":"白"}],"answer":"D","basis":"","image":null},{"id":2037,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年1月16日，某下水道工程施工现场发生一起沟槽坍塌事故，造成4人死亡、3人受伤，直接经济损失96.46万元。事发当日，该施工人员正在进行下水道沟槽挖土施工时(沟底深度4～4.5m)，沟壁突然坍塌，1人被埋。正在附近作业的13名马上围到事发地点扒土抢救被埋者。数分钟后沟壁发生二次坍塌，将参与抢救的6人掩埋。\n\n4.三级安全教育是每个刚进企业的新工人必须接受的首次安全生产方面的基本教育，三安全教育是指公司 (即企业)、项目 (或工程处、施工处、工区)、班组这三级。（  ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2038,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年12月27日7时30分许，位于XX路的“上海城”工程施工电梯(荷载9人)在运送施工人员时发生坠落，造成18人死亡、1人重伤。12月26日16时许，高某对施工电梯进行加节安装，同日21时许完成。经安全监察部门鉴定，电梯标准节的螺栓没有按要求安装是导致本次事故的直接原因，而未按要求安装附着及增加附着后未按规定验收合格就投入使用是导致本次事故的次要原因。\n\n1.安装人员无执业资格证书，是本次事故发生的直接原因。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2039,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年12月27日7时30分许，位于XX路的“上海城”工程施工电梯(荷载9人)在运送施工人员时发生坠落，造成18人死亡、1人重伤。12月26日16时许，高某对施工电梯进行加节安装，同日21时许完成。经安全监察部门鉴定，电梯标准节的螺栓没有按要求安装是导致本次事故的直接原因，而未按要求安装附着及增加附着后未按规定验收合格就投入使用是导致本次事故的次要原因。\n\n2.项目部也未安排安全员进行现场安全管理，表明管理松懈。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2040,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年12月27日7时30分许，位于XX路的“上海城”工程施工电梯(荷载9人)在运送施工人员时发生坠落，造成18人死亡、1人重伤。12月26日16时许，高某对施工电梯进行加节安装，同日21时许完成。经安全监察部门鉴定，电梯标准节的螺栓没有按要求安装是导致本次事故的直接原因，而未按要求安装附着及增加附着后未按规定验收合格就投入使用是导致本次事故的次要原因。\n\n3.监理人汤某未履行旁站监督职责，未对该栋楼的施工电梯及其使用、运行进行检查，应承担相应的法律责任是（   ）。","options":[{"key":"A","text":"民事责任"},{"key":"B","text":"刑事责任"},{"key":"C","text":"行政责任"},{"key":"D","text":"经济责任"}],"answer":"C","basis":"","image":null},{"id":2041,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年12月27日7时30分许，位于XX路的“上海城”工程施工电梯(荷载9人)在运送施工人员时发生坠落，造成18人死亡、1人重伤。12月26日16时许，高某对施工电梯进行加节安装，同日21时许完成。经安全监察部门鉴定，电梯标准节的螺栓没有按要求安装是导致本次事故的直接原因，而未按要求安装附着及增加附着后未按规定验收合格就投入使用是导致本次事故的次要原因。\n\n4.升降机上乘坐的工人远远超载是事故发生的（   ）","options":[{"key":"A","text":"直接原因"},{"key":"B","text":"间接原因"},{"key":"C","text":"次要原因"},{"key":"D","text":"重要原因"}],"answer":"A","basis":"","image":null},{"id":2042,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公路桥梁工程，总包方A公司将钢梁安装工程分包给 B安装公司。总包方A公司制了钢梁吊装方案并得到监理工程师的批准。由于工期紧，人员紧缺，B公司将刚从市场招聘的李某与高某经简单内部培训组成吊装组。根据施工进度计划安排，XX年X月XX日应进行吊装，但该日清晨雾很浓，能见度较低，吊装组就位，准备对组装完成的钢梁实施吊装作业。总包现场监管人员得知此事，通过手机极力劝阻。为了赶工，分包方无视劝阻，对吊装组仅作简单交底后，由李某将钢丝绳套于边棱锋利的钢梁上。钢丝绳固定完毕，李某随即指挥吊车司机高某，将钢梁吊离地面实施了第一吊。钢梁在 18m高处因突然断绳而坠落，击中正在下方行走的两位工人，致使两位工人当场死亡。事后查明钢丝绳存在断丝超标和严重渗油现象。\n\n1.依据《生产安全事故报告和调查处理条例》关于生产安全事故等级的划分，本次事故属于一般事故（   ）。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2043,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公路桥梁工程，总包方A公司将钢梁安装工程分包给 B安装公司。总包方A公司制了钢梁吊装方案并得到监理工程师的批准。由于工期紧，人员紧缺，B公司将刚从市场招聘的李某与高某经简单内部培训组成吊装组。根据施工进度计划安排，XX年X月XX日应进行吊装，但该日清晨雾很浓，能见度较低，吊装组就位，准备对组装完成的钢梁实施吊装作业。总包现场监管人员得知此事，通过手机极力劝阻。为了赶工，分包方无视劝阻，对吊装组仅作简单交底后，由李某将钢丝绳套于边棱锋利的钢梁上。钢丝绳固定完毕，李某随即指挥吊车司机高某，将钢梁吊离地面实施了第一吊。钢梁在 18m高处因突然断绳而坠落，击中正在下方行走的两位工人，致使两位工人当场死亡。事后查明钢丝绳存在断丝超标和严重渗油现象。\n\n2.依据《建筑施工起重吊装安全技术规范》，恶劣天气后吊装作业应及时清理冰雪并应采取防漏电措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2044,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n某公路桥梁工程，总包方A公司将钢梁安装工程分包给 B安装公司。总包方A公司制了钢梁吊装方案并得到监理工程师的批准。由于工期紧，人员紧缺，B公司将刚从市场招聘的李某与高某经简单内部培训组成吊装组。根据施工进度计划安排，XX年X月XX日应进行吊装，但该日清晨雾很浓，能见度较低，吊装组就位，准备对组装完成的钢梁实施吊装作业。总包现场监管人员得知此事，通过手机极力劝阻。为了赶工，分包方无视劝阻，对吊装组仅作简单交底后，由李某将钢丝绳套于边棱锋利的钢梁上。钢丝绳固定完毕，李某随即指挥吊车司机高某，将钢梁吊离地面实施了第一吊。钢梁在 18m高处因突然断绳而坠落，击中正在下方行走的两位工人，致使两位工人当场死亡。事后查明钢丝绳存在断丝超标和严重渗油现象。\n\n3.分析事故发生经过，不属于本次事故的原因主要的是（   ）。","options":[{"key":"A","text":"初次第一吊，对钢梁未作试吊；在有大雾、光线不清的情况下，进行吊装作业"},{"key":"B","text":"总包方A公司将钢梁安装工程分包给B安装公司"},{"key":"C","text":"高某违章作业；李某违章作业，违章指挥"},{"key":"D","text":"两位工人在吊装区行走"}],"answer":"B","basis":"","image":null},{"id":2045,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某公路桥梁工程，总包方A公司将钢梁安装工程分包给 B安装公司。总包方A公司制了钢梁吊装方案并得到监理工程师的批准。由于工期紧，人员紧缺，B公司将刚从市场招聘的李某与高某经简单内部培训组成吊装组。根据施工进度计划安排，XX年X月XX日应进行吊装，但该日清晨雾很浓，能见度较低，吊装组就位，准备对组装完成的钢梁实施吊装作业。总包现场监管人员得知此事，通过手机极力劝阻。为了赶工，分包方无视劝阻，对吊装组仅作简单交底后，由李某将钢丝绳套于边棱锋利的钢梁上。钢丝绳固定完毕，李某随即指挥吊车司机高某，将钢梁吊离地面实施了第一吊。钢梁在 18m高处因突然断绳而坠落，击中正在下方行走的两位工人，致使两位工人当场死亡。事后查明钢丝绳存在断丝超标和严重渗油现象。\n\n4.针对钢丝绳存在断丝超标和严重渗油现象这一隐患，项目部应及时检查维修和保养，截断钢丝绳破损部分，进行接长处理。判断这一分析是否正确?（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2046,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年5月10日，某公路工程处第三项目部在某立交桥施工期间，对立交桥作业区域内原有厂房拆除工程施工中，发生了一起因被拆除的建筑物坍塌导致2人死亡的事故。某建设单位委托第三项目部进行2000㎡厂房拆除工程的施工，厂房是砖混结构的两层楼房，要求 6月底前拆完，合同工期4个月，条件是第三项目部向建设单位上交3万元，拆除下来的钢筋由第三项目经理部支配。项目部又将此项工程分包给了M民工队，条件是以拆除下来的钢筋作为支付M的拆除施工的工程款，并于2月20日签订了合同书。拆除工程施工前，建设单位未向建设行政主管部门申报，也未给项目部提供厂房图纸等技术资料项目部要求民工队3月1日开工，民工队为了能以最小的投入获取最大的收益(旧钢筋)，未支搭拆除工程施工脚手架，而是站在被拆除厂房的楼板上，用铁锤进行作业。5月10日，厂房只剩最后一间约16㎡的休息室时，民工L、H和C站在休息室天花板(即二楼地板，二楼已被拆除)上，继续用铁锤锤击天花板。同日下午16:45左右，房屋中心部位的天花板水泥已基本脱落，民工L、H和C仍用铁锤捶击暴露出来的钢筋，致使天花板呈V字形折弯，继而拉倒两侧墙壁，C及时跳下逃生，L和H被迅速缩口的天花板V字折弯包夹。L在送往医院途中死亡，H在经医院抢救1小时后死亡。\n\n1.作业人员站在被拆除建筑物上进行拆除作业，违反了拆除工程施工操作规程，是导致此次事故发生的直接原因。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2047,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年5月10日，某公路工程处第三项目部在某立交桥施工期间，对立交桥作业区域内原有厂房拆除工程施工中，发生了一起因被拆除的建筑物坍塌导致2人死亡的事故。某建设单位委托第三项目部进行2000㎡厂房拆除工程的施工，厂房是砖混结构的两层楼房，要求 6月底前拆完，合同工期4个月，条件是第三项目部向建设单位上交3万元，拆除下来的钢筋由第三项目经理部支配。项目部又将此项工程分包给了M民工队，条件是以拆除下来的钢筋作为支付M的拆除施工的工程款，并于2月20日签订了合同书。拆除工程施工前，建设单位未向建设行政主管部门申报，也未给项目部提供厂房图纸等技术资料项目部要求民工队3月1日开工，民工队为了能以最小的投入获取最大的收益(旧钢筋)，未支搭拆除工程施工脚手架，而是站在被拆除厂房的楼板上，用铁锤进行作业。5月10日，厂房只剩最后一间约16㎡的休息室时，民工L、H和C站在休息室天花板(即二楼地板，二楼已被拆除)上，继续用铁锤锤击天花板。同日下午16:45左右，房屋中心部位的天花板水泥已基本脱落，民工L、H和C仍用铁锤捶击暴露出来的钢筋，致使天花板呈V字形折弯，继而拉倒两侧墙壁，C及时跳下逃生，L和H被迅速缩口的天花板V字折弯包夹。L在送往医院途中死亡，H在经医院抢救1小时后死亡。\n\n2.建设单位在拆除工程施工前，应向建设行政主管部门报送材料和备案。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2048,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年5月10日，某公路工程处第三项目部在某立交桥施工期间，对立交桥作业区域内原有厂房拆除工程施工中，发生了一起因被拆除的建筑物坍塌导致2人死亡的事故。某建设单位委托第三项目部进行2000㎡厂房拆除工程的施工，厂房是砖混结构的两层楼房，要求 6月底前拆完，合同工期4个月，条件是第三项目部向建设单位上交3万元，拆除下来的钢筋由第三项目经理部支配。项目部又将此项工程分包给了M民工队，条件是以拆除下来的钢筋作为支付M的拆除施工的工程款，并于2月20日签订了合同书。拆除工程施工前，建设单位未向建设行政主管部门申报，也未给项目部提供厂房图纸等技术资料项目部要求民工队3月1日开工，民工队为了能以最小的投入获取最大的收益(旧钢筋)，未支搭拆除工程施工脚手架，而是站在被拆除厂房的楼板上，用铁锤进行作业。5月10日，厂房只剩最后一间约16㎡的休息室时，民工L、H和C站在休息室天花板(即二楼地板，二楼已被拆除)上，继续用铁锤锤击天花板。同日下午16:45左右，房屋中心部位的天花板水泥已基本脱落，民工L、H和C仍用铁锤捶击暴露出来的钢筋，致使天花板呈V字形折弯，继而拉倒两侧墙壁，C及时跳下逃生，L和H被迅速缩口的天花板V字折弯包夹。L在送往医院途中死亡，H在经医院抢救1小时后死亡。\n\n3.原有厂房拆除工程施工时，拆除现场应设置围挡、警示标志，并应采用（   ）。","options":[{"key":"A","text":"装载机推倒厂房"},{"key":"B","text":"推机推倒施工"},{"key":"C","text":"吊车配合施工"},{"key":"D","text":"支搭脚手架施工"}],"answer":"D","basis":"","image":null},{"id":2049,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年5月10日，某公路工程处第三项目部在某立交桥施工期间，对立交桥作业区域内原有厂房拆除工程施工中，发生了一起因被拆除的建筑物坍塌导致2人死亡的事故。某建设单位委托第三项目部进行2000㎡厂房拆除工程的施工，厂房是砖混结构的两层楼房，要求 6月底前拆完，合同工期4个月，条件是第三项目部向建设单位上交3万元，拆除下来的钢筋由第三项目经理部支配。项目部又将此项工程分包给了M民工队，条件是以拆除下来的钢筋作为支付M的拆除施工的工程款，并于2月20日签订了合同书。拆除工程施工前，建设单位未向建设行政主管部门申报，也未给项目部提供厂房图纸等技术资料项目部要求民工队3月1日开工，民工队为了能以最小的投入获取最大的收益(旧钢筋)，未支搭拆除工程施工脚手架，而是站在被拆除厂房的楼板上，用铁锤进行作业。5月10日，厂房只剩最后一间约16㎡的休息室时，民工L、H和C站在休息室天花板(即二楼地板，二楼已被拆除)上，继续用铁锤锤击天花板。同日下午16:45左右，房屋中心部位的天花板水泥已基本脱落，民工L、H和C仍用铁锤捶击暴露出来的钢筋，致使天花板呈V字形折弯，继而拉倒两侧墙壁，C及时跳下逃生，L和H被迅速缩口的天花板V字折弯包夹。L在送往医院途中死亡，H在经医院抢救1小时后死亡。\n\n4.该厂房拆除工程施工的正确方法是（   ）。","options":[{"key":"A","text":"从左至右、逐层、分段实施"},{"key":"B","text":"从左至右、立体交叉作业"},{"key":"C","text":"从上至下、逐层、分段实施"},{"key":"D","text":"从上至下、立体交叉作业"}],"answer":"C","basis":"","image":null},{"id":2050,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工队在城市一条街道旁的一个旅馆工地拆除钢管脚手架。钢管紧靠建筑物，临街面架设有10kV的高压线，离建筑物只有2m，由于街道狭窄，暂无法解决距离过近的问题。而由于某些原因又不能切断对高压线的供电。由于上午下过雨，下午墙上仍比较湿。虽然上午安全员向施工工人讲过操作方式，要求立杆不要往上拉，应该向下放，但下午上班后在工地二楼屋面“女儿墙”内继续工作的泥工马X和普工刘X仍在屋顶上往上拉已拆除的一根钢管脚手架立杆。向上拉开一段距离后，马X、刘X以墙楼为支点，将管子压成斜向，欲将管子斜拉后置于屋顶上。由于斜度过大，钢管临街一端触及高压线，当时墙上比较湿，钢管与墙棱交点处发出火花，马X的胸口靠近管子烧弯处，身上穿着化纤衣服，当即燃烧起来，身体被烧伤。刘X手触管子，手指也被烧伤。楼下工友及时跑上楼将火扑灭，将受伤者送至医院。马X烧伤面积达50%，由于呼吸循环衰竭，抢救无效，于2月20日晚12时死于医院。刘X烧伤面积达15%，三根手指残疾。\n\n1.本案中，物的不安全状态是设计不良，即高压线距建筑物过近。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2051,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工队在城市一条街道旁的一个旅馆工地拆除钢管脚手架。钢管紧靠建筑物，临街面架设有10kV的高压线，离建筑物只有2m，由于街道狭窄，暂无法解决距离过近的问题。而由于某些原因又不能切断对高压线的供电。由于上午下过雨，下午墙上仍比较湿。虽然上午安全员向施工工人讲过操作方式，要求立杆不要往上拉，应该向下放，但下午上班后在工地二楼屋面“女儿墙”内继续工作的泥工马X和普工刘X仍在屋顶上往上拉已拆除的一根钢管脚手架立杆。向上拉开一段距离后，马X、刘X以墙楼为支点，将管子压成斜向，欲将管子斜拉后置于屋顶上。由于斜度过大，钢管临街一端触及高压线，当时墙上比较湿，钢管与墙棱交点处发出火花，马X的胸口靠近管子烧弯处，身上穿着化纤衣服，当即燃烧起来，身体被烧伤。刘X手触管子，手指也被烧伤。楼下工友及时跑上楼将火扑灭，将受伤者送至医院。马X烧伤面积达50%，由于呼吸循环衰竭，抢救无效，于2月20日晚12时死于医院。刘X烧伤面积达15%，三根手指残疾。\n\n2.本案中，“不按规定的方法操作，把立杆往斜上方拉”属于人的不安全行为。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2052,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工队在城市一条街道旁的一个旅馆工地拆除钢管脚手架。钢管紧靠建筑物，临街面架设有10kV的高压线，离建筑物只有2m，由于街道狭窄，暂无法解决距离过近的问题。而由于某些原因又不能切断对高压线的供电。由于上午下过雨，下午墙上仍比较湿。虽然上午安全员向施工工人讲过操作方式，要求立杆不要往上拉，应该向下放，但下午上班后在工地二楼屋面“女儿墙”内继续工作的泥工马X和普工刘X仍在屋顶上往上拉已拆除的一根钢管脚手架立杆。向上拉开一段距离后，马X、刘X以墙楼为支点，将管子压成斜向，欲将管子斜拉后置于屋顶上。由于斜度过大，钢管临街一端触及高压线，当时墙上比较湿，钢管与墙棱交点处发出火花，马X的胸口靠近管子烧弯处，身上穿着化纤衣服，当即燃烧起来，身体被烧伤。刘X手触管子，手指也被烧伤。楼下工友及时跑上楼将火扑灭，将受伤者送至医院。马X烧伤面积达50%，由于呼吸循环衰竭，抢救无效，于2月20日晚12时死于医院。刘X烧伤面积达15%，三根手指残疾。\n\n3.本案中，“钢管距高压线过近而未采取隔离措施”属于存在的安全管理缺陷。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2053,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n某施工队在城市一条街道旁的一个旅馆工地拆除钢管脚手架。钢管紧靠建筑物，临街面架设有10kV的高压线，离建筑物只有2m，由于街道狭窄，暂无法解决距离过近的问题。而由于某些原因又不能切断对高压线的供电。由于上午下过雨，下午墙上仍比较湿。虽然上午安全员向施工工人讲过操作方式，要求立杆不要往上拉，应该向下放，但下午上班后在工地二楼屋面“女儿墙”内继续工作的泥工马X和普工刘X仍在屋顶上往上拉已拆除的一根钢管脚手架立杆。向上拉开一段距离后，马X、刘X以墙楼为支点，将管子压成斜向，欲将管子斜拉后置于屋顶上。由于斜度过大，钢管临街一端触及高压线，当时墙上比较湿，钢管与墙棱交点处发出火花，马X的胸口靠近管子烧弯处，身上穿着化纤衣服，当即燃烧起来，身体被烧伤。刘X手触管子，手指也被烧伤。楼下工友及时跑上楼将火扑灭，将受伤者送至医院。马X烧伤面积达50%，由于呼吸循环衰竭，抢救无效，于2月20日晚12时死于医院。刘X烧伤面积达15%，三根手指残疾。\n\n4.本案中，“工人不具备安全生产知识和能力”属于人的不安全行为。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2054,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年12月22日，由X公司承建的X隧道发生瓦斯爆炸，造成44人死亡，11人受伤，大量施工设备损坏，直接经济损失2035 万元。该隧道为平行双洞隧道，左线全长4090m,右线全长4060m，由X公司施工隧道进口端左线2550m，右线2515m。隧道造价1.5亿元XX年10月12日，右洞开挖至K14+872处时，施工单位发现K14+790～K14+872段初期支护变形超限当即停止开挖。从10月17日开始，施工单位按照建设、设计、监理，施工四方会勘纪要对变形地段初期支护进行拆换。12月16日，初期支护钢拱架拆换至K14+860 时，随着围岩的剥落，K14+860～K14+865段逐渐形成大空腔(塌腔高度约0～4m)。12月19日下午，初期支护钢拱架拆换至K14+865处，原有初期支护背后围岩左前上方形成一漏斗状空腔，四方有关人员再次对现场进行会勘。12月20日至21日施工单位按照四方共同研究的处理方案对塌腔内进行了喷射混凝土支护，但塌方没有得到控制，空腔继续扩大，至22日零点班，塌腔已与掌子面连通，形成4～5m 高，6～7m 宽，约5m长的空腔，空腔内时有掉块现象。12月22日，白班先后有43人进入右洞，其中有9人于14时30分前先后出洞，右洞洞内剩余人员34人。当班因接风筒10时起停风1小时,11时接好风筒,恢复供风,当时风筒出风口距掌子面约30m,送风距离超1400m。模板台车配电箱附近悬挂的三芯插头短路，14时40分，发生瓦斯爆炸，爆炸冲击波将停放在距右洞处约20m远，重达70t的模板台车冲出40多米，洞口通风机错位，配电柜损坏，大幅宣传牌被掀飞，在洞外组装模板台车人员、门岗等有10人死亡、11人负伤。后调查发现分包的作业队无资质，农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗。\n\n1.根据《生产安全事故报告和调查处理条例》的规定，此次事故属于重大事故。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"","image":null},{"id":2055,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年12月22日，由X公司承建的X隧道发生瓦斯爆炸，造成44人死亡，11人受伤，大量施工设备损坏，直接经济损失2035 万元。该隧道为平行双洞隧道，左线全长4090m,右线全长4060m，由X公司施工隧道进口端左线2550m，右线2515m。隧道造价1.5亿元XX年10月12日，右洞开挖至K14+872处时，施工单位发现K14+790～K14+872段初期支护变形超限当即停止开挖。从10月17日开始，施工单位按照建设、设计、监理，施工四方会勘纪要对变形地段初期支护进行拆换。12月16日，初期支护钢拱架拆换至K14+860 时，随着围岩的剥落，K14+860～K14+865段逐渐形成大空腔(塌腔高度约0～4m)。12月19日下午，初期支护钢拱架拆换至K14+865处，原有初期支护背后围岩左前上方形成一漏斗状空腔，四方有关人员再次对现场进行会勘。12月20日至21日施工单位按照四方共同研究的处理方案对塌腔内进行了喷射混凝土支护，但塌方没有得到控制，空腔继续扩大，至22日零点班，塌腔已与掌子面连通，形成4～5m 高，6～7m 宽，约5m长的空腔，空腔内时有掉块现象。12月22日，白班先后有43人进入右洞，其中有9人于14时30分前先后出洞，右洞洞内剩余人员34人。当班因接风筒10时起停风1小时,11时接好风筒,恢复供风,当时风筒出风口距掌子面约30m,送风距离超1400m。模板台车配电箱附近悬挂的三芯插头短路，14时40分，发生瓦斯爆炸，爆炸冲击波将停放在距右洞处约20m远，重达70t的模板台车冲出40多米，洞口通风机错位，配电柜损坏，大幅宣传牌被掀飞，在洞外组装模板台车人员、门岗等有10人死亡、11人负伤。后调查发现分包的作业队无资质，农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗。\n\n2.风筒出风口距掌子面约30m，送风距离超1400m的做法是错误的。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2056,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年12月22日，由X公司承建的X隧道发生瓦斯爆炸，造成44人死亡，11人受伤，大量施工设备损坏，直接经济损失2035 万元。该隧道为平行双洞隧道，左线全长4090m,右线全长4060m，由X公司施工隧道进口端左线2550m，右线2515m。隧道造价1.5亿元XX年10月12日，右洞开挖至K14+872处时，施工单位发现K14+790～K14+872段初期支护变形超限当即停止开挖。从10月17日开始，施工单位按照建设、设计、监理，施工四方会勘纪要对变形地段初期支护进行拆换。12月16日，初期支护钢拱架拆换至K14+860 时，随着围岩的剥落，K14+860～K14+865段逐渐形成大空腔(塌腔高度约0～4m)。12月19日下午，初期支护钢拱架拆换至K14+865处，原有初期支护背后围岩左前上方形成一漏斗状空腔，四方有关人员再次对现场进行会勘。12月20日至21日施工单位按照四方共同研究的处理方案对塌腔内进行了喷射混凝土支护，但塌方没有得到控制，空腔继续扩大，至22日零点班，塌腔已与掌子面连通，形成4～5m 高，6～7m 宽，约5m长的空腔，空腔内时有掉块现象。12月22日，白班先后有43人进入右洞，其中有9人于14时30分前先后出洞，右洞洞内剩余人员34人。当班因接风筒10时起停风1小时,11时接好风筒,恢复供风,当时风筒出风口距掌子面约30m,送风距离超1400m。模板台车配电箱附近悬挂的三芯插头短路，14时40分，发生瓦斯爆炸，爆炸冲击波将停放在距右洞处约20m远，重达70t的模板台车冲出40多米，洞口通风机错位，配电柜损坏，大幅宣传牌被掀飞，在洞外组装模板台车人员、门岗等有10人死亡、11人负伤。后调查发现分包的作业队无资质，农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗。\n\n3.以下属于事故直接原因的是（   ）。","options":[{"key":"A","text":"该地段有煤层、储气构造、瓦斯通道(断层带)，塌方处导致瓦斯大量涌出"},{"key":"B","text":"违规将劳务分包给无资质的作业队"},{"key":"C","text":"模板台车配电箱附近悬挂的三芯插头短路产生火花引起瓦斯爆炸"},{"key":"D","text":"农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗"}],"answer":"C","basis":"","image":null},{"id":2057,"category":"安全生产知识","type":"single","seq":null,"stem":"【案例】\n20XX年12月22日，由X公司承建的X隧道发生瓦斯爆炸，造成44人死亡，11人受伤，大量施工设备损坏，直接经济损失2035 万元。该隧道为平行双洞隧道，左线全长4090m,右线全长4060m，由X公司施工隧道进口端左线2550m，右线2515m。隧道造价1.5亿元XX年10月12日，右洞开挖至K14+872处时，施工单位发现K14+790～K14+872段初期支护变形超限当即停止开挖。从10月17日开始，施工单位按照建设、设计、监理，施工四方会勘纪要对变形地段初期支护进行拆换。12月16日，初期支护钢拱架拆换至K14+860 时，随着围岩的剥落，K14+860～K14+865段逐渐形成大空腔(塌腔高度约0～4m)。12月19日下午，初期支护钢拱架拆换至K14+865处，原有初期支护背后围岩左前上方形成一漏斗状空腔，四方有关人员再次对现场进行会勘。12月20日至21日施工单位按照四方共同研究的处理方案对塌腔内进行了喷射混凝土支护，但塌方没有得到控制，空腔继续扩大，至22日零点班，塌腔已与掌子面连通，形成4～5m 高，6～7m 宽，约5m长的空腔，空腔内时有掉块现象。12月22日，白班先后有43人进入右洞，其中有9人于14时30分前先后出洞，右洞洞内剩余人员34人。当班因接风筒10时起停风1小时,11时接好风筒,恢复供风,当时风筒出风口距掌子面约30m,送风距离超1400m。模板台车配电箱附近悬挂的三芯插头短路，14时40分，发生瓦斯爆炸，爆炸冲击波将停放在距右洞处约20m远，重达70t的模板台车冲出40多米，洞口通风机错位，配电柜损坏，大幅宣传牌被掀飞，在洞外组装模板台车人员、门岗等有10人死亡、11人负伤。后调查发现分包的作业队无资质，农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗。\n\n4.以下属于事故间接原因的是（   ）","options":[{"key":"A","text":"掌子面塌方，瓦斯异常涌出"},{"key":"B","text":"模板台车附近瓦斯浓度达到爆炸极限"},{"key":"C","text":"模板台车配电箱附近悬挂的三芯插头短路产生火花引起瓦斯爆炸"},{"key":"D","text":"违规将劳务分包给无资质的作业队"}],"answer":"D","basis":"","image":null},{"id":2058,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年5月17日，X市红旗路高架桥发生垮塌事故，造成9人死亡，16人受伤，24辆车受损。事故发生时，在对高架桥110号-109号桥墩段路面实施机械拆除，桥墩突然断裂，形成骨牌效应，导致八个桥墩九个桥面坍塌。事故死者善后处理按照“一个领导、一套班子、一个标准”的善后处理方案，对于每一名事故死者，统筹安排一名市级领导对接善后处理。死者不论城乡、不论年龄，死亡赔偿标准统一定为每人40万元，由施工单位委托业主单位先期代为垫付赔偿。经查实，犯罪嫌疑人程某经XX民爆工程有限公司总经理高某同意，在不具备相应资质的情况下，以挂靠XX民爆工程有限公司的方式通过招投标程序中得红旗高架桥爆破拆除工程项目。整个高架桥的拆除由XX监理公司负责全程监理，在施工监理过程中，没有对程某等人有无机械拆除高架桥资质和相关安全措施予以审查。经检察机关审查，依法批准对涉嫌犯罪的程某、高某等9人予以逮捕。\n\n1.2009年事故死亡赔偿每人40万元符合当地的赔偿标准。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"","image":null},{"id":2059,"category":"安全生产知识","type":"judge","seq":null,"stem":"【案例】\n20XX年5月17日，X市红旗路高架桥发生垮塌事故，造成9人死亡，16人受伤，24辆车受损。事故发生时，在对高架桥110号-109号桥墩段路面实施机械拆除，桥墩突然断裂，形成骨牌效应，导致八个桥墩九个桥面坍塌。事故死者善后处理按照“一个领导、一套班子、一个标准”的善后处理方案，对于每一名事故死者，统筹安排一名市级领导对接善后处理。死者不论城乡、不论年龄，死亡赔偿标准统一定为每人40万元，由施工单位委托业主单位先期代为垫付赔偿。经查实，犯罪嫌疑人程某经XX民爆工程有限公司总经理高某同意，在不具备相应资质的情况下，以挂靠XX民爆工程有限公司的方式通过招投标程序中得红旗高架桥爆破拆除工程项目。整个高架桥的拆除由XX监理公司负责全程监理，在施工监理过程中，没有对程某等人有无机械拆除高架桥资质和相关安全措施予以审查。经检察机关审查，依法批准对涉嫌犯罪的程某、高某等9人予以逮捕。\n\n2.从2015年开始，工伤事故死亡赔偿标准大大提高。 <script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const QS = DATA.questions;
  const BY_ID = {}; QS.forEach(q=>BY_ID[q.id]=q);
  const pool = ()=> state.cat==="all" ? QS : QS.filter(q=>q.category===state.cat);
  const TYPE_INFO = {single:{name:"单选题",n:4}, multiple:{name:"多选题",n:4}, judge:{name:"判断题",n:2}};
  const SINGLE_LETTERS = ["A","B","C","D","E","F"];
  const PROGRESS_KEY = "anbao_progress_v2";
  const FAV_KEY = "anbao_fav_v2";

  let progress = load(PROGRESS_KEY, {});   // {qid:{sel, correct}}
  let favs = load(FAV_KEY, {});            // {qid:true}

  let state = { order:[], idx:0, mode:"seq", exam:false, examEnd:0, timer:null, session:{}, cat:"all" };

  /* ---------- storage ---------- */
  function load(k, def){ try{ return JSON.parse(localStorage.getItem(k)) || def; }catch(e){ return def; } }
  function save(){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }

  /* ---------- theme ---------- */
  const themeBtn = $("#themeBtn");
  themeBtn.onclick = ()=>{
    const t = document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("anbao_a_theme", t);
  };
  (function(){ const t = localStorage.getItem("anbao_a_theme"); if(t) document.documentElement.setAttribute("data-theme", t); })();

  /* ---------- home ---------- */
  function renderHome(){
    $("#home").classList.remove("hidden"); $("#quiz").classList.add("hidden");
    // category chips
    const cats = DATA.meta.categories || [{key:"all",name:"全部",count:QS.length}];
    $("#catBar").innerHTML = cats.map(c=>`
      <button class="chip ${state.cat===c.key?'on':''}" data-cat="${c.key}">
        ${c.name}<span class="cn">${c.count}</span>
      </button>`).join("");
    $("#catBar").querySelectorAll("[data-cat]").forEach(b=>{
      b.onclick = ()=>{ state.cat = b.dataset.cat; renderHome(); };
    });
    // stats scoped to current category
    const base = pool();
    const answered = base.filter(q=>progress[q.id]).length;
    const right = base.filter(q=>progress[q.id] && progress[q.id].correct).length;
    const wrong = answered - right;
    $("#homeStats").innerHTML = `
      <div class="stat"><b>${base.length}</b><span>总题数</span></div>
      <div class="stat"><b>${answered}</b><span>已练习</span></div>
      <div class="stat"><b style="color:var(--ok)">${right}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${wrong}</b><span>答错</span></div>`;
    // type grid scoped to category
    const tc = {single:0, multiple:0, judge:0};
    base.forEach(q=>{ tc[q.type]++; });
    const grid = [
      {type:"single", n:tc.single, label:"单选题"},
      {type:"multiple", n:tc.multiple, label:"多选题"},
      {type:"judge", n:tc.judge, label:"判断题"},
    ];
    $("#typeGrid").innerHTML = grid.map(g=>`
      <button class="sub" data-type="${g.type}">
        <b>${g.n}</b><span>${g.label}</span>
      </button>`).join("");
    $("#typeGrid").querySelectorAll("[data-type]").forEach(b=>{
      b.onclick = ()=> startPractice("type", {typeFilter:b.dataset.type});
    });
  }

  document.querySelectorAll(".mode").forEach(m=>{
    m.onclick = ()=>{
      const mode = m.dataset.mode;
      if(mode==="wrong"){
        startPractice("wrong", {});
      } else if(mode==="exam"){
        startPractice("exam", {});
      } else {
        startPractice(mode, {});
      }
    };
  });

  /* ---------- start ---------- */
  function startPractice(mode, opts){
    let order = [];
    state.mode = mode; state.exam = (mode==="exam");
    if(mode==="seq") order = pool().slice();
    else if(mode==="rand") order = shuffle(pool().slice());
    else if(mode==="type") order = pool().filter(q=>q.type===opts.typeFilter);
    else if(mode==="wrong"){
      const ids = Object.keys(progress).filter(id=>progress[id] && progress[id].correct===false && BY_ID[id] && (state.cat==="all"||BY_ID[id].category===state.cat));
      if(!ids.length){ toast(state.cat==="all"?"还没有错题，先去练习吧":"当前类目下还没有错题"); return; }
      order = QS.filter(q=> ids.includes(String(q.id)));
    }
    else if(mode==="exam"){
      order = buildExam(50);
    }
    if(!order.length){ toast("没有可用题目"); return; }
    state.order = order; state.idx = 0; state.session = {};
    if(state.exam){
      state.examEnd = Date.now() + 45*60*1000;
      startTimer();
    } else { stopTimer(); }
    $("#home").classList.add("hidden"); $("#quiz").classList.remove("hidden");
    const labels = {seq:"顺序练习",rand:"随机练习",exam:"模拟考试",wrong:"错题重练",type:"专项练习"};
    let lbl = labels[mode] || "练习";
    if(state.cat!=="all"){ const c = DATA.meta.categories.find(x=>x.key===state.cat); if(c) lbl += " · " + c.name; }
    $("#modeLabel").textContent = lbl;
    $("#totNum").textContent = order.length;
    renderQuestion();
  }

  function buildExam(n){
    const base = pool();
    const byType = {single:[],multiple:[],judge:[]};
    base.forEach(q=>byType[q.type].push(q));
    let ex = [];
    const want = {single:Math.round(n*0.5), multiple:Math.round(n*0.25), judge:n-Math.round(n*0.5)-Math.round(n*0.25)};
    for(const t in want){
      const arr = shuffle(byType[t].slice());
      ex = ex.concat(arr.slice(0, want[t]));
    }
    return shuffle(ex);
  }

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  /* ---------- render question ---------- */
  function getAns(qid){ return state.session[qid] || progress[qid] || null; }

  function renderQuestion(){
    const q = state.order[state.idx];
    const ti = TYPE_INFO[q.type];
    $("#qBadge").className = "badge " + q.type;
    $("#qBadge").textContent = ti.name;
    $("#qTypeInfo").textContent = state.exam ? "模拟考试 · 不立即判分" : "点击选项即时判分";
    $("#curNum").textContent = state.idx+1;
    $("#barFill").style.width = ((state.idx+1)/state.order.length*100)+"%";
    updateAcc();

    // fav
    const fb = $("#favBtn");
    fb.classList.toggle("on", !!favs[q.id]);
    fb.onclick = ()=>{ if(favs[q.id]) delete favs[q.id]; else favs[q.id]=true; fb.classList.toggle("on"); save(); toast(favs[q.id]?"已收藏":"已取消收藏"); };

    // image
    const imgBox = $("#qImg");
    if(q.image){
      imgBox.classList.remove("hidden");
      $("#qImgEl").src = q.image;
      imgBox.onclick = ()=> openZoom(q.image);
    } else { imgBox.classList.add("hidden"); imgBox.onclick=null; }

    $("#qStem").textContent = q.stem;

    // options
    const optsEl = $("#opts");
    optsEl.innerHTML = "";
    const ans = getAns(q.id);
    const answered = !!ans;
    const selSet = new Set(answered ? (Array.isArray(ans.sel)?ans.sel:ans.sel.split("")) : []);
    q.options.forEach(o=>{
      const b = document.createElement("button");
      b.className = "opt";
      let extra = "";
      if(answered && !state.exam){
        const correctKeys = q.answer.toUpperCase().split("");
        if(correctKeys.includes(o.key)) extra = " correct";
        else if(selSet.has(o.key)) extra = " wrong";
        else if(selSet.size) extra = " lock";
        if(extra) b.classList.add(extra.trim());
      }
      if(selSet.has(o.key)) b.classList.add("sel");
      b.innerHTML = `<span class="k">${o.key}</span><span class="t">${escapeHtml(o.text)}</span>`;
      if(!(answered && !state.exam)) b.onclick = ()=> onPick(q, o.key);
      else b.classList.add("lock");
      optsEl.appendChild(b);
    });

    // feedback / submit
    const fbEl = $("#feedback"); const subRow = $("#submitRow");
    if(answered && !state.exam){
      showFeedback(q, ans);
    } else {
      fbEl.className = "feedback";
      if(q.type==="multiple" && !state.exam){
        subRow.classList.add("show");
        $("#submitBtn").onclick = ()=> onSubmitMultiple(q);
      } else { subRow.classList.remove("show"); }
    }

    // nav buttons
    $("#prevBtn").disabled = state.idx===0;
    $("#nextBtn").disabled = state.idx===state.order.length-1;
    if(state.exam){
      $("#nextBtn").textContent = "下一题 ›";
      $("#submitRow").classList.remove("show");
    }
  }

  function onPick(q, key){
    if(q.type==="multiple"){
      const cur = state.session[q.id] || {sel:[]};
      cur.sel = cur.sel || [];
      const i = cur.sel.indexOf(key);
      if(i>=0) cur.sel.splice(i,1); else cur.sel.push(key);
      state.session[q.id] = cur;
      renderQuestion();
      return;
    }
    if(state.exam){
      state.session[q.id] = {sel:[key]};
      renderQuestion();
      return;
    }
    const correct = (q.answer.toUpperCase() === key);
    record(q, [key], correct);
    renderQuestion();
  }

  function onSubmitMultiple(q){
    const cur = state.session[q.id] || {sel:[]};
    if(!cur.sel || !cur.sel.length){ toast("请至少选择一个选项"); return; }
    const correct = sameSet(cur.sel, q.answer.toUpperCase().split(""));
    record(q, cur.sel, correct);
    renderQuestion();
  }

  function record(q, sel, correct){
    state.session[q.id] = {sel:sel.slice(), correct};
    progress[q.id] = {sel:sel.slice().join(""), correct};
    save();
    updateAcc();
  }

  function showFeedback(q, ans){
    const correctKeys = q.answer.toUpperCase().split("");
    const fbEl = $("#feedback");
    const ok = ans.correct;
    fbEl.className = "feedback show " + (ok?"ok":"bad");
    $("#fbIc").textContent = ok ? "✓" : "✕";
    const selDisp = (Array.isArray(ans.sel)?ans.sel:String(ans.sel).split("")).join("、");
    let html = ok
      ? `回答正确！<b>你的答案：${selDisp}</b>`
      : `回答错误。正确答案是 <span class="ans">${correctKeys.join("、")}</span> ，你的选择：${selDisp||"未作答"}`;
    if(q.basis){ html += `<div class="basis">📖 依据：${escapeHtml(q.basis)}</div>`; }
    $("#fbTxt").innerHTML = html;
  }

  function updateAcc(){
    const ids = Object.keys(state.session);
    if(!ids.length){ $("#accNum").textContent = "--"; return; }
    const right = ids.filter(id=>state.session[id].correct).length;
    $("#accNum").textContent = Math.round(right/ids.length*100)+"%";
  }

  function sameSet(a,b){
    if(a.length!==b.length) return false;
    const sa = a.slice().sort().join(""), sb = b.slice().sort().join("");
    return sa===sb;
  }

  /* ---------- nav ---------- */
  $("#prevBtn").onclick = ()=>{ if(state.idx>0){ state.idx--; renderQuestion(); } };
  $("#nextBtn").onclick = ()=>{ if(state.exam && state.idx===state.order.length-1){ finishExam(); return; }
    if(state.idx<state.order.length-1){ state.idx++; renderQuestion(); } };
  $("#backBtn").onclick = ()=>{ if(state.exam){ if(!confirm("退出模拟考试？当前进度将保留。")) return; } stopTimer(); renderHome(); };

  /* ---------- answer sheet ---------- */
  const sheetMask = $("#sheetMask");
  $("#sheetBtn").onclick = openSheet;
  $("#sheetClose").onclick = ()=> sheetMask.classList.remove("show");
  sheetMask.onclick = e=>{ if(e.target===sheetMask) sheetMask.classList.remove("show"); };
  function openSheet(){
    const grid = $("#sheetGrid"); grid.innerHTML="";
    $("#sheetSub").textContent = `共 ${state.order.length} 题 · 点击题号跳转`;
    state.order.forEach((q,i)=>{
      const c = document.createElement("button");
      c.className = "cell";
      const ans = getAns(q.id);
      if(i===state.idx) c.classList.add("cur");
      else if(ans){
        if(state.exam) c.classList.add("done");
        else if(ans.correct) c.classList.add("right");
        else c.classList.add("wrong");
      }
      c.textContent = i+1;
      c.onclick = ()=>{ state.idx=i; sheetMask.classList.remove("show"); renderQuestion(); };
      grid.appendChild(c);
    });
    sheetMask.classList.add("show");
  }

  /* ---------- zoom ---------- */
  const zoomMask = $("#zoomMask");
  function openZoom(src){ $("#zoomImg").src = src; zoomMask.classList.add("show"); }
  zoomMask.onclick = ()=> zoomMask.classList.remove("show");

  /* ---------- exam ---------- */
  function startTimer(){
    stopTimer();
    const tick = ()=>{
      const left = state.examEnd - Date.now();
      if(left<=0){ $("#modeLabel").textContent = "模拟考试 · 时间到"; finishExam(); return; }
      const m = String(Math.floor(left/60000)).padStart(2,"0");
      const s = String(Math.floor(left%60000/1000)).padStart(2,"0");
      $("#modeLabel").textContent = `模拟考试 · 剩余 ${m}:${s}`;
    };
    tick(); state.timer = setInterval(tick, 1000);
  }
  function stopTimer(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } }

  function finishExam(){
    stopTimer();
    let right=0;
    state.order.forEach(q=>{
      const ans = state.session[q.id];
      const sel = ans && ans.sel ? (Array.isArray(ans.sel)?ans.sel:String(ans.sel).split("")) : [];
      const correct = sameSet(sel, q.answer.toUpperCase().split(""));
      progress[q.id] = {sel:sel.join(""), correct};
      if(correct) right++;
    });
    save();
    const total = state.order.length;
    const rate = Math.round(right/total*100);
    const pass = rate >= 60;
    $("#resScore").textContent = rate;
    $("#resScore").className = "score " + (pass?"pass":"fail");
    $("#resTitle").textContent = pass ? "恭喜，考核合格！" : "很遗憾，未达合格线";
    $("#resSub").textContent = `满分100 · 60分合格 · 共 ${total} 题`;
    $("#resRight").textContent = right;
    $("#resWrong").textContent = total-right;
    $("#resRate").textContent = rate+"%";
    $("#resReview").onclick = ()=>{ $("#resultMask").classList.remove("show");
      const ids = state.order.filter(q=>{const a=state.session[q.id];const sel=a&&a.sel?(Array.isArray(a.sel)?a.sel:String(a.sel).split("")):[];return !sameSet(sel,q.answer.toUpperCase().split(""));}).map(q=>String(q.id));
      if(ids.length) startPractice("wrong",{ids}); else { toast("全部答对，太棒了！"); renderHome(); } };
    $("#resHome").onclick = ()=>{ $("#resultMask").classList.remove("show"); renderHome(); };
    $("#resultMask").classList.add("show");
  }

  /* ---------- utils ---------- */
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  let toastT;
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

  // keyboard nav
  document.addEventListener("keydown", e=>{
    if($("#quiz").classList.contains("hidden")) return;
    if(sheetMask.classList.contains("show")||zoomMask.classList.contains("show")||$("#resultMask").classList.contains("show")) return;
    if(e.key==="ArrowLeft") $("#prevBtn").click();
    else if(e.key==="ArrowRight") $("#nextBtn").click();
    else if(/^[1-9]$/.test(e.key)){
      const q = state.order[state.idx];
      const o = q.options[parseInt(e.key)-1];
      if(o && !state.exam) onPick(q, o.key);
      else if(o && state.exam) onPick(q, o.key);
    }
  });

  renderHome();
})();
</script>
</body>
</html>

"ABCD","basis":"《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，第8章","image":null},{"id":1595,"category":"安全生产知识","type":"multiple","seq":95,"stem":"根据《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，吊篮的日常检查应包括以下哪些项目（    ）","options":[{"key":"A","text":"悬吊平台的连接是否牢固"},{"key":"B","text":"钢丝绳是否有磨损或断裂"},{"key":"C","text":"提升机和安全锁是否正常工作"},{"key":"D","text":"电气系统是否漏电"},{"key":"E","text":"吊篮检测报告"}],"answer":"ABCD","basis":"《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，第8章","image":null},{"id":1596,"category":"安全生产知识","type":"multiple","seq":96,"stem":"根据《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，吊篮在使用过程中，以下哪些设备或设施需要定期检查和维护（    ）","options":[{"key":"A","text":"安全绳"},{"key":"B","text":"上限位挡板"},{"key":"C","text":"配重块"},{"key":"D","text":"脚手架"},{"key":"E","text":"安全锁"}],"answer":"ABCE","basis":"《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，第8章","image":null},{"id":1597,"category":"安全生产知识","type":"multiple","seq":97,"stem":"根据《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，吊篮在使用过程中，以下哪些环境条件是需要特别注意的（    ）","options":[{"key":"A","text":"强风"},{"key":"B","text":"雷电"},{"key":"C","text":"暴雨"},{"key":"D","text":"大雾"},{"key":"E","text":"晴天"}],"answer":"ABCD","basis":"《建筑施工高处作业吊篮应用标准》JGJ/T 480-2024，第5章，第8.1.9条","image":null},{"id":1598,"category":"安全生产知识","type":"multiple","seq":98,"stem":"根据《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，以下哪些是附着式升降脚手架安装前必须检查的内容（    ）","options":[{"key":"A","text":"主要受力结构件的腐蚀、弯曲变形、开焊、开裂等情况"},{"key":"B","text":"起重设备的状况，确保起重量及作业范围满足安装要求"},{"key":"C","text":"附着支承装置安放的建筑结构部位及预埋件"},{"key":"D","text":"架体的清洁情况"},{"key":"E","text":"层间防护设置情况"}],"answer":"ABC","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.8条","image":null},{"id":1599,"category":"安全生产知识","type":"multiple","seq":99,"stem":"根据《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，在附着式升降脚手架的安装过程中，以下哪些操作是必须遵守的（    ）","options":[{"key":"A","text":"严格执行起重吊装安全操作规程，设专人指挥"},{"key":"B","text":"安装平台承载层水平误差小于30mm"},{"key":"C","text":"竖向主框架相邻高差不大于50mm"},{"key":"D","text":"水平支承桁架内外两侧等高设置"},{"key":"E","text":"附着支承装置预留螺栓孔中心误差小于10mm"}],"answer":"AD","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.8条","image":null},{"id":1600,"category":"安全生产知识","type":"multiple","seq":100,"stem":"根据《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，在附着式升降脚手架的升降作业中，以下哪些措施是必须采取的（    ）","options":[{"key":"A","text":"全面检查与验收，填写升（降）前检查验收表"},{"key":"B","text":"确认升降支座安装处混凝土抗压强度"},{"key":"C","text":"设置安全警戒线，下方设安全区域、挂警示牌"},{"key":"D","text":"任何人员不得停留在架体上"},{"key":"E","text":"各相邻提升点间的高差不得大于50mm"}],"answer":"ABCD","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.9条","image":null},{"id":1601,"category":"安全生产知识","type":"multiple","seq":101,"stem":"根据《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，附着式升降脚手架的拆卸作业应遵循哪些原则（    ）","options":[{"key":"A","text":"自上而下，顺序作业"},{"key":"B","text":"施工作业人员必须正确配戴安全防护用品"},{"key":"C","text":"拆卸区域地面设置警戒线，并配备专人看护"},{"key":"D","text":"采用起重机械起吊架体单元作业时，钢丝绳索未捆绑牢固前，架体不得提前拆卸松动"},{"key":"E","text":"拆卸材料在架体分类堆放整齐，高度不得超过1m"}],"answer":"ABCD","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.10条","image":null},{"id":1602,"category":"安全生产知识","type":"multiple","seq":102,"stem":"根据《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，在附着式升降脚手架的使用过程中，遇到以下哪些情况应立即停止作业并采取加固措施（    ）","options":[{"key":"A","text":"遇5级及以上大风"},{"key":"B","text":"大雨、大雪、浓雾、雷雨等恶劣天气"},{"key":"C","text":"停用超过一个月"},{"key":"D","text":"遇5级以上强风或大雨后复工"},{"key":"E","text":"架体出现异常情况"}],"answer":"ABCE","basis":"《建筑施工工具式脚手架安全技术规范》JGJ 202-2010，第4.6条","image":null},{"id":1603,"category":"安全生产知识","type":"multiple","seq":103,"stem":"根据《危险性较大的分部分项工程安全管理规定》，以下哪些说法是正确的（    ）","options":[{"key":"A","text":"危大工程和超过一定规模的危大工程相互独立"},{"key":"B","text":"危大工程包含所有超过一定规模的危大工程"},{"key":"C","text":"所有超过一定规模的危大工程均是危大工程"},{"key":"D","text":"所有危大工程均是超过一定规模的危大工程"},{"key":"E","text":"落地式脚手架属于危大工程"}],"answer":"BC","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号）","image":null},{"id":1604,"category":"安全生产知识","type":"multiple","seq":104,"stem":"根据《危险性较大的分部分项工程安全管理规定》，施工单位在危大工程管理中应建立哪些档案（    ）","options":[{"key":"A","text":"危大工程风险评价和风险管控相关资料以及人员教育培训资料"},{"key":"B","text":"专项施工方案及审核、审查、审批手续及专家论证报告"},{"key":"C","text":"方案交底及安全技术交底"},{"key":"D","text":"项目负责人现场履职记录和项目专职安全管理人员现场监督记录"},{"key":"E","text":"危大工程验收记录"}],"answer":"BCDE","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号），第二十一条","image":null},{"id":1605,"category":"安全生产知识","type":"multiple","seq":105,"stem":"根据《危险性较大的分部分项工程安全管理规定》，以下哪些属于超过一定规模的危大工程（    ）","options":[{"key":"A","text":"开挖深度超过5m的基坑支护工程"},{"key":"B","text":"搭设高度超过8m的混凝土模板支撑工程"},{"key":"C","text":"提升高度超过150m的附着式升降脚手架工程"},{"key":"D","text":"跨度超过36m的钢结构安装工程"},{"key":"E","text":"施工总荷载（设计值）10kN/㎡的混凝土模板支撑工程"}],"answer":"ABCD","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号）","image":null},{"id":1606,"category":"安全生产知识","type":"multiple","seq":106,"stem":"根据《危险性较大的分部分项工程安全管理规定》，施工单位在危大工程管理中的违规行为包括哪些（    ）","options":[{"key":"A","text":"未进行方案交底和安全技术交底"},{"key":"B","text":"未公告危大工程及设置安全警示标志"},{"key":"C","text":"项目负责人未对专项施工方案实施情况进行现场监督"},{"key":"D","text":"未对超过一定规模的危大工程专项施工方案进行专家论证"},{"key":"E","text":"根据专家论证报告修改方案"}],"answer":"ABCD","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号）","image":null},{"id":1607,"category":"安全生产知识","type":"multiple","seq":107,"stem":"根据《危险性较大的分部分项工程安全管理规定》，以下哪些行为会导致建设单位被责令限期改正，并处1万元以上3万元以下的罚款（    ）","options":[{"key":"A","text":"未按照规定提供工程周边环境等资料"},{"key":"B","text":"未在招标文件中列出危大工程清单"},{"key":"C","text":"未及时支付危大工程施工技术措施费或相应的安全防护文明施工措施费"},{"key":"D","text":"未委托具有相应勘察资质的单位进行第三方监测"},{"key":"E","text":"未对第三方监测单位报告的异常情况组织采取处置措施"}],"answer":"ABCD","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号），第三十五条","image":null},{"id":1608,"category":"安全生产知识","type":"multiple","seq":108,"stem":"根据《危险性较大的分部分项工程安全管理规定》，施工单位在危大工程实施期间应完成哪些工作（    ）","options":[{"key":"A","text":"不需对施工作业人员进行登记"},{"key":"B","text":"项目负责人实施带班生产"},{"key":"C","text":"项目专职安全生产管理人员进行现场监督"},{"key":"D","text":"按规定对危大工程进行施工监测"},{"key":"E","text":"组织危大工程验收"}],"answer":"BCDE","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号），第四章","image":null},{"id":1609,"category":"安全生产知识","type":"multiple","seq":109,"stem":"根据《危险性较大的分部分项工程安全管理规定》，以下哪些单位应当参与危大工程专项施工方案的编制或审核（    ）","options":[{"key":"A","text":"施工总承包单位"},{"key":"B","text":"专业分包单位"},{"key":"C","text":"监理单位"},{"key":"D","text":"建设单位"},{"key":"E","text":"设计单位"}],"answer":"ABC","basis":"《危险性较大的分部分项工程安全管理规定》（住房和城乡建设部令第37号），第十条、第十一条、第十二条和第十三条","image":null},{"id":1610,"category":"安全生产知识","type":"multiple","seq":110,"stem":"根据《中华人民共和国建筑法》，建筑工程发包与承包的招标投标活动，应当遵循以下哪些原则（    ）","options":[{"key":"A","text":"公开"},{"key":"B","text":"低价"},{"key":"C","text":"公正"},{"key":"D","text":"平等竞争"},{"key":"E","text":"高性价比"}],"answer":"ACD","basis":"《中华人民共和国建筑法》第十六条","image":null},{"id":1611,"category":"安全生产知识","type":"multiple","seq":111,"stem":"根据《中华人民共和国建筑法》，建设单位有以下哪些情形的，应当按照国家有关规定办理申请批准手续（    ）","options":[{"key":"A","text":"需要临时占用规划批准范围以外场地的"},{"key":"B","text":"需要临时停水、停电、中断道路交通的"},{"key":"C","text":"需要异地新建、重新选址的"},{"key":"D","text":"需要进行爆破作业的"},{"key":"E","text":"可能损坏道路、管线、电力、邮电通信等公共设施的"}],"answer":"ABDE","basis":"《中华人民共和国建筑法》第七条","image":null},{"id":1612,"category":"安全生产知识","type":"multiple","seq":112,"stem":"根据《中华人民共和国劳动法》，用人单位在下列哪些情形下不得解除劳动合同（    ）","options":[{"key":"A","text":"劳动者患病或者非因工负伤，在规定的医疗期内的"},{"key":"B","text":"女职工在孕期、产期、哺乳期内的"},{"key":"C","text":"劳动者在本单位连续工作满十五年，且距法定退休年龄不足五年的"},{"key":"D","text":"劳动者被依法追究刑事责任的"},{"key":"E","text":"劳动者严重违反劳动纪律或者用人单位规章制度的"}],"answer":"ABC","basis":"《中华人民共和国劳动法》第二十九条","image":null},{"id":1613,"category":"安全生产知识","type":"multiple","seq":113,"stem":"根据《中华人民共和国劳动法》，劳动者有以下哪些情形之一的，用人单位可以解除劳动合同（    ）","options":[{"key":"A","text":"在试用期间被证明不符合录用条件的"},{"key":"B","text":"严重违反劳动纪律或者用人单位规章制度的"},{"key":"C","text":"严重失职，营私舞弊，对用人单位利益造成重大损害的"},{"key":"D","text":"被依法追究刑事责任的"},{"key":"E","text":"劳动者患病或者非因工负伤，在规定的医疗期内的"}],"answer":"ABCD","basis":"《中华人民共和国劳动法》第二十五条、第二十六条、第二十七条。","image":null},{"id":1614,"category":"安全生产知识","type":"multiple","seq":114,"stem":"根据《中华人民共和国劳动法》，劳动者有以下哪些情形之一的，用人单位应当按照国家有关规定给予经济补偿（    ）","options":[{"key":"A","text":"劳动者因用人单位未按照劳动合同约定支付劳动报酬而解除劳动合同的"},{"key":"B","text":"劳动者因用人单位未提供劳动保护或者劳动条件而解除劳动合同的"},{"key":"C","text":"用人单位因生产经营需要解除劳动合同的"},{"key":"D","text":"劳动者因用人单位未依法为劳动者缴纳社会保险费而解除劳动合同的"},{"key":"E","text":"劳动者因用人单位的规章制度违反法律、法规的规定，损害劳动者权益而解除劳动合同的"}],"answer":"ABDE","basis":"《中华人民共和国劳动法》第二十八条","image":null},{"id":1615,"category":"安全生产知识","type":"multiple","seq":115,"stem":"根据《中华人民共和国劳动法》，劳动者有以下哪些情形之一的，用人单位不得解除劳动合同（   ）","options":[{"key":"A","text":"患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力的"},{"key":"B","text":"患病或者负伤，在规定的医疗期内的"},{"key":"C","text":"女职工在孕期、产期、哺乳期内的"},{"key":"D","text":"法律、行政法规规定的其他情形"},{"key":"E","text":"劳动者严重违反劳动纪律或者用人单位规章制度的"}],"answer":"ABCD","basis":"《中华人民共和国劳动法》第二十九条","image":null},{"id":1616,"category":"安全生产知识","type":"multiple","seq":116,"stem":"根据《工伤保险条例》，职工有下列情形之一的，视同工伤（    ）","options":[{"key":"A","text":"在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的"},{"key":"B","text":"在抢险救灾等维护国家利益、公共利益活动中受到伤害的"},{"key":"C","text":"职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的"},{"key":"D","text":"自残或者自杀的"},{"key":"E","text":"醉酒或者吸毒的"}],"answer":"ABC","basis":"《工伤保险条例》第十五条","image":null},{"id":1617,"category":"安全生产知识","type":"multiple","seq":117,"stem":"根据《工伤保险条例》，工伤职工已经评定伤残等级并经劳动能力鉴定委员会确认需要生活护理的，从工伤保险基金按月支付生活护理费。生活护理费按照生活完全不能自理、生活大部分不能自理或者生活部分不能自理3个不同等级支付，其标准分别为统筹地区上年度职工月平均工资的（    ）","options":[{"key":"A","text":"50%"},{"key":"B","text":"40%"},{"key":"C","text":"30%"},{"key":"D","text":"20%"},{"key":"E","text":"10%"}],"answer":"ABC","basis":"《工伤保险条例》第三十四条","image":null},{"id":1618,"category":"安全生产知识","type":"multiple","seq":118,"stem":"根据《工伤保险条例》，职工因工致残被鉴定为一级至四级伤残的，保留劳动关系，退出工作岗位，享受以下待遇（    ）","options":[{"key":"A","text":"从工伤保险基金按伤残等级支付一次性伤残补助金"},{"key":"B","text":"从工伤保险基金按月支付伤残津贴"},{"key":"C","text":"工伤职工达到退休年龄并办理退休手续后，停发伤残津贴，按照国家有关规定享受基本养老保险待遇"},{"key":"D","text":"由用人单位和职工个人以伤残津贴为基数，缴纳基本医疗保险费"},{"key":"E","text":"由工伤保险基金支付一次性工伤医疗补助金"}],"answer":"ABCD","basis":"《工伤保险条例》第三十五条","image":null},{"id":1619,"category":"安全生产知识","type":"multiple","seq":119,"stem":"根据《工伤保险条例》，职工因工致残被鉴定为五级、六级伤残的，享受以下待遇（    ）","options":[{"key":"A","text":"从工伤保险基金按伤残等级支付一次性伤残补助金"},{"key":"B","text":"保留与用人单位的劳动关系，由用人单位安排适当工作"},{"key":"C","text":"难以安排工作的，由用人单位按月发给伤残津贴"},{"key":"D","text":"经工伤职工本人提出，该职工可以与用人单位解除或者终止劳动关系，由工伤保险基金支付一次性工伤医疗补助金"},{"key":"E","text":"由政府相关单位支付一次性伤残就业补助金"}],"answer":"ABCD","basis":"《工伤保险条例》第三十六条","image":null},{"id":1620,"category":"安全生产知识","type":"multiple","seq":120,"stem":"根据《工伤保险条例》，哪些情况应视同工伤（    ）","options":[{"key":"A","text":"在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的；"},{"key":"B","text":"工作时间前后从事预备性或收尾性工作受伤"},{"key":"C","text":"在抢险救灾等维护国家利益、公共利益活动中受到伤害的；"},{"key":"D","text":"职工在职业活动中，因接触粉尘、放射性物质和其他有毒、有害物质等因素而患国家《职业病分类和目录》中所列的职业病。"},{"key":"E","text":"职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的。"}],"answer":"ACE","basis":"《工伤保险条例》第十五条","image":null},{"id":1621,"category":"安全生产知识","type":"multiple","seq":121,"stem":"根据《工伤保险条例》，职工因工死亡，其近亲属按照下列规定从工伤保险基金领取丧葬补助金、供养亲属抚恤金和一次性工亡补助金（    ）","options":[{"key":"A","text":"丧葬补助金为6个月的统筹地区上年度职工月平均工资"},{"key":"B","text":"供养亲属抚恤金按照职工本人工资的一定比例发给由因工死亡职工生前提供主要生活来源、无劳动能力的亲属"},{"key":"C","text":"一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的20倍"},{"key":"D","text":"一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的10倍"},{"key":"E","text":"一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的15倍"}],"answer":"ABC","basis":"《工伤保险条例》第三十九条","image":null},{"id":1622,"category":"安全生产知识","type":"multiple","seq":122,"stem":"根据《工伤保险条例》，工伤职工有下列情形之一的，停止享受工伤保险待遇（    ）","options":[{"key":"A","text":"丧失享受待遇条件的"},{"key":"B","text":"拒不接受劳动能力鉴定的"},{"key":"C","text":"拒绝治疗的"},{"key":"D","text":"工伤职工达到退休年龄并办理退休手续后，停发伤残津贴，按照国家有关规定享受基本养老保险待遇"},{"key":"E","text":"工伤职工在停工留薪期满后死亡的"}],"answer":"ABC","basis":"《工伤保险条例》第四十二条","image":null},{"id":1623,"category":"安全生产知识","type":"multiple","seq":123,"stem":"根据《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，施工现场临时用电工程必须符合以下哪些规定（    ）","options":[{"key":"A","text":"采用三级配电系统"},{"key":"B","text":"采用TN-S接零保护系统"},{"key":"C","text":"采用二级漏电保护系统"},{"key":"D","text":"采用动照分设系统"},{"key":"E","text":"采用一机一闸一漏系统"}],"answer":"ABCE","basis":"《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，第1.0.3条","image":null},{"id":1624,"category":"安全生产知识","type":"multiple","seq":124,"stem":"根据《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，施工现场临时用电工程的配电系统应符合以下哪些要求（    ）","options":[{"key":"A","text":"总配电箱应设在靠近电源的区域"},{"key":"B","text":"分配电箱应设在用电设备或负荷相对集中的区域"},{"key":"C","text":"分配电箱与开关箱的距离不得超过30m"},{"key":"D","text":"开关箱与其控制的固定式用电设备的水平距离不宜超过5m"},{"key":"E","text":"配电箱、开关箱应装设在干燥、通风及常温场所"}],"answer":"ABCE","basis":"《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，第5章","image":null},{"id":1625,"category":"安全生产知识","type":"multiple","seq":125,"stem":"根据《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，施工现场临时用电工程的漏电保护器应符合以下哪些要求（    ）","options":[{"key":"A","text":"漏电保护器应装设在总配电箱、开关箱靠近负荷的一侧"},{"key":"B","text":"漏电保护器不得用于启动电气设备的操作"},{"key":"C","text":"漏电保护器应定期检查、维修和试验"},{"key":"D","text":"漏电保护器的额定漏电动作电流和额定漏电动作时间应符合设计要求"},{"key":"E","text":"漏电保护器的额定漏电动作电流应大于30mA"}],"answer":"ABCD","basis":"《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，第5.3条，第7.2条，第7.3条","image":null},{"id":1626,"category":"安全生产知识","type":"multiple","seq":126,"stem":"根据《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，施工现场临时用电工程的照明装置应符合以下哪些要求（    ）","options":[{"key":"A","text":"照明装置应符合《用电安全导则》GB/T 13869的原则"},{"key":"B","text":"室内、外灯具的安装高度和与易燃物的安全距离应符合规范要求"},{"key":"C","text":"荧光灯配套的电磁式镇流器应有防止发热或短路烧毁的措施"},{"key":"D","text":"照明装置应有明显的安全警示标志"},{"key":"E","text":"照明装置应有可靠的接地"}],"answer":"ABC","basis":"《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，第9章","image":null},{"id":1627,"category":"安全生产知识","type":"multiple","seq":127,"stem":"根据《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，施工现场临时用电工程的安全技术档案应包括以下哪些内容（    ）","options":[{"key":"A","text":"用电组织设计的全部资料"},{"key":"B","text":"修改用电组织设计的资料"},{"key":"C","text":"普工安装电箱的交底记录"},{"key":"D","text":"用电工程检查验收表"},{"key":"E","text":"电工安装、巡检、维修、拆除工作记录"}],"answer":"ABDE","basis":"《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，第3.0.10条","image":null},{"id":1628,"category":"安全生产知识","type":"multiple","seq":128,"stem":"根据《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，施工现场临时用电工程的拆除应符合以下哪些要求（    ）","options":[{"key":"A","text":"拆除工作应从用电侧开始"},{"key":"B","text":"拆除前，被拆除部分应与带电部分在电器上断开、隔离，并悬挂“禁止合闸、有人工作”等标识牌"},{"key":"C","text":"拆除前应确保电容器已进行有效放电"},{"key":"D","text":"拆除过程中，应避免对设备（设施）造成损伤"},{"key":"E","text":"拆除后应及时清理现场，恢复原状"}],"answer":"BCDE","basis":"《建筑与市政工程施工现场临时用电安全技术标准》JGJ 46-2024，第10章","image":null},{"id":1629,"category":"安全生产知识","type":"multiple","seq":129,"stem":"根据《建设工程安全生产管理条例》，施工单位应当建立健全以下哪些制度（    ）","options":[{"key":"A","text":"安全生产责任制度"},{"key":"B 产法》，生产经营单位的主要负责人应当具备哪些能力（    ）","options":[{"key":"A","text":"与本单位所从事的生产经营活动相应的安全生产知识"},{"key":"B","text":"与本单位所从事的生产经营活动相应的管理能力"},{"key":"C","text":"与本单位所从事的生产经营活动相应的应急处理能力"},{"key":"D","text":"与本单位所从事的生产经营活动相应的经济知识"},{"key":"E","text":"与本单位所从事的生产经营活动相应的技术能力"}],"answer":"AB","basis":"《中华人民共和国安全生产法》第二十七条","image":null},{"id":1642,"category":"安全生产知识","type":"multiple","seq":142,"stem":"根据《中华人民共和国安全生产法》，生产经营单位应当对哪些人员进行安全生产教育和培训（    ）","options":[{"key":"A","text":"从业人员"},{"key":"B","text":"被派遣劳动者"},{"key":"C","text":"实习学生"},{"key":"D","text":"外部参观人员"},{"key":"E","text":"临时工"}],"answer":"ABCE","basis":"《中华人民共和国安全生产法》第二十八条","image":null},{"id":1643,"category":"安全生产知识","type":"multiple","seq":143,"stem":"根据《建设工程应急预案编制与范例》，应急预案的评估与修订应包括以下哪些内容（    ）","options":[{"key":"A","text":"定期评估应急预案的有效性"},{"key":"B","text":"根据实际情况及时修订应急预案"},{"key":"C","text":"对应急预案的实施情况进行总结"},{"key":"D","text":"对应急预案的不足之处进行改进"},{"key":"E","text":"对应急预案的培训情况进行评估"}],"answer":"ABCD","basis":"《建设工程应急预案编制与范例》","image":null},{"id":1644,"category":"安全生产知识","type":"multiple","seq":144,"stem":"根据《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011,悬挑式脚手架的悬挑梁应满足以下哪些要求（    ）","options":[{"key":"A","text":"悬挑梁截面高度不应小于160mm"},{"key":"B","text":"悬挑梁截面高度不应小于200mm"},{"key":"C","text":"悬挑梁宜采用双轴对称截面的构件，如工字钢等"},{"key":"D","text":"悬挑梁宜采用焊接接长时，应按等强标准连接，焊缝质量满足一级焊缝的要求"},{"key":"E","text":"悬挑梁的锚固长度不应小于悬挑长度的1.25倍"}],"answer":"ACDE","basis":"《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011,第6.10条","image":null},{"id":1645,"category":"安全生产知识","type":"multiple","seq":145,"stem":"根据《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011,悬挑式脚手架的立杆设置应满足以下哪些要求（    ）","options":[{"key":"A","text":"立杆垂直度偏差不得大于架高的1/200"},{"key":"B","text":"立杆接头除在顶层可采用搭接外，其余接头必须采用对接扣件"},{"key":"C","text":"两相邻立杆接头不应设在同步跨内，两相邻立杆接头在高度方向错开的距离不应小于500mm"},{"key":"D","text":"立杆顶端应高出施工作业层1.5m"},{"key":"E","text":"立杆间距不大于1.5m"}],"answer":"ABCD","basis":"《建筑施工扣件式钢管脚手架安全技术规范》JGJ 130-2011,第6.10条","image":null},{"id":1646,"category":"安全生产知识","type":"multiple","seq":146,"stem":"根据《建设工程施工现场消防安全技术规范》GB 50720-2011，施工现场的消防安全责任应由哪些单位履行（    ）","options":[{"key":"A","text":"建设单位"},{"key":"B","text":"施工单位"},{"key":"C","text":"监理单位"},{"key":"D","text":"设计单位"},{"key":"E","text":"消防部门"}],"answer":"ABC","basis":"《建设工程施工现场消防安全技术规范》GB 50720-2011，第3.0.1条，第3.0.2条","image":null},{"id":1647,"category":"安全生产知识","type":"multiple","seq":147,"stem":"根据《建设工程施工现场消防安全技术规范》GB 50720-2011，施工现场办公区和生活区的火灾防控措施应包括以下哪些内容（    ）","options":[{"key":"A","text":"临时建构筑物符合消防安全要求"},{"key":"B","text":"不使用可燃夹芯彩钢板"},{"key":"C","text":"电气线路穿管保护到位"},{"key":"D","text":"禁止违规使用大功率电器"},{"key":"E","text":"设置消防疏散通道"}],"answer":"ABCD","basis":"《建设工程施工现场消防安全技术规范》GB 50720-2011，第4.2.1条、第5.2条、第6章","image":null},{"id":1648,"category":"安全生产知识","type":"multiple","seq":148,"stem":"根据《建设工程施工现场消防安全技术规范》GB 50720-2011，施工现场的易燃可燃物管理应包括以下哪些措施（    ）","options":[{"key":"A","text":"可燃材料按要求正确存放、堆放"},{"key":"B","text":"不得违规使用、储存易燃易爆等危化品"},{"key":"C","text":"设置绿化带"},{"key":"D","text":"定期清理可燃物"},{"key":"E","text":"设置在生活区的上风侧"}],"answer":"ABD","basis":"《建设工程施工现场消防安全技术规范》GB 50720-2011，第4.2.3条、第6.4条","image":null},{"id":1649,"category":"安全生产知识","type":"multiple","seq":149,"stem":"施工现场的消防安全处罚规定应包括以下哪些内容（    ）","options":[{"key":"A","text":"对经审批动火作业的处罚"},{"key":"B","text":"对动火作业现场未采取防火措施的处罚"},{"key":"C","text":"对未配备足够消防器材的处罚"},{"key":"D","text":"对擅自改变消防设施的处罚"},{"key":"E","text":"对施工现场吸烟、使用明火取暖等违反防火规定的处罚"}],"answer":"BCDE","basis":"《中华人民共和国消防法》第六十条","image":null},{"id":1650,"category":"安全生产知识","type":"multiple","seq":150,"stem":"根据《建筑施工高处作业安全技术规范》JGJ 80-2016，洞口作业时，以下哪些说法正确的是（    ）","options":[{"key":"A","text":"竖向洞口短边边长小于500mm时，应采取封堵措施"},{"key":"B","text":"垂直洞口短边边长大于或等于500mm时，应在临空一侧设置高度不小于1.2m的防护栏杆，并采用密目式安全立网或工具式栏板封闭，设置挡脚板"},{"key":"C","text":"垂直洞口短边边长大于或等于500mm时，应在临空一侧设置高度不小于1.2m的防护栏杆即可"},{"key":"D","text":"当非竖向洞口边长为25~500mm时，应采用符合要求的盖板覆盖"},{"key":"E","text":"当非竖向洞口边长为500~1500mm时，应采用盖板覆盖或防护栏杆等措施，并应固定牢固"}],"answer":"ABCE","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016，第4.2条","image":null},{"id":1651,"category":"安全生产知识","type":"multiple","seq":151,"stem":"根据《建筑施工高处作业安全技术规范》J 可证"},{"key":"C","text":"产品合格证"},{"key":"D","text":"制造监督检验证明"},{"key":"E","text":"安装使用说明书"}],"answer":"ABCDE","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号），第九条","image":null},{"id":1662,"category":"安全生产知识","type":"multiple","seq":162,"stem":"根据《建筑起重机械安全监督管理规定》（建设部令第166号），安装单位应当履行下列安全职责：（    ）","options":[{"key":"A","text":"按照安全技术标准及建筑起重机械性能要求，编制建筑起重机械安装、拆卸工程专项施工方案，并由本单位技术负责人签字"},{"key":"B","text":"按照安全技术标准及安装使用说明书等检查建筑起重机械及现场施工条件"},{"key":"C","text":"组织安全施工技术交底并签字确认"},{"key":"D","text":"制定建筑起重机械安装、拆卸工程生产安全事故应急救援预案"},{"key":"E","text":"将建筑起重机械安装、拆卸工程专项施工方案，安装、拆卸人员名单，安装、拆卸时间等材料报施工总承包单位和监理单位审核后，告知工程所在地县级以上地方人民政府建设主管部门"}],"answer":"ABCDE","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号），第十二条","image":null},{"id":1663,"category":"安全生产知识","type":"multiple","seq":163,"stem":"根据《建筑起重机械安全监督管理规定》（建设部令第166号），建筑起重机械安装、拆卸工程档案应当包括以下资料：（    ）","options":[{"key":"A","text":"安装、拆卸合同及安全协议书；"},{"key":"B","text":"安装、拆卸工程专项施工方案；"},{"key":"C","text":"安全施工技术交底的有关资料；"},{"key":"D","text":"安装工程验收资料；"},{"key":"E","text":"安装、拆卸工程生产安全事故应急救援预案"}],"answer":"ABCDE","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号），第十三条","image":null},{"id":1664,"category":"安全生产知识","type":"multiple","seq":164,"stem":"根据《建筑施工起重吊装安全技术规范》JGJ 276-2012， 下列选项中是起重吊装的一般规定的有哪些（    ）","options":[{"key":"A","text":"编制吊装作业施工组织设计，并应充分考虑施工现场的环境、道路、架空电线等情况。作业前应进行技术交底；作业中，未经技术负责人批准，不得随意更改"},{"key":"B","text":"参加起重吊装的人员应经过严格培训，取得培训合格证后，方可上岗"},{"key":"C","text":"作业前，应检查起重吊装所使用的起重机滑轮、吊索、卡环和地锚等，应确保其完好，符合安全要求"},{"key":"D","text":"起重作业人员必须穿防滑鞋、戴安全帽，高处作业应佩挂安全带，并应系挂可靠和严格遵守高挂低"},{"key":"E","text":"起重作业人员安装前可以使用无证人员"}],"answer":"ABCD","basis":"《建筑施工起重吊装安全技术规范》JGJ 276-2012， 第3章","image":null},{"id":1665,"category":"安全生产知识","type":"multiple","seq":165,"stem":"根据《建筑起重机械安全监督管理规定》（建设部令第166号），施工升降机应具有（    ）证，并在产权单位工商注册所在地县级以上建设行政主管部门备案登记","options":[{"key":"A","text":"特种设备制造许可证"},{"key":"B","text":"产品合格证"},{"key":"C","text":"使用说明书"},{"key":"D","text":"起重机械制造监督检验证书"},{"key":"E","text":"使用登记证"}],"answer":"ABCD","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号）相关规定","image":null},{"id":1666,"cate "multiple","seq":208,"stem":"根据《建筑起重机械安全监督管理规定》（建设部令第166号），安装单位有下列行为之一的，由县级以上地方人民政府建设主管部门责令限期改正，予以警告，并处以5000元以上3万元以下罚款（    ）。","options":[{"key":"A","text":"未按照安全技术标准及安装使用说明书等检查建筑起重机械及现场施工条件"},{"key":"B","text":"未组织安全施工技术交底并签字确认"},{"key":"C","text":"未制定建筑起重机械安装、拆卸工程生产安全事故应急救援预"},{"key":"D","text":"未将建筑起重机械安装、拆卸工程专项施工方案，安装、拆卸人员名单，安装、拆卸时间等材料报施工总承包单位和监理单位审核后，告知工程所在地县级以上地方人民政府建设主管部门"},{"key":"E","text":"未办理安装告知的"}],"answer":"ACD","basis":"《建筑起重机械安全监督管理规定》（建设部令第166号）,第二十九条","image":null},{"id":1709,"category":"安全生产知识","type":"multiple","seq":209,"stem":"根据《中华人民共和国特种设备安全法》，特种设备安全工作应当坚持（    ）的原则。","options":[{"key":"A","text":"安全第一"},{"key":"B","text":"预防为主"},{"key":"C","text":"节能环保"},{"key":"D","text":"综合治理"},{"key":"E","text":"防治结合"}],"answer":"ABCD","basis":"《中华人民共和国特种设备安全法》第三条","image":null},{"id":1710,"category":"安全生产知识","type":"multiple","seq":210,"stem":"根据《建筑施工塔式起重机安装、使用、拆卸安全技术规程》JGJ 196-2010，“三定”制度是做好塔式起重机使用管理的基础，“三定”制度是（    ）","options":[{"key":"A","text":"定人"},{"key":"B","text":"定机"},{"key":"C","text":"定时"},{"key":"D","text":"定岗位责任"},{"key":"E","text":"定材料"}],"answer":"ABD","basis":"《建筑施工塔式起重机安装、使用、拆卸安全技术规程》JGJ 196-2010，第2.0.6条","image":null},{"id":1711,"category":"安全生产知识","type":"multiple","seq":211,"stem":"根据《建筑施工起重吊装工程安全技术规范》JGJ 276-2012，起重吊装作业中使用的吊钩、吊环，其表面要光滑，不能有（    ）等缺陷。","options":[{"key":"A","text":"剥裂"},{"key":"B","text":"刻痕"},{"key":"C","text":"锐角"},{"key":"D","text":"接缝"},{"key":"E","text":"裂纹"}],"answer":"ABCDE","basis":"《建筑施工起重吊装工程安全技术规范》JGJ 276-2012,第3.0.5条","image":null},{"id":1712,"category":"安全生产知识","type":"multiple","seq":212,"stem":"根据《建筑施工升降机安装、使用、拆卸安全技术规程》JGJ 215-2010，施工升降机标准节螺栓可以采用（    ）等防松的安装方式。","options":[{"key":"A","text":"平垫+弹垫"},{"key":"B","text":"双螺母"},{"key":"C","text":"螺母内尼龙套"},{"key":"D","text":"单螺母"},{"key":"E","text":"预警螺母"}],"answer":"ABC","basis":"《建筑施工升降机安装、使用、拆卸安全技术规程》JGJ 215-2010,第4.2.6条","image":null},{"id":1713,"category":"安全生产知识","type":"multiple","seq":213,"stem":"根据《塔式起重机安全规程》GB5144-2006，塔式起重机卷扬机使用应符合下列规定：（    ）","options":[{"key":"A","text":"卷扬机应无渗漏，润滑应良好，各连接紧固件应完整、齐全；当额定荷载试验工况时，应运行平稳、无异常声响；"},{"key":"B","text":"卷筒两侧边缘超过最外层钢丝绳的高度不应小于钢丝绳直径的2倍，卷筒上钢丝绳层钢丝绳排列应整齐有序；"},{"key":"C","text":"卷筒上钢丝绳绳端固结应符合使用说明书的要求；"},{"key":"D","text":"当吊钩位于最低位置时，卷筒上应至少保留3圈安全圈。"},{"key":"E","text":"卷扬机不需要定期检查"}],"answer":"ABCD","basis":"《塔式起重机安全规程》GB 5144-2006,第5.3条","image":null},{"id":1714,"category":"安全生产知识","type":"multiple","seq":214,"stem":"根据《塔式起重机安全规程》GB5144-2006，每台塔吊均应由耐用且清晰的图标标牌，该标牌应固定在司机处于操作位时可见的位置，其图表包括但不限于以下内容：（    ）","options":[{"key":"A","text":"对应不同臂长、倍率时各幅度的起重量、合适的起升速度及得当的平衡重布置；"},{"key":"B","text":"与限位器和操作步骤有关的警告提示；"},{"key":"C","text":"最大允许工作风速；"},{"key":"D","text":"应将吊索及附加取物装置作为起升载荷组成部分的提示"},{"key":"E","text":"施工进度牌"}],"answer":"ABCD","basis":"《塔式起重机安全规程》GB5144-2006相关规定","image":null},{"id":1715,"category":"安全生产知识","type":"multiple","seq":215,"stem":"根据《塔式起重机安全规程》GB5144-2006，塔机安装位置的选择应考虑所有影响其安全操作的因素，特别注意哪几点：（    ）","options":[{"key":"A","text":"地基承载和附着条件；"},{"key":"B","text":"现场和附近的其他危险因素；"},{"key":"C","text":"在工作或非工作状态下风力的影响；"},{"key":"D","text":"满足安装架设（拆卸）空间和运输通道（含辅助起重机站位）要求；"},{"key":"E","text":"熟悉并拥有该塔机的用户手册"}],"answer":"ABCD","basis":"《塔式起重机安全规程》GB 5144-2006,第10.6条","image":null},{"id":1716,"category":"安全生产知识","type":"multiple","seq":216,"stem":"根据《塔式起重机安全规程》GB5144-2006，自升式塔式起重机的顶升加节，应符合下列要求（    ）","options":[{"key":"A","text":"顶升系统必须完好；"},{"key":"B","text":"顶升前塔式起重机下支座与顶升套架应可靠连接；"},{"key":"C","text":"顶升前应确保顶升横梁搁置正确；"},{"key":"D","text":"顶升前应将塔式起重机配平；"},{"key":"E","text":"顶升过程中可以进行起升、回转、变幅等操作；"}],"answer":"ABCD","basis":"《塔式起重机安全规程》GB 5144-2006,第10.7条","image":null},{"id":1717,"category":"安全生产知识","type":"multiple","seq":217,"stem":"根据《龙门架及井架物料提升机安全技术规范》JGJ 88-2010，物料提升机附墙架安装要求是（    ）。","options":[{"key":"A","text":"附墙架与架体之间应采用刚性连接"},{"key":"B","text":"附墙架可直接焊接于架体上"},{"key":"C","text":"附墙架的设置间隔一般不超过9米"},{"key":"D","text":"最后一组附墙架，应使其上的架体至顶部的自由高度满足规范要求"},{"key":"E","text":"应尽量选用制造商提供的标准件"}],"answer":"ACD","basis":"《龙门架及井架物料提升机安全技术规范》JGJ 88-2010,第8.2.1条、第8.2.2条、第8.2.3条和第8.2.4条","image":null},{"id":1718,"category":"安全生产知识","type":"multiple","seq":218,"stem":"根据《中华人民共和国安全生产法》，生产经营单位进行爆破、（    ）以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专人进行现场安全管理，确保操作规程的遵守和安全措施的落实。","options":[{"key":"A","text":"吊装"},{"key":"B","text":"建构筑物拆除"},{"key":"C","text":"动火"},{"key":"D","text":"临时用电"},{"key":"E","text":"清理垃圾"}],"answer":"ACD","basis":"《中华人民共和国安全生产法》第四十三条","image":null},{"id":1719,"category":"安全生产知识","type":"multiple","seq":219,"stem":"根据《中华人民共和国安全生产法》，生产经营单位的全员安全生产责任制应当明确各岗位的（    ）、（    ）和（    ）等内容，并建立相应机制，加强对全员安全生产责任制落实情况的（    ）。","options":[{"key":"A","text":"责任人员"},{"key":"B","text":"责任范围"},{"key":"C","text":"考核标准"},{"key":"D","text":"监督考核"},{"key":"E","text":"执行考核"}],"answer":"ABCD","basis":"《中华人民共和国安全生产法》第二十二条","image":null},{"id":1720,"category":"安全生产知识","type":"multiple","seq":220,"stem":"根据《中华人民共和国安全生产法》，生产经营单位的决策机构、主要负责人或者个人经营投资人未依照本法规定保证安全生产所必需的资金投入，导致发生生产安全事故的，对生产经营单位的（    ）给予（    ）处分，对个人经营投资人处二万元以上二十万元以下罚款，构成犯罪的，依照刑法有关规定追究刑事责任。","options":[{"key":"A","text":"主要负责人"},{"key":"B","text":"财务副总经理"},{"key":"C","text":"撤职"},{"key":"D","text":"降级"},{"key":"E","text":"吊销许可证"}],"answer":"AC","basis":"《中华人民共和国安全生产法》第九十三条","image":null},{"id":1721,"category":"安全生产知识","type":"multiple","seq":221,"stem":"如起重机械触碰了带电电线或电缆，以下哪些做法是正确的（    ）。","options":[{"key":"A","text":"警告所有其他人员远离起重机械，不要触碰起重机械、绳索或物品的任何部分；"},{"key":"B","text":"司机室内司机应第一时间打开驾驶室门离开起重机械设备；"},{"key":"C","text":"在没有任何人接近起重机械的情况下，司机应尝试独立开动起重机械直到动力电缆或电线与起重机械脱离；"},{"key":"D","text":"如果起重机械不能开动，司机应留在驾驶室内。设法立即通知供电部门。在未确认处于安全状态下，不要采取任何行动；"},{"key":"E","text":"救援人员应第一时间打开驾驶室门"}],"answer":"ACD","basis":"/","image":null},{"id":1722,"category":"安全生产知识","type":"multiple","seq":222,"stem":"根据《建筑施工塔式起重机安装、使用、拆卸安全技术规程》JGJ 196-2010，塔机底架与支腿之间的结构形式有（    ）","options":[{"key":"A","text":"水母式"},{"key":"B","text":"井架式"},{"key":"C","text":"固定式"},{"key":"D","text":"十字架式"},{"key":"E","text":"行走式"}],"answer":"ABD","basis":"《建筑施工塔式起重机安装、使用、拆卸安全技术规程》JGJ 196-2010，第2.0.2条","image":null},{"id":1723,"category":"安全生产知识","type":"multiple","seq":223,"stem":"根据《塔式起重机》GB/T 5031-2008，塔机在安装、增加塔身标准节之前应对结构件和高强度螺栓进行检查，若发现（    ）应修复或更换后方可进行安装。","options":[{"key":"A","text":"目视可见的结构件出现脱漆；"},{"key":"B","text":"连接件的轴、孔严重磨损；"},{"key":"C","text":"目视可见的结构件裂纹及焊缝裂纹；"},{"key":"D","text":"结构件整体或局部塑性变形，销孔塑性变形"},{"key":"E","text":"连接件出现脱漆；"}],"answer":"BCD","basis":"《塔式起重机》GB/T 5031-2008,第6.3.3.2条","image":null},{"id":1724,"category":"安全生产知识","type":"multiple","seq":224,"stem":"根据《龙门架及井架物料提升机安全技术规范》JGJ88-2010，物料提升机有下列情况之一时，应进行使用过程检验：（    ）。","options":[{"key":"A","text":"正常工作状态下的物料提升机作业周期超过1年"},{"key":"B","text":"物料提升机闲置时间超过6个月"},{"key":"C","text":"经过大修、技术改进及新安装的物料提升机交付使用前"},{"key":"D","text":"经过暴风、地震及机械事故，物料提升机结构的刚度、稳定性及安全装置的功能受到损害的"},{"key":"E","text":"正常工作状态下的物料提升机作业周期超过2年"}],"answer":"ABCD","basis":"《龙门架及井架物料提升机安全技术规范》JGJ 88-2010,第12.0.2条","image":null},{"id":1725,"category":"安全生产知识","type":"multiple","seq":225,"stem":"根据《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》，下列说法正确的是（   ）","options":[{"key":"A","text":"企业主要负责人应当每半年至少组织开展1次应急预案演练;企业安全总监应当协助做好组织实施工作"},{"key":"B","text":"企业主要负责人应当根据项目进度，带班检查企业在建项目的安全生产工作，每年检查时间不少于企业全年施工时间的25%，相关检查记录分别在企业和项目存档备查"},{"key":"C","text":"企业主要负责人应当熟悉房屋市政工程生产安全重大事故隐患判定标准，每月对企业重大事故隐患排查整改情况至少开展1次专项检查"},{"key":"D","text":"特级、一级施工总承包资质序列企业和一级专业承包资质序列企业应设置专职安全总监"},{"key":"E","text":"企业安全总监应当通过安全生产知识及管理能力的考核，具备中级及以上注册安全工程师执业资格，取得建筑施工企业主要负责人安全生产考核合格证书，且在本行业领域内从事安全管理工作满3年。"}],"answer":"ABCE","basis":"《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》相关规定","image":null},{"id":1726,"category":"安全生产知识","type":"judge","seq":1,"stem":"危险性较大的分部分项工程未编制专项施工方案属于重大事故隐患 。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《房屋市政工程生产安全重大事故隐患判定标准（2024 版）》第四条","image":null},{"id":1727,"category":"安全生产知识","type":"judge","seq":2,"stem":"建设单位对因建设工程施工可能造成损害的毗邻建筑物、构筑物和地下管线等，应当采取专项防护措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程安全生产管理条例》（国务院令第393号），第三十条","image":null},{"id":1728,"category":"安全生产知识","type":"judge","seq":3,"stem":"《建设工程施工现场环境与卫生标准》JGJ146-2004，于2014年6月1日废止，同时执行新行业标准《建设工程施工现场环境与卫生标准》JGJ146-2013。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建设工程施工现场环境与卫生标准》JGJ 146-2013","image":null},{"id":1729,"category":"安全生产知识","type":"judge","seq":4,"stem":"建设工程施工总承包单位应对施工现场的环境与卫生负总责，分包单位无需服从总承包单位管理。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ 146-2013,第3.0.1条","image":null},{"id":1730,"category":"安全生产知识","type":"judge","seq":5,"stem":"施工人员的教育培训、考核不需要包括环境与卫生等有关内容。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ 146-2013,第3.0.6条","image":null},{"id":1731,"category":"安全生产知识","type":"judge","seq":6,"stem":"施工现场应实行封闭管理，并应才用硬质围挡。市区主要路段的施工现场围挡高度不应低于1.8m，一般路段围挡高度不应低于2.5m。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建设工程施工现场环境与卫生标准》JGJ 146-2013,第3.0.8条","image":null},{"id":1732,"category":"安全生产知识","type":"judge","seq":7,"stem":"根据《中华人民共和国食品安全法》的有关规定，施工现场保留食品、原料采购台账和原始单据，达到可追溯性要求。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国食品安全法》第四十二条","image":null},{"id":1733,"category":"安全生产知识","type":"judge","seq":8,"stem":"根据《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，施工现场主要道路应进行硬化，裸露的场地无需管理。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，第4.0.1条","image":null},{"id":1734,"category":"安全生产知识","type":"judge","seq":9,"stem":"根据《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，现场使用预拌砂浆可以不采用封闭、降尘、降噪措施。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，第4.0.1条","image":null},{"id":1735,"category":"安全生产知识","type":"judge","seq":10,"stem":"根据《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，施工现场生活区宿舍、休息室必须设置可开启式外窗，床铺可以使用通铺。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，第6.0.5条","image":null},{"id":1736,"category":"安全生产知识","type":"judge","seq":11,"stem":"根据《施工企业安全生产评价标准》JGJ/T 77-2010，施工企业发生的未遂事故，无需按照“四不放过”原则处理。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《施工企业安全生产评价标准》JGJ/T 77-2010，第3.0.4条","image":null},{"id":1737,"category":"安全生产知识","type":"judge","seq":12,"stem":"依据《职业病分类和目录》（国卫职健发〔2024〕39号），白内障不属于职业性眼病。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《职业病分类和目录》（国卫职健发〔2024〕39号）“三、职业性眼病”第三条","image":null},{"id":1738,"category":"安全生产知识","type":"judge","seq":13,"stem":"安全生产监督部门是作业场所职业危害预防控制的责任主体。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《中华人民共和国职业病防治法》第四条","image":null},{"id":1739,"category":"安全生产知识","type":"judge","seq":14,"stem":"根据《中华人民共和国职业病防治法》，化学因素，包括生产性粉尘和化学有毒物质。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国职业病防治法》第八十五条","image":null},{"id":1740,"category":"安全生产知识","type":"judge","seq":15,"stem":"根据《中华人民共和国职业病防治法》，职业病，指企业、事业单位和个体经济组织的劳动者在职业活动中，因接触粉尘、放射性物质和其他有毒有害因素而引起的疾病。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《中华人民共和国职业病防治法》第二条","image":null},{"id":1741,"category":"安全生产知识","type":"judge","seq":16,"stem":"根据《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，施工现场应设置排水沟及沉淀池，施工用水经沉淀可直接排入市政污水管网。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis":"《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，第4.0.6条","image":null},{"id":1742,"category":"安全生产知识","type":"judge","seq":17,"stem":"根据《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，食堂应配备必要的排风和冷藏设施，宜设置通风天窗和油烟净化装置，油烟净化装置应定期清洗。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"A","basis":"《建筑与市政施工现场安全卫生与职业健康通用规范》GB 55034-2022，第5.2.6条","image":null},{"id":1743,"category":"安全生产知识","type":"judge","seq":18,"stem":"彩钢板活动房是一种以型钢为骨架，以夹芯板为墙板材料的经济型临建房屋，安装限流器后可以使用大功率电器。（   ）","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":"B","basis"
